<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141311">
<meta name="color-scheme" content="dark">
<title>Мій бюджет</title>
<!-- Для встановлюваної програми (GitHub Pages). В Apps Script ці рядки ні на що не впливають -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<script>
// Програма відкрита напряму (не всередині Apps Script чи сторінки-демо)
window.BUDGET_PWA = (function () { try { return window.top === window && !/google/.test(location.hostname); } catch (e) { return false; } })();
// Іконка для iPhone малюється тут же — окремий PNG-файл не потрібен
if (window.BUDGET_PWA) (function () {
  try {
    var c = document.createElement('canvas'), x = c.getContext('2d'); c.width = c.height = 180;
    x.fillStyle = '#F0703F'; x.fillRect(0, 0, 180, 180);
    var s = 180 * .56 / 24, o = 180 * .22; x.setTransform(s, 0, 0, s, o, o);
    x.strokeStyle = '#1A0F0A'; x.lineWidth = 1.8; x.lineCap = 'round'; x.lineJoin = 'round';
    x.stroke(new Path2D('M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3'));
    x.stroke(new Path2D('M6.5 8H17.5A2.5 2.5 0 0 1 20 10.5V16.5A2.5 2.5 0 0 1 17.5 19H6.5A2.5 2.5 0 0 1 4 16.5V10.5A2.5 2.5 0 0 1 6.5 8Z'));
    x.fillStyle = '#1A0F0A'; x.beginPath(); x.arc(16, 13.5, 1.3, 0, Math.PI * 2); x.fill();
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
})();
</script>
<style>
:root{
  --paper:#141311; --card:#1D1B18; --sunk:#27241F; --raise:#2E2A25; --line:#38332C;
  --ink:#F3EDE3; --ink2:#C7BEB1; --mute:#9A9084;
  --accent:#F0703F; --on-accent:#1A0F0A; --accent-soft:rgba(240,112,63,.16);
  --ok:#5CC690; --warn:#E8B44E; --bad:#F27A6E;
  --ok-bg:rgba(92,198,144,.14); --warn-bg:rgba(232,180,78,.14); --bad-bg:rgba(242,122,110,.15);
  --sans:"Segoe UI Variable Text","SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-hero:clamp(48px,13vw,60px);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-card:24px; --pad-card:16px; --r-inner:8px; --tap:44px; --side:244px;
  --fast:150ms; --mid:250ms; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(240,112,63,.08),transparent 70%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-inner)}
.num{font-variant-numeric:tabular-nums}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;color:var(--mute)}
.hint{font-size:var(--fs-xs);color:var(--mute)}

.app{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s5)) var(--s4) calc(env(safe-area-inset-bottom) + 112px)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3) var(--s4);margin-bottom:var(--s5)}
.top h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.top .rates{font-size:var(--fs-xs);color:var(--mute);margin-top:var(--s1)}
.actions{display:flex;gap:var(--s2);align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-inner);padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-width:var(--tap);height:40px;padding:0 var(--s3);border-radius:6px;font-weight:600;font-size:var(--fs-sm);color:var(--ink2);transition:background var(--fast),color var(--fast)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s5);border-radius:12px;font-weight:600;font-size:var(--fs-sm);transition:background var(--fast),transform var(--fast)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#F5845A}
.btn-secondary{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-secondary:hover{background:var(--raise)}
.btn-quiet{color:var(--ink2)} .btn-quiet:hover{background:var(--sunk)}
.btn-danger{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-bg)} .btn-danger:hover{background:var(--bad-bg)}
.btn-sm{min-height:36px;padding:0 var(--s3);font-size:var(--fs-xs);border-radius:10px}
[aria-busy="true"] .spin-ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.add-desktop{display:none}

.grid{display:flex;flex-direction:column;gap:var(--s4)}
.col{display:contents}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--pad-card);min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 12px 28px -18px rgba(0,0,0,.6);animation:rise var(--mid) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
.card h2 small{font-size:var(--fs-xs);font-weight:500;color:var(--mute);text-align:right}
#hero{order:1}#cats{order:2}#cal{order:3}#hist{order:4}

/* головне число */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.badge{display:inline-flex;align-items:center;gap:var(--s1);height:28px;padding:0 var(--s3);border-radius:999px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.big{font-family:var(--serif);font-size:var(--fs-hero);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:var(--s2) 0 var(--s1)}
.big.pulse{animation:pulse 300ms var(--ease)}
@keyframes pulse{50%{transform:scale(1.03)}}
.sub{color:var(--ink2);font-size:var(--fs-sm)} .sub b{color:var(--ink);font-weight:600}
.stack{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk);margin:var(--s4) 0 var(--s2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:var(--fs-xs);color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:var(--s1)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s4)}
.tile{background:var(--sunk);border-radius:var(--r-inner);padding:var(--s3);min-width:0}
.tile b{display:block;font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;line-height:1.2;margin:var(--s1) 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.over{background:var(--bad-bg)} .tile.over b,.tile.over small{color:var(--bad)}
.delta{font-weight:700} .delta.up{color:var(--bad)} .delta.down{color:var(--ok)}

/* категорії */
.cat{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;width:100%;min-height:56px;text-align:left;padding:var(--s2);border-radius:12px;transition:background var(--fast)}
.cat+.cat{margin-top:2px}
.cat:hover{background:var(--sunk)}
.ic{display:grid;place-items:center;flex:none}
.cat .ic,.tx .ic{width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.cat .ic{grid-row:span 3}
.cat .nm{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .lf{font-family:var(--serif);font-weight:600;font-size:var(--fs-md);text-align:right;white-space:nowrap}
.cat .bar{grid-column:2 / 4;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:var(--s1) 0}
.cat .bar i{display:block;height:100%;border-radius:999px}
.cat .meta{grid-column:2 / 4;display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--fs-xs);color:var(--mute)}
.st{font-weight:600;white-space:nowrap} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.ok{color:var(--ok)}

/* календар */
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s1)}
.dow span{font-size:var(--fs-xs);font-weight:600;color:var(--mute);text-align:center;padding-bottom:var(--s1)}
.day{position:relative;aspect-ratio:1/1.05;border-radius:var(--r-inner);padding:var(--s1) 6px;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--fs-xs);background:var(--sunk);min-width:0;overflow:hidden}
.day .d{font-weight:600;color:var(--ink2)}
.day .v{font-size:11px;font-weight:600;text-align:right;white-space:nowrap}
.day.zero,.day.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.day.future{opacity:.45}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.over{background:var(--bad-bg)} .day.over .v{color:var(--bad)}
.day.over::after{content:"!";position:absolute;top:3px;right:5px;font-weight:800;font-size:11px;color:var(--bad)}
.cal-key{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--fs-xs);color:var(--mute);margin-top:var(--s3)}
.cal-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:var(--s1);vertical-align:-1px}

/* історія */
.search{margin-bottom:var(--s2)}
.filter{display:inline-flex;gap:var(--s1);align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 0 0 var(--s3);font-size:var(--fs-xs);font-weight:600;margin:0 var(--s1) var(--s2) 0}
.filter button{width:36px;height:36px;border-radius:50%;color:var(--paper);font-size:14px}
.group{font-size:var(--fs-xs);font-weight:600;color:var(--mute);display:flex;justify-content:space-between;padding:var(--s4) var(--s2) var(--s1)}
.group:first-child{padding-top:var(--s1)}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:56px;text-align:left;padding:var(--s2);border-radius:12px;transition:background var(--fast)}
.tx:hover{background:var(--sunk)}
.tx.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{from{background:var(--ok-bg)}}
.tx .t{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;font-family:var(--serif);font-weight:600;font-size:var(--fs-md);white-space:nowrap}
.tx .a small{display:block;font-family:var(--sans);font-weight:400;font-size:var(--fs-xs);color:var(--mute)}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--ink2);font-size:var(--fs-sm)}
.empty .e-ic{display:grid;place-items:center;width:56px;height:56px;margin:0 auto var(--s3);border-radius:16px;background:var(--sunk);color:var(--ink2);font-size:24px}
.empty b{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:var(--s1)}
.empty .btn{margin-top:var(--s4)}

/* редактор бюджету */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--mute);margin-top:2px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.wait::before{background:var(--warn);animation:blink 1s ease-in-out infinite}
.sync.err::before{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.bud-total{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);background:var(--sunk);border-radius:16px;padding:var(--s3) var(--s4);margin:var(--s2) 0 var(--s3)}
.bud-total b{display:block;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600;line-height:1.1}
.bud-total .r{text-align:right;font-size:var(--fs-xs);color:var(--mute)}
.bud-list{display:flex;flex-direction:column}
.bud{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;padding:var(--s2) 0}
.bud+.bud{border-top:1px solid var(--line)}
.bud .ic{width:36px;height:36px;border-radius:10px;font-size:17px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.bud .nm{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .nm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud.chg .nm small{color:var(--accent)}
.step{display:flex;align-items:center;background:var(--sunk);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.bud.chg .step{box-shadow:inset 0 0 0 1px var(--accent)}
.bud.bad .step{box-shadow:inset 0 0 0 1px var(--bad)}
.step button{width:40px;height:44px;display:grid;place-items:center;color:var(--ink2);font-size:16px;border-radius:12px}
.step button:hover{color:var(--ink);background:var(--raise)}
.step label{display:flex;align-items:center;color:var(--mute);font-size:var(--fs-sm)}
.step input{width:64px;height:44px;border:0;background:none;text-align:right;font-family:var(--serif);font-weight:600;font-size:var(--fs-md);font-variant-numeric:tabular-nums;outline:none;padding:0 2px}
.bud .lock{font-size:var(--fs-xs);color:var(--mute);text-align:right;white-space:nowrap}
.bud .lock b{display:block;font-family:var(--serif);font-size:var(--fs-md);color:var(--ink)}
.bud .fx{display:inline-flex;align-items:center;gap:4px;margin-top:4px;min-height:28px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.bud .fx:hover{color:var(--ink)}
.bud .fx[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.bud-tools{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0 0 var(--s2)}
#budgetSheet .note{font-size:var(--fs-xs);color:var(--mute);margin:var(--s2) 0 var(--s3)}

/* встановлювана програма: підключення */
.pwa-only{display:none} body.pwa .pwa-only{display:inline-flex}
.conn{max-width:520px;margin:0 auto}
.conn h2{justify-content:flex-start;gap:var(--s2)}
.conn .btn,#connSheet .btn{width:100%;margin-top:var(--s2)}
.conn .note,#connSheet .note{font-size:var(--fs-sm);color:var(--ink2);margin-bottom:var(--s4)}
.conn ol{margin:0 0 var(--s4) 18px;font-size:var(--fs-sm);color:var(--ink2)}
.conn ol li+li{margin-top:4px}
.tx .s .pend,.tt .pend{color:var(--warn);font-weight:600}

/* статистика */
#stats{display:none;flex-direction:column;gap:var(--s4)}
.st-bar{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) 0;margin-top:calc(-1 * var(--s2));background:linear-gradient(var(--paper) 80%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.kpi{background:var(--card);border-radius:16px;padding:var(--s3) var(--s4);min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.kpi b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-grid{display:flex;flex-direction:column;gap:var(--s4)}
.chart-wrap{position:relative;width:100%;height:clamp(180px,26vh,240px);overflow:hidden}
.chart-wrap svg{display:block;width:100%;height:100%}
.ax{font-size:11px;fill:var(--mute);font-family:var(--sans)}
.gridl{stroke:var(--line);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.ckey{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--fs-xs);color:var(--ink2);margin-top:var(--s2)}
.ckey i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.ckey i.dash{background:repeating-linear-gradient(90deg,var(--mute) 0 4px,transparent 4px 7px)}
.hbar{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s2) var(--s1);border-radius:10px;transition:background var(--fast)}
.hbar:hover{background:var(--sunk)}
.hbar .ic{color:var(--c);font-size:17px}
.hbar .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .v{font-size:var(--fs-sm);font-weight:600;text-align:right;white-space:nowrap}
.hbar .v small{font-weight:500;color:var(--mute);margin-left:6px}
.hbar .track{grid-column:2 / 4;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;position:relative}
.hbar .track i{display:block;height:100%;border-radius:999px;background:var(--c)}
.hbar .track .pl{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);border-radius:1px}
.hbar.sel{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.vbars{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--s2);align-items:end;height:clamp(140px,20vh,180px)}
.vb{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;border-radius:8px;cursor:default}
.vb:hover{background:rgba(255,255,255,.03)}
.vb .plot{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vb .plot i{display:block;width:70%;max-width:34px;border-radius:4px 4px 0 0;background:var(--c,var(--ok));min-height:2px}
.vb .plot i.over{background:var(--bad)}
.vb .plot i.now{background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 55%,var(--card)) 5px 10px)}
.vb .plot .lim{position:absolute;left:8%;right:8%;border-top:2px dashed var(--mute)}
.vb b{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.vb span{font-size:11px;color:var(--mute);white-space:nowrap}
.vb.peak .plot i{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ink2)}
.rank{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;padding:var(--s2) var(--s1)}
.rank+.rank{border-top:1px solid var(--line)}
.rank .n{font-size:var(--fs-xs);font-weight:700;color:var(--mute);text-align:center}
.rank .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--mute)}

  <div class="brand"><span class="logo"><i data-i="wallet"></i></span><div><b>Мій бюджет</b><small id="sideSub">Google Sheets</small></div></div>
  <button class="btn btn-primary add" data-open-add><i data-i="plus"></i> Додати витрату</button>
  <button class="nav on" data-tab="over"><i data-i="pie"></i>Огляд</button>
  <button class="nav" data-tab="stats"><i data-i="chart"></i>Статистика</button>
  <button class="nav" data-tab="hist"><i data-i="list"></i>Історія<span class="k num" id="navHist"></span></button>
  <button class="nav" data-tab="arch"><i data-i="archive"></i>Архів</button>
  <button class="nav" data-open-budget><i data-i="edit"></i>Бюджет</button>
  <div class="side-foot" id="sideFoot"></div>
</aside>
<div class="app">
  <header class="top">
    <div>
      <div class="label" id="eyebrow">Бюджет на місяць</div>
      <h1 id="title">Мій бюджет</h1>
      <div class="rates num" id="rates"></div>
      <div class="sync wait" id="sync" role="status" aria-live="polite">з'єднуюсь з таблицею…</div>
    </div>
    <div class="actions">
      <div class="seg" id="dispSeg" role="group" aria-label="Валюта відображення">
        <button data-c="EUR" class="on" aria-label="Показувати в євро">€</button><button data-c="UAH" aria-label="Показувати в гривнях">₴</button><button data-c="USD" aria-label="Показувати в доларах">$</button>
      </div>
      <button class="btn btn-secondary pwa-only" id="settings" title="Підключення до таблиці" aria-label="Підключення до таблиці"><i data-i="gear"></i></button>

<nav class="tabbar" aria-label="Розділи">

  <button class="tab" data-tab="arch"><i data-i="archive"></i>Архів</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="grab"></div>
  <h3 id="addTitle">Нова витрата</h3>
  <div class="f">
    <label for="amt">Сума</label>
    <div class="box amt" id="amtBox"><span class="sym" id="curSym">€</span><input id="amt" inputmode="decimal" enterkeyhint="done" placeholder="0,00" autocomplete="off"></div>

<script>
/* ---------- дані: Apps Script або демо ---------- */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// Встановлювана програма (GitHub Pages): той самий інтерфейс, дані — через BudgetApi
const PWA = !IS_GAS && !!window.BUDGET_PWA;

const Demo = (() => {
  const CATS = [
    {name:'Житло (Гуртожиток)', plan:85, fixed:85},
    {name:'Харчування та їжа', plan:140},
    {name:'Транспорт', plan:10},
    {name:'Навчання', plan:9},
    {name:"Зв'язок", plan:16},
    {name:'Інше', plan:40},
  ];
  const rates = {uah: 51.02, usd: 1.11};
  const today = '2026-11-11';
  // Листопад — ваші справжні суми з дашборду
  const nov = [
    ['2026-11-10','Харчування та їжа',1.29,'Вода'],
    ['2026-11-09','Транспорт',8.20,'IMHD квиток'],
    ['2026-11-08','Харчування та їжа',13.97,'Lidl'],
    ['2026-11-08','Інше',26.46,'dm drogerie'],
    ['2026-11-07','Харчування та їжа',3.90,'Кава й булочка'],
    ['2026-11-05','Інше',0.52,'Друк'],
    ['2026-11-03','Харчування та їжа',10.34,'Billa'],
    ['2026-11-02','Харчування та їжа',15.11,'Kaufland'],
    ['2026-11-02',"Зв'язок",16.00,'Kyivstar'],
  ].map((r, i) => ({row: 100 - i, date: r[0], category: r[1], amount: r[2], currency: 'EUR', note: r[3]}));

  // Серпень–жовтень — вигадана історія для демо статистики
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const hist = [];
  ['2026-08', '2026-09', '2026-10'].forEach((ym, mi) => {
    const [y, m] = ym.split('-').map(Number), dim = new Date(y, m, 0).getDate();
    hist.push([ym + '-02', "Зв'язок", 16, 'Kyivstar'], [ym + '-05', 'Інше', 3.99, 'Spotify']);
    if (m === 9) hist.push([ym + '-03', 'Навчання', 24.5, 'Підручники'], [ym + '-15', 'Навчання', 13.5, 'Книгарня']);
    for (let d = 1; d <= dim; d++) {
      const ds = ym + '-' + String(d).padStart(2, '0'), wd = new Date(y, m - 1, d).getDay();
      const shop = rnd() < (wd === 6 || wd === 0 ? .8 : .45);
      if (shop) hist.push([ds, 'Харчування та їжа', +(6 + rnd() * (wd === 6 ? 22 : 12)).toFixed(2), pick(['Lidl', 'Lidl', 'Billa', 'Kaufland', 'Tesco'])]);
      if (rnd() < .35) hist.push([ds, 'Харчування та їжа', +(1.6 + rnd() * 3).toFixed(2), pick(['Кава й булочка', 'Coffee Shop', 'Вода'])]);
      if (wd === 5 && rnd() < .5) hist.push([ds, 'Харчування та їжа', +(8 + rnd() * 9).toFixed(2), pick(['Glovo', 'Bistro'])]);
      if (rnd() < .12) hist.push([ds, 'Транспорт', pick([1.2, 1.2, 6.8, 9.9]), pick(['IMHD квиток', 'Bolt', 'Regiojet'])]);
      if (rnd() < .07 + mi * .02) hist.push([ds, 'Інше', +(2 + rnd() * 14).toFixed(2), pick(['dm drogerie', 'Pepco', 'Аптека', 'Друк'])]);
    }
  });

  const state = {
    today, rates, recent: nov, columns: {currency: 'Валюта'}, demo: true,
    close: {auto: false, pending: '2026-10', archive: false, email: true},
  };
  const all = () => hist.map(r => ({date: r[0], category: r[1], eur: r[2], note: r[3]}))
    .concat(state.recent.map(t => ({date: t.date, category: t.category, eur: toEur(t.amount, t.currency, rates), note: t.note})));
  const summarize = ym => {
    const list = all().filter(t => t.date.slice(0, 7) === ym);
    const cats = {}; CATS.forEach(c => cats[c.name] = c.fixed || 0);
    list.forEach(t => cats[t.category] = (cats[t.category] || 0) + t.eur);
    const plan = CATS.reduce((s, c) => s + c.plan, 0), spent = Object.values(cats).reduce((a, b) => a + b, 0);
    const big = list.slice().sort((a, b) => b.eur - a.eur)[0];
    return {ym, plan, spent: +spent.toFixed(2), left: +(plan - spent).toFixed(2), pct: spent / plan * 100, count: list.length,
            avg: spent / new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate(), overDays: 0, biggest: big ? big.note + ' · €' + big.eur.toFixed(2) : '', cats};
  };
  let months = null; // рахуємо при першому запиті, коли всі функції вже готові
  const getMonths = () => months || (months = ['2026-09', '2026-08'].map(summarize));

  const snapshot = () => {
    const ym = today.slice(0, 7);
    const cur = state.recent.filter(t => t.date.slice(0, 7) === ym);
    const categories = CATS.map(c => ({...c, fact: +Math.max(c.fixed || 0, (c.fixed || 0) + cur.filter(t => t.category === c.name).reduce((s, t) => s + toEur(t.amount, t.currency, rates), 0)).toFixed(2)}));
    const days = Array.from({length: 30}, (_, i) => {
      const date = ym + '-' + String(i + 1).padStart(2, '0');
      return {date, spent: +cur.filter(t => t.date === date).reduce((s, t) => s + toEur(t.amount, t.currency, rates), 0).toFixed(2), limit: 7.17};
    });
    return JSON.parse(JSON.stringify({...state, categories, days, months: getMonths()}));
  };
  let next = 200;
  const fail = m => { throw new Error(m); };
  return {
    getData: () => snapshot(),
    getStats: () => ({today, categories: snapshot().categories, fixed: {'Житло (Гуртожиток)': 85},
                      tx: all().map(t => [t.date, t.category, +t.eur.toFixed(2), t.note])}),
    addTransaction: t => { const row = next++; state.recent.unshift({...t, row}); return {row, data: snapshot()}; },
    deleteTransaction: row => { state.recent = state.recent.filter(t => t.row !== row); return snapshot(); },
    updateCategory: (row, amount, category) => { const t = state.recent.find(x => x.row === row); if (!t) fail('Рядок змінився'); t.category = category; return snapshot(); },
    enableMonthClose: on => { state.close.auto = !!on; return snapshot(); },
    setMonthArchive: on => { state.close.archive = !!on; if (on) state.close.auto = true; return snapshot(); },
    setBudgets: changes => {
      let saved = 0;
      changes.forEach(ch => { const c = CATS.find(x => x.name === ch.name); if (!c) return;
        if (ch.plan != null) c.plan = Math.round(ch.plan * 100) / 100;
        if (ch.fixed != null) c.fixed = ch.fixed || 0;
        saved++; });
      return {saved, skipped: [], conflicts: [], data: snapshot()};
    },
    getArchive: () => {
      const by = {};
      hist.forEach(r => (by[r[0].slice(0, 7)] = by[r[0].slice(0, 7)] || []).push([r[0], r[1], r[2], r[3]]));
      return {found: true, auto: state.close.archive,
              months: Object.keys(by).sort().reverse().map(ym => ({ym, rows: by[ym].sort((a, b) => b[0].localeCompare(a[0]))}))};
    },
    app_closeMonth: ym => {
      if (getMonths().some(s => s.ym === ym)) fail('Цей місяць уже підсумовано');
      const s = summarize(ym); months.unshift(s); months.sort((a, b) => b.ym.localeCompare(a.ym)); state.close.pending = null;
      if (state.close.archive) s.moved = s.count;
      return {summary: s, data: snapshot()};
    },
  };
})();

const api = (fn, ...args) => {
  if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message || e))[fn](...args));
  if (PWA && store.get('apiUrl') !== 'demo') return remote(fn, args);
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e.message); } }, 250));
};

/* ---------- утиліти ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM = {EUR:'€', UAH:'₴', USD:'$'};
const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_G = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const DOW = ['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const DOW_S = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
// Кольори категорій: закріплені за категорією (за порядком у дашборді), не за рангом
const COLORS = ['#7D97E0','#E8906A','#6CC59A','#D9B05A','#B08AD6','#A79F94','#64BDBD','#DC86A6'];

const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
  food: '<path d="M6 3v6a3 3 0 0 0 6 0V3M9 3v18"/><path d="M18 21V3c-2 1-3 4-3 7v3h3"/>',
  bus: '<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3"/><path d="M8 14.5h.01M16 14.5h.01" stroke-width="2.6"/>',
  book: '<path d="M4 19.5V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-4"/>',
  phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/>',
  ticket: '<path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 7v2M14 11v2M14 15v2"/>',
  pill: '<path d="M10.5 20.5a5 5 0 0 1-7-7l6-6a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',
  shirt: '<path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
  tag: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  repeat: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  offline: '<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 5-2.8M19 13a10 10 0 0 0-2.3-1.6"/><path d="M12 20h.01" stroke-width="2.6"/>',
  pie: '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',

  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',

};
const svg = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.tag}</svg>`;
document.querySelectorAll('i[data-i]').forEach(el => { el.outerHTML = svg(el.dataset.i, el.dataset.cls || ''); });
$('#toastIc').innerHTML = svg('check');
const ICONS = [[/житл|гурт|оренд|кварт/i,'home'],[/харч|їж|продук|кафе/i,'food'],[/транс|проїзд|таксі/i,'bus'],[/навч|книг|курс/i,'book'],[/зв.?яз|телеф|інтернет|мобіл/i,'phone'],[/розваг|кіно/i,'ticket'],[/здоров|аптек|лік/i,'pill'],[/одяг/i,'shirt']];

// function (а не const), бо демо-дані рахуються ще до цього рядка
function normCur(s) { return /usd|\$|дол/i.test(s) ? 'USD' : /uah|₴|грн|грив/i.test(s) ? 'UAH' : 'EUR'; }
function toEur(amount, cur, rates) { cur = normCur(cur); return cur === 'UAH' ? amount / rates.uah : cur === 'USD' ? amount / rates.usd : amount; }
function fromEur(eur, cur, rates) { return cur === 'UAH' ? eur * rates.uah : cur === 'USD' ? eur * rates.usd : eur; }
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5) + 1;
const short = name => String(name).replace(/\s*\(.*\)/, '');

const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};

/* ---------- програма: звʼязок з таблицею, кеш і черга без інтернету ---------- */
const READS = ['getData', 'getStats', 'getArchive'];
let Q = []; try { Q = JSON.parse(store.get('queue') || '[]'); } catch (e) {}
let NET = 'on';
const saveQ = () => store.set('queue', JSON.stringify(Q));
const newCid = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0].toString(16).padStart(8, '0'); } catch (e) { return Math.random().toString(16).slice(2, 10); } };
const isData = d => d && d.categories && d.days && d.recent;

/** Один запит до BudgetApi. Помилка мережі має .net = true */
async function call_(fn, args, url = store.get('apiUrl'), k = store.get('apiKey')) {
  if (!url || !k) throw new Error('Програму не підключено до таблиці');
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl && setTimeout(() => ctl.abort(), 25000);
  let res, text;
  try {
    res = await fetch(url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({k, fn, args}), signal: ctl && ctl.signal});
    text = await res.text();
  } catch (e) {
    const err = new Error('Немає звʼязку з таблицею (network)'); err.net = true; throw err;
  } finally { if (timer) clearTimeout(timer); }
  let j;
  try { j = JSON.parse(text); }
  catch (e) { throw new Error('Таблиця відповіла сторінкою входу замість даних. У розгортанні API має бути «Виконувати як: Я» і «Доступ: Будь-хто».'); }
  if (!j.ok) throw new Error(j.error || 'Помилка в таблиці');
  return j.result;
}

/** Виклик з урахуванням офлайну: читання — з кешу, нові витрати — у чергу */
async function remote(fn, args) {
  if (fn === 'addTransaction') args = [{...args[0], cid: args[0].cid || newCid()}];
  if (+args[0] < 0) { // витрата ще в черзі, у таблиці її немає
    if (fn === 'deleteTransaction') { Q = Q.filter(q => q.row !== args[0]); saveQ(); return withQueue(baseData()); }
    if (fn === 'updateCategory') { const q = Q.find(x => x.row === args[0]); if (q) { q.category = args[2]; saveQ(); } return withQueue(baseData()); }
  }
  try {
    const r = await call_(fn, args);
    NET = 'on';
    if (READS.includes(fn)) store.set('c_' + fn, JSON.stringify(r));
    if (isData(r)) { store.set('c_getData', JSON.stringify(r)); return withQueue(r); }
    if (r && isData(r.data)) { store.set('c_getData', JSON.stringify(r.data)); r.data = withQueue(r.data); }
    return r;
  } catch (e) {
    if (!e.net) throw e;
    NET = 'off'; syncLabel();
    if (READS.includes(fn)) { const c = store.get('c_' + fn); if (c) { const r = JSON.parse(c); return fn === 'getData' ? withQueue(r) : r; } }
    if (fn === 'addTransaction') {
      const item = {...args[0], row: -(Q.length + 1) * 1000 - Math.floor(Math.random() * 999)};
      Q.push(item); saveQ();
      return {row: item.row, data: withQueue(baseData()), queued: true};
    }
    throw new Error('Немає інтернету — ця дія спрацює, коли зʼявиться звʼязок (network).');
  }
}

/** Останні дані з таблиці (без витрат із черги) */
function baseData() {
  try { const c = store.get('c_getData'); if (c) return JSON.parse(c); } catch (e) {}
  return D ? {...D, recent: D.recent.filter(t => !t.pending)} : null;
}

/** Показуємо витрати з черги так, ніби вони вже в таблиці */
function withQueue(d) {
  if (!Q.length || !isData(d)) return d;
  d = JSON.parse(JSON.stringify(d));
  const ym = d.today.slice(0, 7);
  Q.forEach(q => {
    d.recent.unshift({row: q.row, date: q.date, category: q.category, amount: q.amount, currency: q.currency, note: q.note || '', pending: true});
    if (q.date.slice(0, 7) !== ym) return;
    const eur = toEur(q.amount, q.currency, d.rates);
    const c = d.categories.find(x => x.name === q.category); if (c) c.fact = Math.round((c.fact + eur) * 100) / 100;
    const day = d.days.find(x => x.date === q.date); if (day) day.spent = Math.round((day.spent + eur) * 100) / 100;
  });
  return d;
}

/** Надсилаємо чергу, коли зʼявився інтернет. ID витрати захищає від дублів */
let flushing = false;
async function flushQueue() {
  if (!PWA || flushing || !Q.length || store.get('apiUrl') === 'demo') return;
  flushing = true; let sent = 0;
  try {
    while (Q.length) {
      const {row, pending, ...t} = Q[0];
      await call_('addTransaction', [t]);
      Q.shift(); saveQ(); sent++;
    }
    NET = 'on';
  } catch (e) { if (e.net) NET = 'off'; else toast(friendly(e), '', null, 'error'); }
  flushing = false;
  syncLabel();
  if (sent) { await load(); toast(`Надіслано в таблицю: ${plural(sent, 'витрата', 'витрати', 'витрат')}`); }
}

}

  }
  const yest = addDays(D.today, -1), groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  $('#txList').innerHTML = Object.keys(groups).map(date => {
    const d = parseD(date);

    return `<div class="group"><span>${label}</span><span class="num">${fmt(sum)}</span></div>` + groups[date].map(txHTML).join('');
  }).join('');
}

/* ---------- форма витрати ---------- */
function renderChips() {

  // Підказки для поля «Де / що» — з ваших частих записів

  if (S) S.tx.forEach(t => { if (t[3]) freq[t[3]] = (freq[t[3]] || 0) + 1; });
  $('#noteList').innerHTML = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 30).map(n => `<option value="${esc(n)}">`).join('');

// Якщо «Де / що» вже траплялось — підставляємо його звичну категорію
function guessFromNote(note) {
  const n = note.trim().toLowerCase(); if (!n) return;
  const counts = {};
  D.recent.concat(S ? S.tx.map(t => ({note: t[3], category: t[1]})) : []).forEach(t => { if ((t.note || '').toLowerCase() === n) counts[t.category] = (counts[t.category] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (best && best !== ADD_CAT && D.categories.some(c => c.name === best)) { ADD_CAT = best; renderChips(); }
}
function updateEqv() {

function setAmtError(on) { $('#amtBox').classList.toggle('err', on); $('#amtErr').classList.toggle('on', on); }
function syncCurSeg() { document.querySelectorAll('#curSeg button').forEach(b => b.classList.toggle('on', b.dataset.c === ADD_CUR)); }
/* ---------- статистика ---------- */
const PERIODS = [['month', 'Цей місяць'], ['prev', 'Минулий'], ['3m', '3 місяці'], ['year', 'Рік'], ['all', 'Усе']];
const ymOf = s => s.slice(0, 7);
const monthStart = (s, shift = 0) => { const d = parseD(s); d.setDate(1); d.setMonth(d.getMonth() + shift); return isoD(d); };
const monthEnd = s => { const d = parseD(s); return isoD(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const dim = s => +monthEnd(s).slice(8);

/** Межі періоду й попереднього такого ж періоду для порівняння */
function periodRange(p, today, first) {
  switch (p) {
    case 'month': { const from = monthStart(today), n = daysBetween(from, today), pf = monthStart(today, -1);
      return {from, to: today, pFrom: pf, pTo: addDays(pf, Math.min(n, dim(pf)) - 1), label: 'з минулим місяцем на ту ж дату'}; }
    case 'prev': { const from = monthStart(today, -1), pf = monthStart(today, -2);
      return {from, to: monthEnd(from), pFrom: pf, pTo: monthEnd(pf), label: 'з позаминулим місяцем'}; }
    case '3m': { const from = monthStart(today, -2), pf = monthStart(today, -5);
      return {from, to: today, pFrom: pf, pTo: addDays(monthStart(today, -3), daysBetween(monthStart(today), today) - 1), label: 'з попередніми 3 місяцями'}; }
    case 'year': { const from = today.slice(0, 4) + '-01-01', y = +today.slice(0, 4) - 1;
      return {from, to: today, pFrom: y + '-01-01', pTo: y + today.slice(4), label: 'з тим самим періодом минулого року'}; }
    default: return {from: first || today, to: today, pFrom: null, pTo: null, label: ''};
  }
}

/** Витрати за період + фіксовані (гуртожиток) за кожен місяць періоду */
function periodTx(from, to) {
  const out = S.tx.filter(t => t[0] >= from && t[0] <= to).map(t => ({date: t[0], category: t[1], eur: t[2], note: t[3]}));
  const firstData = S.tx.reduce((m, t) => t[0] < m ? t[0] : m, S.today);
  for (let m = monthStart(from); m <= to; m = monthStart(m, 1)) {
    if (m < monthStart(firstData)) continue;
    Object.keys(S.fixed || {}).forEach(cat => {
      const have = out.filter(t => t.category === cat && ymOf(t.date) === ymOf(m)).reduce((s, t) => s + t.eur, 0);
      const add = S.fixed[cat] - have;
      if (add > 0.005) out.push({date: m < from ? from : m, category: cat, eur: add, note: '', fixed: true});
    });
  }
  return out;
}

const niceMax = v => { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(x => x >= v); };
const dayLabel = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`; };
const deltaHTML = (cur, prev) => {
  if (!prev) return '';
  const d = (cur - prev) / prev * 100;
  if (Math.abs(d) < 0.5) return '<span class="delta">≈ так само</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${svg(d > 0 ? 'trendUp' : 'trendDown')} ${d > 0 ? '+' : '−'}${Math.abs(Math.round(d))}%</span>`;
};

function renderStats() {
  const box = $('#stats'); if (!box) return;
  if (!S) { box.innerHTML = `<div class="sk-card"><div class="sk" style="height:40px"></div><div class="sk" style="height:180px"></div></div>`; return; }
  const first = S.tx.reduce((m, t) => t[0] < m ? t[0] : m, S.today);
  const R = periodRange(PERIOD, S.today, first);
  const allCur = periodTx(R.from, R.to), allPrev = R.pFrom ? periodTx(R.pFrom, R.pTo) : [];
  const cur = ST_CAT ? allCur.filter(t => t.category === ST_CAT) : allCur;
  const prev = ST_CAT ? allPrev.filter(t => t.category === ST_CAT) : allPrev;
  const real = cur.filter(t => !t.fixed);
  const total = cur.reduce((s, t) => s + t.eur, 0), prevTotal = prev.reduce((s, t) => s + t.eur, 0);
  const nDays = daysBetween(R.from, R.to);
  const nMonths = new Set(Array.from({length: nDays}, (_, i) => ymOf(addDays(R.from, i)))).size;
  const planOf = name => { const c = S.categories.find(x => x.name === name); return c ? c.plan : 0; };
  const planMonth = ST_CAT ? planOf(ST_CAT) : S.categories.reduce((s, c) => s + c.plan, 0);
  const periodTitle = (PERIODS.find(p => p[0] === PERIOD) || [])[1];

  // ---- KPI ----
  const avgCheck = real.length ? real.reduce((s, t) => s + t.eur, 0) / real.length : 0;
  const kpis = `<div class="kpis">
    <div class="kpi"><span class="label">Витрачено</span><b class="num">${fmt(total)}</b><small>${R.pFrom ? deltaHTML(total, prevTotal) + ' ' + esc(R.label) : periodTitle}</small></div>
    <div class="kpi"><span class="label">У середньому на день</span><b class="num">${fmt(total / nDays)}</b><small>за ${plural(nDays, 'день', 'дні', 'днів')}</small></div>
    <div class="kpi"><span class="label">Покупок</span><b class="num">${real.length}</b><small>≈ ${(real.length / nDays).toFixed(1).replace('.', ',')} на день</small></div>
    <div class="kpi"><span class="label">Середній чек</span><b class="num">${fmt(avgCheck)}</b><small>без фіксованих платежів</small></div>
  </div>`;

  box.innerHTML = `
    <div class="st-bar">
      <div class="seg" role="group" aria-label="Період">${PERIODS.map(([k, l]) => `<button data-period="${k}" class="${k === PERIOD ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${ST_CAT ? `<div><span class="filter" style="margin:0">${catIcon(ST_CAT)} ${esc(short(ST_CAT))}<button data-stcat="" aria-label="Усі категорії">${svg('x')}</button></span></div>` : ''}
    </div>
    ${kpis}
    <div class="st-grid">
      <section class="card wide" id="stTrend"></section>
      <section class="card wide desk-only" id="stHeat"></section>
      <section class="card" id="stCats"></section>
      <section class="card" id="stWeek"></section>
      <section class="card" id="stPlaces"></section>
      <section class="card" id="stInsights"></section>
      <section class="card wide" id="months"></section>
    </div>`;

  renderTrend(R, cur, prev, planMonth, nDays);
  if (DESK.matches) renderHeat();
  renderCatsStat(allCur, total, nMonths);
  renderWeek(real, R);
  renderPlaces(real, cur);
  renderInsights({R, cur, real, total, prevTotal, planMonth, allCur});
  renderMonths();
}

/* Динаміка: до 2 місяців — накопичувальна лінія по днях; довше — стовпці по місяцях */
function renderTrend(R, cur, prev, planMonth, nDays) {
  const el = $('#stTrend');
  if (nDays <= 62 && PERIOD !== '3m') {
    const len = PERIOD === 'month' ? dim(R.from) : nDays;
    const byDay = {}; cur.forEach(t => byDay[t.date] = (byDay[t.date] || 0) + t.eur);
    const pByDay = {}; prev.forEach(t => pByDay[t.date] = (pByDay[t.date] || 0) + t.eur);
    const pts = [], ppts = [];
    let acc = 0, pacc = 0;
    for (let i = 0; i < len; i++) {
      const d = addDays(R.from, i);
      if (d <= R.to) { acc += byDay[d] || 0; pts.push({d, day: byDay[d] || 0, acc}); }
      if (R.pFrom) { const pd = addDays(R.pFrom, i); if (ymOf(pd) === ymOf(R.pFrom)) { pacc += pByDay[pd] || 0; ppts.push(pacc); } }
    }
    const planLine = planMonth > 0;
    const max = niceMax(Math.max(acc, pacc, planLine ? planMonth : 0) * 1.05);
    el.innerHTML = `<h2>Як ростуть витрати <small>накопичено за ${PERIOD === 'month' ? 'місяць' : 'період'}</small></h2>
      <div class="chart-wrap" id="lineWrap"></div>
      <div class="ckey"><span><i style="background:var(--accent)"></i>${PERIOD === 'month' ? 'цей місяць' : 'витрачено'}</span>${ppts.length ? `<span><i style="background:var(--mute)"></i>попередній місяць</span>` : ''}${planLine ? `<span><i class="dash"></i>темп бюджету (${fmt(planMonth)})</span>` : ''}</div>`;
    drawLine($('#lineWrap'), {pts, ppts, len, max, planMonth: planLine ? planMonth : 0, from: R.from});
  } else {
    const months = [];
    for (let m = monthStart(R.from); m <= R.to; m = monthStart(m, 1)) months.push(ymOf(m));
    const shown = months.slice(-12);
    const sums = shown.map(ym => cur.filter(t => ymOf(t.date) === ym).reduce((s, t) => s + t.eur, 0));
    const max = niceMax(Math.max(...sums, planMonth) * 1.05);
    const nowYm = ymOf(S.today);
    el.innerHTML = `<h2>Витрати по місяцях <small>пунктир — бюджет ${fmt(planMonth, DISP, true)}</small></h2>
      <div class="vbars" style="--n:${shown.length}" role="img" aria-label="Витрати по місяцях">${shown.map((ym, i) => {
        const v = sums[i], over = planMonth && v > planMonth + .005, now = ym === nowYm;
        const tip = `<b>${monthName(ym)}</b><br>${fmt(v)}${planMonth ? ` з ${fmt(planMonth)} · ${Math.round(v / planMonth * 100)}%` : ''}${now ? '<br>місяць ще триває' : ''}`;
        return `<div class="vb" data-tip="${esc(tip)}" data-ym="${ym}"><div class="plot">${planMonth ? `<span class="lim" style="bottom:${planMonth / max * 100}%"></span>` : ''}<i class="${now ? 'now' : over ? 'over' : ''}" style="height:${v / max * 100}%"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${MONTHS[+ym.slice(5) - 1].slice(0, 3)}</span></div>`;
      }).join('')}</div>
      <div class="ckey"><span><i style="background:var(--ok)"></i>у межах бюджету</span><span><i style="background:var(--bad)"></i>понад бюджет</span><span><i style="background:var(--accent)"></i>поточний місяць</span></div>`;
  }
}

function drawLine(wrap, o) {
  const W = Math.max(280, wrap.clientWidth || 600), H = Math.max(160, wrap.clientHeight || 200);
  const L = 46, Rp = 12, T = 12, B = 24, pw = W - L - Rp, ph = H - T - B;
  const x = i => L + (o.len > 1 ? i / (o.len - 1) : 0) * pw;
  const y = v => T + ph - v / o.max * ph;
  const ticks = [0, o.max / 2, o.max];
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const last = o.pts[o.pts.length - 1];
  const xl = [1, Math.ceil(o.len / 2), o.len].map(n => `<text class="ax" x="${x(n - 1)}" y="${H - 6}" text-anchor="${n === 1 ? 'start' : n === o.len ? 'end' : 'middle'}">${n}</text>`).join('');
  const hits = Array.from({length: o.len}, (_, i) => {
    const p = o.pts[i], d = addDays(o.from, i);
    const tip = `<b>${dayLabel(d)}</b>${p ? `<br>за день: ${fmt(p.day)}<br>усього: ${fmt(p.acc)}` : '<br>ще попереду'}${o.planMonth ? `<br>темп бюджету: ${fmt(o.planMonth * (i + 1) / o.len)}` : ''}${o.ppts[i] != null ? `<br>мин. місяць: ${fmt(o.ppts[i])}` : ''}`;
    const w = pw / Math.max(1, o.len - 1);
    return `<rect class="hit" x="${x(i) - w / 2}" y="${T}" width="${w}" height="${ph}" data-tip="${esc(tip)}" data-x="${x(i)}"/>`;
  }).join('');
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Накопичені витрати по днях">
    ${ticks.map(v => `<line class="gridl" x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, DISP, true)}</text>`).join('')}
    ${xl}
    ${o.planMonth ? `<line x1="${x(0)}" y1="${y(o.planMonth / o.len)}" x2="${x(o.len - 1)}" y2="${y(o.planMonth)}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    ${o.ppts.length ? `<path d="${path(o.ppts)}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linejoin="round" opacity=".7"/>` : ''}
    <path d="${path(o.pts.map(p => p.acc))}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${x(o.pts.length - 1)}" cy="${y(last.acc)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <text x="${Math.min(x(o.pts.length - 1) + 8, W - Rp)}" y="${y(last.acc) - 10}" text-anchor="${x(o.pts.length - 1) > W - 90 ? 'end' : 'start'}" font-size="12" font-weight="700" fill="var(--ink)">${fmt(last.acc)}</text>` : ''}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
    ${hits}
  </svg>`;
}

/* Карта року (ПК): кожна клітинка — день, колір — скільки витрачено. Без фіксованих платежів, з урахуванням фільтра категорії */
function renderHeat() {
  const el = $('#stHeat'); if (!el) return;
  const end = S.today, weeks = 53;
  const start = addDays(end, -((parseD(end).getDay() + 6) % 7) - (weeks - 1) * 7);
  const fixed = S.fixed || {}, by = {};
  S.tx.forEach(t => {
    if (t[0] < start || t[0] > end) return;
    if (ST_CAT ? t[1] !== ST_CAT : fixed[t[1]]) return;
    by[t[0]] = (by[t[0]] || 0) + t[2];
  });
  const vals = Object.values(by).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const th = [q(.25), q(.5), q(.75)];
  const lvl = v => !(v > 0) ? 0 : v <= th[0] ? 1 : v <= th[1] ? 2 : v <= th[2] ? 3 : 4;
  const FILL = ['var(--sunk)', ...[28, 50, 75].map(p => `color-mix(in srgb,var(--accent) ${p}%,var(--card))`), 'var(--accent)'];
  const C = 13, G = 3, L = 30, T = 18;
  let cells = '', labels = '', lastM = parseD(start).getMonth();
  for (let w = 0; w < weeks; w++) {
    const mon = parseD(addDays(start, w * 7));
    if (mon.getMonth() !== lastM && w < weeks - 2) { lastM = mon.getMonth(); labels += `<text class="ax" x="${L + w * (C + G)}" y="11">${MONTHS[lastM].slice(0, 3)}</text>`; }
    for (let d = 0; d < 7; d++) {
      const ds = addDays(start, w * 7 + d); if (ds > end) break;
      const v = by[ds] || 0;
      const tip = `<b>${dayLabel(ds)}, ${DOW[parseD(ds).getDay()]}</b><br>${v ? fmt(v) : 'без покупок'}`;
      cells += `<rect x="${L + w * (C + G)}" y="${T + d * (C + G)}" width="${C}" height="${C}" rx="3" fill="${FILL[lvl(v)]}"${ds === end ? ' stroke="var(--ink)" stroke-width="1.5"' : ''} data-tip="${esc(tip)}"/>`;
    }
  }
  [[0, 'Пн'], [2, 'Ср'], [4, 'Пт'], [6, 'Нд']].forEach(([d, l]) => labels += `<text class="ax" x="0" y="${T + d * (C + G) + 10}">${l}</text>`);
  const W = L + weeks * (C + G), H = T + 7 * (C + G);
  const top = Object.keys(by).sort((a, b) => by[b] - by[a])[0];
  el.innerHTML = `<h2>Рік по днях <small>${ST_CAT ? esc(short(ST_CAT)) : 'без фіксованих платежів'} · ${plural(Object.keys(by).length, 'день', 'дні', 'днів')} з покупками</small></h2>
    <div class="heat"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Витрати по днях за рік">${labels}${cells}</svg></div>
    <div class="ckey heat-key"><span>менше ${FILL.map(f => `<i style="background:${f}"></i>`).join('')} більше</span>${top ? `<span>найдорожчий день: <b style="color:var(--ink)">${dayLabel(top)}</b> — ${fmt(by[top])}</span>` : ''}</div>`;
}

/* Категорії: горизонтальні стовпці, натискання — фільтр усієї статистики */
function renderCatsStat(allCur, total, nMonths) {
  const by = {};
  allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const names = Object.keys(by).sort((a, b) => by[b] - by[a]);
  const max = Math.max(...names.map(n => Math.max(by[n], (S.categories.find(c => c.name === n) || {}).plan * nMonths || 0)), 1);
  $('#stCats').innerHTML = `<h2>Категорії <small>натисніть, щоб відфільтрувати</small></h2>` + (names.length ? names.map(n => {
    const plan = ((S.categories.find(c => c.name === n) || {}).plan || 0) * nMonths, over = plan && by[n] > plan + .005;
    const tip = `<b>${esc(n)}</b><br>${fmt(by[n])} · ${Math.round(by[n] / sum * 100)}% усіх витрат${plan ? `<br>бюджет: ${fmt(plan)}${over ? ' · перевищено' : ''}` : ''}`;
    return `<button class="hbar ${ST_CAT === n ? 'sel' : ''}" data-stcat="${esc(n)}" style="--c:${over ? 'var(--bad)' : catColor(n)}" data-tip="${esc(tip)}">
      <span class="ic" style="color:${catColor(n)}">${catIcon(n)}</span><span class="nm">${esc(short(n))}</span>
      <span class="v num">${fmt(by[n])}<small>${Math.round(by[n] / sum * 100)}%</small></span>
      <span class="track"><i style="width:${by[n] / max * 100}%"></i>${plan ? `<span class="pl" style="left:calc(${Math.min(100, plan / max * 100)}% - 1px)"></span>` : ''}</span>
    </button>`;
  }).join('') + `<div class="ckey"><span><i style="background:var(--ink2);width:2px;height:10px;vertical-align:-1px"></i>бюджет категорії за період</span></div>` : '<div class="empty">За цей період витрат немає</div>');
}

/* Дні тижня: середня сума покупок у кожен день тижня */
function renderWeek(real, R) {
  const sums = Array(7).fill(0), cnt = Array(7).fill(0);
  real.forEach(t => sums[(parseD(t.date).getDay() + 6) % 7] += t.eur);
  for (let i = 0; i < daysBetween(R.from, R.to); i++) cnt[(parseD(addDays(R.from, i)).getDay() + 6) % 7]++;
  const avg = sums.map((s, i) => cnt[i] ? s / cnt[i] : 0);
  const max = niceMax(Math.max(...avg) * 1.05), peak = avg.indexOf(Math.max(...avg));
  $('#stWeek').innerHTML = `<h2>Дні тижня <small>середні витрати за день</small></h2>
    <div class="vbars" style="--n:7;--c:var(--accent)" role="img" aria-label="Середні витрати за днями тижня">${avg.map((v, i) => {
      const tip = `<b>${DOW[(i + 1) % 7]}</b><br>у середньому ${fmt(v)}<br>усього ${fmt(sums[i])} за ${cnt[i]} дн.`;
      return `<div class="vb ${i === peak && v > 0 ? 'peak' : ''}" data-tip="${esc(tip)}"><div class="plot"><i style="height:${v / max * 100}%;background:${i >= 5 ? 'var(--accent)' : '#7D97E0'}"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${DOW_S[i]}</span></div>`;
    }).join('')}</div>
    <div class="ckey"><span><i style="background:#7D97E0"></i>будні</span><span><i style="background:var(--accent)"></i>вихідні</span><span>обведено — найдорожчий день</span></div>`;
}

/* Найчастіші місця й найбільші покупки */
function renderPlaces(real) {
  const by = {};
  real.forEach(t => {
    const k = (t.note || '').trim(); if (!k) return;

/* Висновки простими словами */
function renderInsights(x) {
  const out = [];
  const by = {}; x.allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const topVar = Object.keys(by).filter(n => !(S.fixed || {})[n]).sort((a, b) => by[b] - by[a])[0];
  if (PERIOD === 'month' && x.planMonth) {
    const elapsed = daysBetween(x.R.from, x.R.to), days = dim(x.R.from);
    const variable = x.cur.filter(t => !t.fixed).reduce((s, t) => s + t.eur, 0), fixed = x.total - variable;
    const proj = fixed + variable / elapsed * days;
    out.push(['bulb', proj > x.planMonth
      ? `Якщо витрачати в тому ж темпі, до кінця місяця вийде <b>${fmt(proj)}</b> — це на <b>${fmt(proj - x.planMonth)}</b> більше за бюджет.`
      : `У такому темпі місяць закінчиться на <b>${fmt(proj)}</b> — і ще лишиться <b>${fmt(x.planMonth - proj)}</b> з бюджету.`]);
  }
  if (x.R.pFrom && x.prevTotal) {
    const d = x.total - x.prevTotal;
    out.push([d > 0 ? 'trendUp' : 'trendDown', `Порівняно ${esc(x.R.label)} — на <b>${fmt(Math.abs(d))} ${d > 0 ? 'більше' : 'менше'}</b>.`]);
  }
  if (topVar && !ST_CAT) out.push(['star', `Найбільше змінних витрат — <b>${esc(short(topVar))}</b>: ${fmt(by[topVar])}, це ${Math.round(by[topVar] / sum * 100)}% усіх витрат.`]);
  const smallN = x.real.filter(t => t.eur < 5), smallSum = smallN.reduce((s, t) => s + t.eur, 0);
  if (smallN.length >= 5) out.push(['receipt', `Дрібні покупки до ${fmt(5, DISP, true)} — <b>${smallN.length} шт.</b> на суму <b>${fmt(smallSum)}</b>. Непомітно, але складається.`]);
  const noSpend = Array.from({length: daysBetween(x.R.from, x.R.to)}, (_, i) => addDays(x.R.from, i)).filter(d => !x.real.some(t => t.date === d)).length;
  if (noSpend) out.push(['calendar', `Днів без жодної покупки: <b>${noSpend}</b>.`]);
  $('#stInsights').innerHTML = `<h2>Висновки <small>автоматично</small></h2><div class="insights">${out.length ? out.map(([ic, t]) => `<div class="ins"><span class="ic">${svg(ic)}</span><span>${t}</span></div>`).join('') : '<div class="hint">Замало даних для висновків.</div>'}</div>`;
}

  const ym = ymOf(D.today);
  const plan = D.categories.reduce((s, c) => s + c.plan, 0), spent = D.categories.reduce((s, c) => s + c.fact, 0);
  return {ym, current: true, plan, spent, left: plan - spent, pct: plan ? spent / plan * 100 : 0,
    count: D.recent.filter(t => ymOf(t.date) === ym).length, avg: spent / Math.max(1, D.days.length),
    overDays: D.days.filter(d => d.date <= D.today && d.limit && d.spent > d.limit).length,
    cats: D.categories.reduce((o, c) => (o[c.name] = c.fact, o), {}), biggest: ''};
}
function renderMonths() {

/* ---------- архів ---------- */
function arcMonth(m) {
  const cats = {};
  m.rows.forEach(r => cats[r[1]] = (cats[r[1]] || 0) + r[2]);
  D.categories.forEach(c => { if (c.fixed && (cats[c.name] || 0) < c.fixed) cats[c.name] = c.fixed; }); // гуртожиток, як на дашборді
  const total = Object.values(cats).reduce((a, b) => a + b, 0);
  const sum = (D.months || []).find(s => s.ym === m.ym);
  const plan = sum ? sum.plan : D.categories.reduce((s, c) => s + c.plan, 0);
  return {cats, total, plan, left: plan - total};
}

function renderArchive() {
  const box = $('#archive'); if (!box) return;
  if (!A) { box.innerHTML = `<div class="sk-card"><div class="sk" style="height:48px"></div><div class="sk" style="height:72px"></div><div class="sk" style="height:72px"></div></div>`; return; }

  const match = r => !q || (r[3] + ' ' + r[1] + ' ' + r[0]).toLowerCase().includes(q) || String(r[2]).includes(q);
  const months = A.months.map(m => ({...m, rows: m.rows.filter(match)})).filter(m => m.rows.length || !q);
  const total = A.months.reduce((s, m) => s + arcMonth(m).total, 0);

  const head = `<section class="card">
    <h2>Архів <small>${A.months.length ? `${plural(A.months.length, 'місяць', 'місяці', 'місяців')} · ${fmt(total)}` : ''}</small></h2>
    <div class="arc-head">
      <span class="ic">${svg('calendar')}</span>
      <div><b>Автоперенесення 1-го числа</b><small>${on ? 'Увімкнено: підсумок, перенесення в архів і лист' : 'Вимкнено: дані переносить ваша кнопка на дашборді'}</small></div>
      <button class="btn btn-sm ${on ? 'btn-quiet' : 'btn-primary'}" data-arc-auto="${on ? '0' : '1'}">${on ? 'Вимкнути' : 'Увімкнути'}</button>
    </div>
    ${on ? `<div class="arc-warn">${svg('alert')}<span><b style="color:var(--ink)">Стару кнопку «Закрити місяць» на дашборді більше не натискайте</b> — тепер це робить додаток. Інакше дані можуть перенестися двічі.</span></div>` : ''}
    ${c.pending ? `<div class="pending" style="margin:var(--s3) 0 0"><span class="ic" style="color:var(--accent)">${svg('archive')}</span><div><b>${monthName(c.pending)} ще в «Транзакціях»</b>${on ? 'Можна перенести в архів зараз' : 'Підсумувати зараз (перенесе ваша кнопка)'}</div><button class="btn btn-primary btn-sm" data-close-month="${c.pending}">${on ? 'Перенести' : 'Підсумувати'}</button></div>` : ''}
  </section>`;

  if (!A.found || !A.months.length) {
    box.innerHTML = head + `<section class="card"><div class="empty"><div class="e-ic">${svg('archive')}</div><b>Архів поки порожній</b>Тут зʼявляться витрати минулих місяців після закриття місяця.</div></section>`;
    return;
  }
  if (DESK.matches) { box.innerHTML = head + archiveDesk(months, q); return; }

  const list = months.map(m => {
    const s = arcMonth(m), open = ARC_OPEN === m.ym || !!q;

    const mini = order.map(k => `<i style="width:${s.cats[k] / s.total * 100}%;background:${catColor(k)}" data-tip="<b>${esc(short(k))}</b><br>${fmt(s.cats[k])}"></i>`).join('');
    let body = '';
    if (open) {
      const max = Math.max(...order.map(k => s.cats[k]), 1);
      const days = {};
      m.rows.forEach(r => (days[r[0]] = days[r[0]] || []).push(r));
      body = `<div class="arc-body">

    catsBlock = `<div class="ckey" style="margin:0 0 var(--s2)"><span><i style="background:var(--ink)"></i>${monthName(sel.ym)}</span><span><i style="background:var(--mute)"></i>${monthName(cmpM.ym)}</span><span>різниця: червоне — витратили більше</span></div>

const tip = $('#tip');
let tipEl = null;
function showTip(el, ev) {
  tipEl = el; tip.innerHTML = el.getAttribute('data-tip'); tip.classList.add('on');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const cx = ev && ev.clientX != null && el.tagName === 'rect' ? ev.clientX : r.left + r.width / 2;
  let left = Math.min(Math.max(8, cx - tw / 2), innerWidth - tw - 8), top = r.top - th - 8;
  if (top < 8) top = r.bottom + 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  const svgEl = el.closest('svg'), xh = svgEl && svgEl.querySelector('.xh');
  if (xh && el.dataset.x) { xh.setAttribute('x1', el.dataset.x); xh.setAttribute('x2', el.dataset.x); xh.setAttribute('visibility', 'visible'); }
}
function hideTip() {
  tip.classList.remove('on'); tipEl = null;
  document.querySelectorAll('.xh').forEach(x => x.setAttribute('visibility', 'hidden'));
}
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') showTip(el, e); });
document.addEventListener('pointermove', e => { if (tipEl && tipEl.tagName === 'rect' && e.pointerType !== 'touch') showTip(tipEl, e); });
document.addEventListener('pointerout', e => { if (tipEl && !tipEl.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-tip]');
  if (e.pointerType === 'touch' && el && !el.matches('button')) showTip(el, e); else if (!el) hideTip();
});
