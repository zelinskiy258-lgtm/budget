/* ---------- статистика ---------- */
const PERIODS = [['month', 'Цей місяць'], ['prev', 'Минулий'], ['3m', '3 місяці'], ['year', 'Рік'], ['all', 'Усе']];
const ymOf = s => s.slice(0, 7);
const monthStart = (s, shift = 0) => { const d = parseD(s); d.setDate(1); d.setMonth(d.getMonth() + shift); return isoD(d); };
const monthEnd = s => { const d = parseD(s); return isoD(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const dim = s => +monthEnd(s).slice(8);

/** Межі періоду й попереднього такого ж періоду для порівняння */
function periodRange(p, today, first) {
  switch (p) {
    case 'month': { const from = monthStart(today), n = daysBetween(from, today), pf = monthStart(today, -1);
      return {from, to: today, pFrom: pf, pTo: addDays(pf, Math.min(n, dim(pf)) - 1), label: 'з минулим місяцем на ту ж дату'}; }
    case 'prev': { const from = monthStart(today, -1), pf = monthStart(today, -2);
      return {from, to: monthEnd(from), pFrom: pf, pTo: monthEnd(pf), label: 'з позаминулим місяцем'}; }
    case '3m': { const from = monthStart(today, -2), pf = monthStart(today, -5);
      return {from, to: today, pFrom: pf, pTo: addDays(monthStart(today, -3), daysBetween(monthStart(today), today) - 1), label: 'з попередніми 3 місяцями'}; }
    case 'year': { const from = today.slice(0, 4) + '-01-01', y = +today.slice(0, 4) - 1;
      return {from, to: today, pFrom: y + '-01-01', pTo: y + today.slice(4), label: 'з тим самим періодом минулого року'}; }
    default: return {from: first || today, to: today, pFrom: null, pTo: null, label: ''};
  }
}

/** Витрати за період + фіксовані (гуртожиток) за кожен місяць періоду */
function periodTx(from, to) {
  const out = S.tx.filter(t => t[0] >= from && t[0] <= to).map(t => ({date: t[0], category: t[1], eur: t[2], note: t[3]}));
  const firstData = S.tx.reduce((m, t) => t[0] < m ? t[0] : m, S.today);
  for (let m = monthStart(from); m <= to; m = monthStart(m, 1)) {
    if (m < monthStart(firstData)) continue;
    Object.keys(S.fixed || {}).forEach(cat => {
      const have = out.filter(t => t.category === cat && ymOf(t.date) === ymOf(m)).reduce((s, t) => s + t.eur, 0);
      const add = S.fixed[cat] - have;
      if (add > 0.005) out.push({date: m < from ? from : m, category: cat, eur: add, note: '', fixed: true});
    });
  }
  return out;
}

const niceMax = v => { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(x => x >= v); };
const dayLabel = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`; };
const deltaHTML = (cur, prev) => {
  if (!prev) return '';
  const d = (cur - prev) / prev * 100;
  if (Math.abs(d) < 0.5) return '<span class="delta">≈ так само</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${svg(d > 0 ? 'trendUp' : 'trendDown')} ${d > 0 ? '+' : '−'}${Math.abs(Math.round(d))}%</span>`;
};

function renderStats() {
  const box = $('#stats'); if (!box) return;
  if (!S) { box.innerHTML = `<div class="sk-card"><div class="sk" style="height:40px"></div><div class="sk" style="height:180px"></div></div>`; return; }
  const first = S.tx.reduce((m, t) => t[0] < m ? t[0] : m, S.today);
  const R = periodRange(PERIOD, S.today, first);
  const allCur = periodTx(R.from, R.to), allPrev = R.pFrom ? periodTx(R.pFrom, R.pTo) : [];
  const cur = ST_CAT ? allCur.filter(t => t.category === ST_CAT) : allCur;
  const prev = ST_CAT ? allPrev.filter(t => t.category === ST_CAT) : allPrev;
  const real = cur.filter(t => !t.fixed), buys = real;
  const total = cur.reduce((s, t) => s + t.eur, 0), prevTotal = prev.reduce((s, t) => s + t.eur, 0);
  const nDays = daysBetween(R.from, R.to);
  const nMonths = new Set(Array.from({length: nDays}, (_, i) => ymOf(addDays(R.from, i)))).size;
  const planOf = name => { const c = S.categories.find(x => x.name === name); return c ? c.plan : 0; };
  const planMonth = ST_CAT ? planOf(ST_CAT) : S.categories.reduce((s, c) => s + c.plan, 0);
  const periodTitle = (PERIODS.find(p => p[0] === PERIOD) || [])[1];

  // ---- KPI ----
  const avgCheck = buys.length ? buys.reduce((s, t) => s + t.eur, 0) / buys.length : 0;
  const kpis = `<div class="kpis">
    <div class="kpi"><span class="label">Витрачено</span><b class="num">${fmt(total)}</b><small>${R.pFrom ? deltaHTML(total, prevTotal) + ' ' + esc(R.label) : periodTitle}</small></div>
    <div class="kpi"><span class="label">У середньому на день</span><b class="num">${fmt(total / nDays)}</b><small>за ${plural(nDays, 'день', 'дні', 'днів')}</small></div>
    <div class="kpi"><span class="label">Покупок</span><b class="num">${buys.length}</b><small>≈ ${(buys.length / nDays).toFixed(1).replace('.', ',')} на день</small></div>
    <div class="kpi"><span class="label">Середній чек</span><b class="num">${fmt(avgCheck)}</b><small>без фіксованих платежів</small></div>
  </div>`;

  box.innerHTML = `
    <div class="st-bar">
      <div class="seg" role="group" aria-label="Період">${PERIODS.map(([k, l]) => `<button data-period="${k}" class="${k === PERIOD ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${ST_CAT ? `<div><span class="filter" style="margin:0">${catIcon(ST_CAT)} ${esc(short(ST_CAT))}<button data-stcat="" aria-label="Усі категорії">${svg('x')}</button></span></div>` : ''}
    </div>
    ${kpis}
    <div class="st-grid">
      <section class="card wide" id="stTrend"></section>
      <section class="card wide desk-only" id="stHeat"></section>
      <section class="card" id="stCats"></section>
      <section class="card" id="stWeek"></section>
      <section class="card" id="stPlaces"></section>
      <section class="card" id="stInsights"></section>
      <section class="card wide" id="months"></section>
    </div>`;

  renderTrend(R, cur, prev, planMonth, nDays);
  if (DESK.matches) renderHeat();
  renderCatsStat(allCur, total, nMonths, R.pFrom ? allPrev : null);
  renderWeek(real, R);
  renderPlaces(real, cur);
  renderInsights({R, cur, real, total, prevTotal, planMonth, allCur});
  renderMonths();
}

/* Динаміка: до 2 місяців — накопичувальна лінія по днях; довше — стовпці по місяцях */
function renderTrend(R, cur, prev, planMonth, nDays) {
  const el = $('#stTrend');
  if (nDays <= 62 && PERIOD !== '3m') {
    const len = PERIOD === 'month' ? dim(R.from) : nDays;
    const byDay = {}; cur.forEach(t => byDay[t.date] = (byDay[t.date] || 0) + t.eur);
    const pByDay = {}; prev.forEach(t => pByDay[t.date] = (pByDay[t.date] || 0) + t.eur);
    const pts = [], ppts = [];
    let acc = 0, pacc = 0;
    for (let i = 0; i < len; i++) {
      const d = addDays(R.from, i);
      if (d <= R.to) { acc += byDay[d] || 0; pts.push({d, day: byDay[d] || 0, acc}); }
      if (R.pFrom) { const pd = addDays(R.pFrom, i); if (ymOf(pd) === ymOf(R.pFrom)) { pacc += pByDay[pd] || 0; ppts.push(pacc); } }
    }
    const planLine = planMonth > 0;
    const max = niceMax(Math.max(acc, pacc, planLine ? planMonth : 0) * 1.05);
    el.innerHTML = `<h2>Як ростуть витрати <small>накопичено за ${PERIOD === 'month' ? 'місяць' : 'період'}</small></h2>
      <div class="chart-wrap" id="lineWrap"></div>
      <div class="ckey"><span><i style="background:var(--accent)"></i>${PERIOD === 'month' ? 'цей місяць' : 'витрачено'}</span>${ppts.length ? `<span><i style="background:var(--mute)"></i>попередній місяць</span>` : ''}${planLine ? `<span><i class="dash"></i>темп бюджету (${fmt(planMonth)})</span>` : ''}</div>`;
    drawLine($('#lineWrap'), {pts, ppts, len, max, planMonth: planLine ? planMonth : 0, from: R.from});
  } else {
    const months = [];
    for (let m = monthStart(R.from); m <= R.to; m = monthStart(m, 1)) months.push(ymOf(m));
    const shown = months.slice(-12);
    const sums = shown.map(ym => cur.filter(t => ymOf(t.date) === ym).reduce((s, t) => s + t.eur, 0));
    const max = niceMax(Math.max(...sums, planMonth) * 1.05);
    const nowYm = ymOf(S.today);
    el.innerHTML = `<h2>Витрати по місяцях <small>пунктир — бюджет ${fmt(planMonth, DISP, true)}</small></h2>
      <div class="vbars" style="--n:${shown.length}" role="img" aria-label="Витрати по місяцях">${shown.map((ym, i) => {
        const v = sums[i], over = planMonth && v > planMonth + .005, now = ym === nowYm;
        const tip = `<b>${monthName(ym)}</b><br>${fmt(v)}${planMonth ? ` з ${fmt(planMonth)} · ${Math.round(v / planMonth * 100)}%` : ''}${now ? '<br>місяць ще триває' : ''}`;
        return `<div class="vb" data-tip="${esc(tip)}" data-ym="${ym}"><div class="plot">${planMonth ? `<span class="lim" style="bottom:${planMonth / max * 100}%"></span>` : ''}<i class="${now ? 'now' : over ? 'over' : ''}" style="height:${v / max * 100}%"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${MONTHS[+ym.slice(5) - 1].slice(0, 3)}</span></div>`;
      }).join('')}</div>
      <div class="ckey"><span><i style="background:var(--ok)"></i>у межах бюджету</span><span><i style="background:var(--bad)"></i>понад бюджет</span><span><i style="background:var(--accent)"></i>поточний місяць</span></div>`;
  }
}

function drawLine(wrap, o) {
  const W = Math.max(280, wrap.clientWidth || 600), H = Math.max(160, wrap.clientHeight || 200);
  const L = 46, Rp = 12, T = 12, B = 24, pw = W - L - Rp, ph = H - T - B;
  const x = i => L + (o.len > 1 ? i / (o.len - 1) : 0) * pw;
  const y = v => T + ph - v / o.max * ph;
  const ticks = [0, o.max / 2, o.max];
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const last = o.pts[o.pts.length - 1];
  const xl = [1, Math.ceil(o.len / 2), o.len].map(n => `<text class="ax" x="${x(n - 1)}" y="${H - 6}" text-anchor="${n === 1 ? 'start' : n === o.len ? 'end' : 'middle'}">${n}</text>`).join('');
  const hits = Array.from({length: o.len}, (_, i) => {
    const p = o.pts[i], d = addDays(o.from, i);
    const tip = `<b>${dayLabel(d)}</b>${p ? `<br>за день: ${fmt(p.day)}<br>усього: ${fmt(p.acc)}` : '<br>ще попереду'}${o.planMonth ? `<br>темп бюджету: ${fmt(o.planMonth * (i + 1) / o.len)}` : ''}${o.ppts[i] != null ? `<br>мин. місяць: ${fmt(o.ppts[i])}` : ''}`;
    const w = pw / Math.max(1, o.len - 1);
    return `<rect class="hit" x="${x(i) - w / 2}" y="${T}" width="${w}" height="${ph}" data-tip="${esc(tip)}" data-x="${x(i)}"/>`;
  }).join('');
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Накопичені витрати по днях">
    ${ticks.map(v => `<line class="gridl" x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, DISP, true)}</text>`).join('')}
    ${xl}
    ${o.planMonth ? `<line x1="${x(0)}" y1="${y(o.planMonth / o.len)}" x2="${x(o.len - 1)}" y2="${y(o.planMonth)}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    ${o.ppts.length ? `<path d="${path(o.ppts)}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linejoin="round" opacity=".7"/>` : ''}
    <path d="${path(o.pts.map(p => p.acc))}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${x(o.pts.length - 1)}" cy="${y(last.acc)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <text x="${Math.min(x(o.pts.length - 1) + 8, W - Rp)}" y="${y(last.acc) - 10}" text-anchor="${x(o.pts.length - 1) > W - 90 ? 'end' : 'start'}" font-size="12" font-weight="700" fill="var(--ink)">${fmt(last.acc)}</text>` : ''}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
    ${hits}
  </svg>`;
}

/* Карта року (ПК): кожна клітинка — день, колір — скільки витрачено. Без фіксованих платежів, з урахуванням фільтра категорії */
function renderHeat() {
  const el = $('#stHeat'); if (!el) return;
  const end = S.today, weeks = 53;
  const start = addDays(end, -((parseD(end).getDay() + 6) % 7) - (weeks - 1) * 7);
  const fixed = S.fixed || {}, by = {};
  S.tx.forEach(t => {
    if (t[0] < start || t[0] > end) return;
    if (ST_CAT ? t[1] !== ST_CAT : fixed[t[1]]) return;
    by[t[0]] = (by[t[0]] || 0) + t[2];
  });
  const vals = Object.values(by).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const th = [q(.25), q(.5), q(.75)];
  const lvl = v => !(v > 0) ? 0 : v <= th[0] ? 1 : v <= th[1] ? 2 : v <= th[2] ? 3 : 4;
  const FILL = ['var(--sunk)', ...[28, 50, 75].map(p => `color-mix(in srgb,var(--accent) ${p}%,var(--card))`), 'var(--accent)'];
  const C = 13, G = 3, L = 30, T = 18;
  let cells = '', labels = '', lastM = parseD(start).getMonth();
  for (let w = 0; w < weeks; w++) {
    const mon = parseD(addDays(start, w * 7));
    if (mon.getMonth() !== lastM && w < weeks - 2) { lastM = mon.getMonth(); labels += `<text class="ax" x="${L + w * (C + G)}" y="11">${MONTHS[lastM].slice(0, 3)}</text>`; }
    for (let d = 0; d < 7; d++) {
      const ds = addDays(start, w * 7 + d); if (ds > end) break;
      const v = by[ds] || 0;
      const tip = `<b>${dayLabel(ds)}, ${DOW[parseD(ds).getDay()]}</b><br>${v ? fmt(v) : 'без покупок'}`;
      cells += `<rect x="${L + w * (C + G)}" y="${T + d * (C + G)}" width="${C}" height="${C}" rx="3" fill="${FILL[lvl(v)]}"${ds === end ? ' stroke="var(--ink)" stroke-width="1.5"' : ''} data-tip="${esc(tip)}"/>`;
    }
  }
  [[0, 'Пн'], [2, 'Ср'], [4, 'Пт'], [6, 'Нд']].forEach(([d, l]) => labels += `<text class="ax" x="0" y="${T + d * (C + G) + 10}">${l}</text>`);
  const W = L + weeks * (C + G), H = T + 7 * (C + G);
  const top = Object.keys(by).sort((a, b) => by[b] - by[a])[0];
  el.innerHTML = `<h2>Рік по днях <small>${ST_CAT ? esc(short(ST_CAT)) : 'без фіксованих платежів'} · ${plural(Object.keys(by).length, 'день', 'дні', 'днів')} з покупками</small></h2>
    <div class="heat"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Витрати по днях за рік">${labels}${cells}</svg></div>
    <div class="ckey heat-key"><span>менше ${FILL.map(f => `<i style="background:${f}"></i>`).join('')} більше</span>${top ? `<span>найдорожчий день: <b style="color:var(--ink)">${dayLabel(top)}</b> — ${fmt(by[top])}</span>` : ''}</div>`;
}

/* Категорії: горизонтальні стовпці, натискання — фільтр усієї статистики. Під назвою — різниця з минулим місяцем / періодом */
function renderCatsStat(allCur, total, nMonths, allPrev) {
  const by = {}, pby = {};
  allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  if (allPrev) allPrev.forEach(t => pby[t.category] = (pby[t.category] || 0) + t.eur);
  const vsWhat = PERIOD === 'month' ? 'до ' + MONTHS_G[+monthStart(S.today, -1).slice(5, 7) - 1].slice(0, 4) + '. на ту ж дату'
    : PERIOD === 'prev' ? 'до позаминулого місяця' : 'до попереднього періоду';
  const cmp = n => {
    if (!allPrev) return '';
    const d = by[n] - (pby[n] || 0);
    if (!pby[n]) return '<small>нова цього періоду</small>';
    if (Math.abs(d) < .5) return '<small>≈ так само</small>';
    return `<small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d), DISP, true)} ${vsWhat}</small>`;
  };
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const names = Object.keys(by).sort((a, b) => by[b] - by[a]);
  const max = Math.max(...names.map(n => Math.max(by[n], (S.categories.find(c => c.name === n) || {}).plan * nMonths || 0)), 1);
  $('#stCats').innerHTML = `<h2>Категорії <small>натисніть, щоб відфільтрувати</small></h2>` + (names.length ? names.map(n => {
    const plan = ((S.categories.find(c => c.name === n) || {}).plan || 0) * nMonths, over = plan && by[n] > plan + .005;
    const tip = `<b>${esc(n)}</b><br>${fmt(by[n])} · ${Math.round(by[n] / sum * 100)}% усіх витрат${plan ? `<br>бюджет: ${fmt(plan)}${over ? ' · перевищено' : ''}` : ''}`;
    return `<button class="hbar ${ST_CAT === n ? 'sel' : ''}" data-stcat="${esc(n)}" style="--c:${over ? 'var(--bad)' : catColor(n)}" data-tip="${esc(tip)}">
      <span class="ic" style="color:${catColor(n)}">${catIcon(n)}</span><span class="nm">${esc(short(n))}${cmp(n)}</span>
      <span class="v num">${fmt(by[n])}<small>${Math.round(by[n] / sum * 100)}%</small></span>
      <span class="track"><i style="width:${by[n] / max * 100}%"></i>${plan ? `<span class="pl" style="left:calc(${Math.min(100, plan / max * 100)}% - 1px)"></span>` : ''}</span>
    </button>`;
  }).join('') + `<div class="ckey"><span><i style="background:var(--ink2);width:2px;height:10px;vertical-align:-1px"></i>бюджет категорії за період</span></div>` : '<div class="empty">За цей період витрат немає</div>');
}

/* Дні тижня: середня сума покупок у кожен день тижня */
function renderWeek(real, R) {
  const sums = Array(7).fill(0), cnt = Array(7).fill(0);
  real.forEach(t => sums[(parseD(t.date).getDay() + 6) % 7] += t.eur);
  for (let i = 0; i < daysBetween(R.from, R.to); i++) cnt[(parseD(addDays(R.from, i)).getDay() + 6) % 7]++;
  const avg = sums.map((s, i) => cnt[i] ? s / cnt[i] : 0);
  const max = niceMax(Math.max(...avg) * 1.05), peak = avg.indexOf(Math.max(...avg));
  $('#stWeek').innerHTML = `<h2>Дні тижня <small>середні витрати за день</small></h2>
    <div class="vbars" style="--n:7;--c:var(--accent)" role="img" aria-label="Середні витрати за днями тижня">${avg.map((v, i) => {
      const tip = `<b>${DOW[(i + 1) % 7]}</b><br>у середньому ${fmt(v)}<br>усього ${fmt(sums[i])} за ${cnt[i]} дн.`;
      return `<div class="vb ${i === peak && v > 0 ? 'peak' : ''}" data-tip="${esc(tip)}"><div class="plot"><i style="height:${v / max * 100}%;background:${i >= 5 ? 'var(--accent)' : '#7D97E0'}"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${DOW_S[i]}</span></div>`;
    }).join('')}</div>
    <div class="ckey"><span><i style="background:#7D97E0"></i>будні</span><span><i style="background:var(--accent)"></i>вихідні</span><span>обведено — найдорожчий день</span></div>`;
}

/* Найчастіші місця й найбільші покупки */
function renderPlaces(real) {
  const by = {};
  real.forEach(t => {
    const k = cleanNote(t.note); if (!k) return;
    const key = k.toLowerCase();
    (by[key] = by[key] || {name: k, sum: 0, n: 0, cat: t.category}); by[key].sum += t.eur; by[key].n++;
  });
  const top = Object.values(by).sort((a, b) => b.sum - a.sum).slice(0, 6);
  const big = real.slice().sort((a, b) => b.eur - a.eur).slice(0, 4);
  $('#stPlaces').innerHTML = `<h2>Де ви витрачаєте <small>за сумою</small></h2>
    ${top.length ? top.map((p, i) => `<div class="rank" data-tip="${esc(`<b>${esc(p.name)}</b><br>${p.n} раз · у середньому ${fmt(p.sum / p.n)}`)}"><span class="n">${i + 1}</span><span class="nm">${esc(p.name)}<small>${plural(p.n, 'покупка', 'покупки', 'покупок')} · ${esc(short(p.cat))}</small></span><span class="v num">${fmt(p.sum)}</span></div>`).join('')
      : '<div class="hint" style="padding:8px 4px">Заповнюйте поле «Де / що» — і тут зʼявиться рейтинг місць.</div>'}
    <div class="label" style="margin:var(--s4) 0 var(--s1)">Найбільші покупки</div>
    ${big.map(t => `<div class="rank"><span class="ic" style="color:${catColor(t.category)}">${catIcon(t.category)}</span><span class="nm">${esc(cleanNote(t.note) || short(t.category))}<small>${dayLabel(t.date)}</small></span><span class="v num">${fmt(t.eur)}</span></div>`).join('') || '<div class="hint">—</div>'}`;
}

/* Висновки простими словами */
function renderInsights(x) {
  const out = [];
  const by = {}; x.allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const topVar = Object.keys(by).filter(n => !(S.fixed || {})[n]).sort((a, b) => by[b] - by[a])[0];
  if (PERIOD === 'month' && x.planMonth) {
    const elapsed = daysBetween(x.R.from, x.R.to), days = dim(x.R.from);
    const variable = x.cur.filter(t => !t.fixed).reduce((s, t) => s + t.eur, 0), fixed = x.total - variable;
    const proj = fixed + variable / elapsed * days;
    out.push(['bulb', proj > x.planMonth
      ? `Якщо витрачати в тому ж темпі, до кінця місяця вийде <b>${fmt(proj)}</b> — це на <b>${fmt(proj - x.planMonth)}</b> більше за бюджет.`
      : `У такому темпі місяць закінчиться на <b>${fmt(proj)}</b> — і ще лишиться <b>${fmt(x.planMonth - proj)}</b> з бюджету.`]);
  }
  if (x.R.pFrom && x.prevTotal) {
    const d = x.total - x.prevTotal;
    out.push([d > 0 ? 'trendUp' : 'trendDown', `Порівняно ${esc(x.R.label)} — на <b>${fmt(Math.abs(d))} ${d > 0 ? 'більше' : 'менше'}</b>.`]);
  }
  if (topVar && !ST_CAT) out.push(['star', `Найбільше змінних витрат — <b>${esc(short(topVar))}</b>: ${fmt(by[topVar])}, це ${Math.round(by[topVar] / sum * 100)}% усіх витрат.`]);
  const smallN = x.real.filter(t => t.eur < 5), smallSum = smallN.reduce((s, t) => s + t.eur, 0);
  if (smallN.length >= 5) out.push(['receipt', `Дрібні покупки до ${fmt(5, DISP, true)} — <b>${smallN.length} шт.</b> на суму <b>${fmt(smallSum)}</b>. Непомітно, але складається.`]);
  const noSpend = Array.from({length: daysBetween(x.R.from, x.R.to)}, (_, i) => addDays(x.R.from, i)).filter(d => !x.real.some(t => t.date === d)).length;
  if (noSpend) out.push(['calendar', `Днів без жодної покупки: <b>${noSpend}</b>.`]);
  $('#stInsights').innerHTML = `<h2>Висновки <small>автоматично</small></h2><div class="insights">${out.length ? out.map(([ic, t]) => `<div class="ins"><span class="ic">${svg(ic)}</span><span>${t}</span></div>`).join('') : '<div class="hint">Замало даних для висновків.</div>'}</div>`;
}

/* ---------- підсумки місяців ---------- */
function currentSummary() {
  const ym = ymOf(D.today), vc = viewCats();
  const plan = vc.reduce((s, c) => s + c.plan, 0) + extraBudget(), spent = vc.reduce((s, c) => s + c.fact, 0);
  return {ym, current: true, plan, spent, left: plan - spent, pct: plan ? spent / plan * 100 : 0,
    count: D.recent.filter(t => ymOf(t.date) === ym).length, avg: spent / Math.max(1, D.days.length),
    overDays: D.days.filter(d => d.date <= D.today && d.limit && d.spent > d.limit).length,
    cats: vc.reduce((o, c) => (o[c.name] = c.fact, o), {}), biggest: ''};
}

/* ---------- архів ---------- */
function arcMonth(m) {
  const cats = {};
  m.rows.forEach(r => cats[r[1]] = (cats[r[1]] || 0) + r[2]);
  D.categories.forEach(c => { if (c.fixed && (cats[c.name] || 0) < c.fixed) cats[c.name] = c.fixed; }); // гуртожиток, як на дашборді
  const total = Object.values(cats).reduce((a, b) => a + b, 0);
  const sum = (D.months || []).find(s => s.ym === m.ym);
  const plan = sum ? sum.plan : D.categories.reduce((s, c) => s + c.plan, 0);
  return {cats, total, plan, left: plan - total};
}

function renderArchive() {
  const box = $('#archive'); if (!box) return;

    ${c.pending ? `<div class="pending" style="margin:var(--s3) 0 0"><span class="ic" style="color:var(--accent)">${svg('archive')}</span><div><b>${monthName(c.pending)} ще в «Транзакціях»</b>${on ? 'Можна перенести в архів зараз' : 'Підсумувати зараз (перенесе ваша кнопка)'}</div><button class="btn btn-primary btn-sm" data-close-month="${c.pending}">${on ? 'Перенести' : 'Підсумувати'}</button></div>` : ''}
  </section>`;

  if (!A.found || !A.months.length) {
    box.innerHTML = head + `<section class="card"><div class="empty"><div class="e-ic">${svg('archive')}</div><b>Архів поки порожній</b>Тут зʼявляться витрати минулих місяців після закриття місяця.</div></section>`;

  }

        ${Object.keys(days).map(d => `<div class="group"><span>${dayLabel(d)}, ${DOW[parseD(d).getDay()]}</span><span class="num">${fmt(days[d].reduce((x, r) => x + r[2], 0))}</span></div>` +
          days[d].map(r => `<div class="tx" style="--c:${catColor(r[1])};cursor:default"><span class="ic">${catIcon(r[1])}</span><span style="min-width:0"><div class="t">${esc(r[3] || short(r[1]))}</div><div class="s">${esc(r[3] ? short(r[1]) : '')}</div></span><span class="a num">${fmt(r[2])}</span></div>`).join('')).join('')}

        <span class="s num">${q ? `знайдено: ${m.rows.length}` : plural(m.rows.length, 'запис', 'записи', 'записів')} · бюджет ${fmt(s.plan, DISP, true)}</span>
        <span class="d ${s.left >= 0 ? 'ok' : 'bad'} num">${s.left >= 0 ? svg('check') + ' −' : svg('alert') + ' +'}${fmt(Math.abs(s.left))}</span>

    </div>`;
  }).join('');

  box.innerHTML = head + `<div class="box search" style="margin:0"><span class="pre">${svg('search')}</span><input id="arcQ" type="search" placeholder="Пошук в архіві: Lidl, 12,50, 2026-09…" value="${esc(ARC_Q)}" autocomplete="off"></div>` +
    (list || `<div class="card"><div class="empty"><div class="e-ic">${svg('search')}</div><b>Нічого не знайдено</b>Спробуйте інше слово або суму.</div></div>`);
}
/* ПК: ліворуч список місяців, праворуч вибраний місяць і порівняння з іншим */
function archiveDesk(months, q) {
  const sel = months.find(m => m.ym === ARC_OPEN) || months[0];
  const search = `<div class="box search" style="margin:0"><span class="pre">${svg('search')}</span><input id="arcQ" type="search" placeholder="Пошук: Lidl, 12,50…" value="${esc(ARC_Q)}" autocomplete="off"></div>`;
  const items = months.map(m => {
    const s = arcMonth(A.months.find(x => x.ym === m.ym));
    const order = Object.keys(s.cats).sort((a, b) => s.cats[b] - s.cats[a]);
    return `<button class="arc-li ${sel && m.ym === sel.ym ? 'on' : ''}" data-arc="${m.ym}">
      <span class="nm">${monthName(m.ym)}</span><span class="v num">${fmt(s.total)}</span>
      <span class="s num">${q ? `знайдено: ${m.rows.length}` : plural(m.rows.length, 'запис', 'записи', 'записів')}</span>
      <span class="d ${s.left >= 0 ? 'ok' : 'bad'} num">${s.left >= 0 ? svg('check') + ' −' : svg('alert') + ' +'}${fmt(Math.abs(s.left), DISP, true)}</span>
      <span class="mini">${order.map(k => `<i style="width:${s.cats[k] / s.total * 100}%;background:${catColor(k)}"></i>`).join('')}</span>
    </button>`;
  }).join('');
  if (!sel) return `<div class="arc-md"><div class="arc-list">${search}</div><div class="card"><div class="empty"><div class="e-ic">${svg('search')}</div><b>Нічого не знайдено</b>Спробуйте інше слово або суму.</div></div></div>`;

  const full = A.months.find(x => x.ym === sel.ym), s = arcMonth(full);
  const plans = D.categories.reduce((o, c) => (o[c.name] = c.plan, o), {});
  const cmpM = ARC_CMP && ARC_CMP !== sel.ym ? A.months.find(x => x.ym === ARC_CMP) : null;
  const c = cmpM ? arcMonth(cmpM) : null;
  const ok = s.left >= 0, n = full.rows.length, days = dim(sel.ym + '-01');

  let catsBlock;
  if (c) {
    const keys = [...new Set(Object.keys(s.cats).concat(Object.keys(c.cats)))].sort((a, b) => (s.cats[b] || 0) - (s.cats[a] || 0));
    const mx = Math.max(...keys.map(k => Math.max(s.cats[k] || 0, c.cats[k] || 0)), 1);
    const row = (k, a, b, cls = '') => { const d = a - b;
      return `<div class="cmp-row ${cls}">${k ? `<span class="ic" style="color:${catColor(k)}">${catIcon(k)}</span><span class="nm">${esc(short(k))}</span>
        <span class="cmp-bars"><i style="width:${a / mx * 100}%;background:${catColor(k)}"></i><i style="width:${b / mx * 100}%;background:var(--mute);opacity:.55"></i></span>`
        : '<span></span><span class="nm">Разом</span><span></span>'}
        <span class="v num">${fmt(a)}<small>${fmt(b)}</small></span>
        <span class="d num ${d > .005 ? 'bad' : d < -.005 ? 'ok' : ''}">${Math.abs(d) < .005 ? 'так само' : (d > 0 ? '+' : '−') + fmt(Math.abs(d))}</span></div>`; };
    catsBlock = `<div class="ckey" style="margin:0 0 var(--s2)"><span><i style="background:var(--ink)"></i>${monthName(sel.ym)}</span><span><i style="background:var(--mute)"></i>${monthName(cmpM.ym)}</span><span>різниця: червоне — витратили більше</span></div>
      ${keys.map(k => row(k, s.cats[k] || 0, c.cats[k] || 0)).join('')}${row('', s.total, c.total, 'total')}`;
  } else {
    const order = Object.keys(s.cats).sort((a, b) => s.cats[b] - s.cats[a]);
    const mx = Math.max(...order.map(k => Math.max(s.cats[k], plans[k] || 0)), 1);
    catsBlock = order.map(k => { const pl = plans[k] || 0, over = pl && s.cats[k] > pl + .005;
      return `<div class="hbar" style="--c:${over ? 'var(--bad)' : catColor(k)}"><span class="ic" style="color:${catColor(k)}">${catIcon(k)}</span><span class="nm">${esc(short(k))}</span><span class="v num">${fmt(s.cats[k])}<small>${pl ? 'з ' + fmt(pl, DISP, true) : Math.round(s.cats[k] / s.total * 100) + '%'}</small></span><span class="track"><i style="width:${s.cats[k] / mx * 100}%"></i>${pl ? `<span class="pl" style="left:calc(${Math.min(100, pl / mx * 100)}% - 1px)"></span>` : ''}</span></div>`; }).join('') +
      `<div class="ckey"><span><i style="background:var(--ink2);width:2px;height:10px;vertical-align:-1px"></i>бюджет категорії</span></div>`;
  }

  const rows = sel.rows.slice().sort((a, b) => b[0].localeCompare(a[0])).map(r => { const d = parseD(r[0]);
    return `<tr style="--c:${catColor(r[1])}"><td class="num">${d.getDate()} ${MONTHS_G[d.getMonth()]} <span class="orig">${DOW_S[(d.getDay() + 6) % 7]}</span></td>
      <td><span class="cat-cell"><span class="dot">${catIcon(r[1])}</span><span>${esc(short(r[1]))}</span></span></td>
      <td>${r[3] ? esc(r[3]) : '<span class="orig">—</span>'}</td><td class="r amt num">${fmt(r[2])}</td></tr>`; }).join('');

  return `<div class="arc-md">
    <div class="arc-list">${search}${items}</div>
    <div class="arc-detail">
      <section class="card">
        <div class="ad-top">
          <div><span class="label">Архів · ${plural(n, 'запис', 'записи', 'записів')}</span><h2>${monthName(sel.ym)} <span class="badge ${ok ? 'ok' : 'bad'}">${svg(ok ? 'check' : 'alert')} ${ok ? 'Бюджет дотримано' : 'Перевищено'}</span></h2></div>
          <label class="cmp">Порівняти з
            <select class="selx" id="arcCmp"><option value="">— не порівнювати —</option>${A.months.filter(x => x.ym !== sel.ym).map(x => `<option value="${x.ym}" ${cmpM && x.ym === cmpM.ym ? 'selected' : ''}>${monthName(x.ym)}</option>`).join('')}</select>
          </label>
        </div>
        <div class="ad-tiles">
          <div class="tile"><span class="label">Витрачено</span><b class="num">${fmt(s.total)}</b><small>${c ? deltaHTML(s.total, c.total) + ' до ' + MONTHS_G[+cmpM.ym.slice(5) - 1] : 'разом з фіксованими'}</small></div>
          <div class="tile"><span class="label">Бюджет</span><b class="num">${fmt(s.plan)}</b><small>${Math.round(s.total / (s.plan || 1) * 100)}% використано</small></div>
          <div class="tile"><span class="label">${ok ? 'Зекономлено' : 'Перевитрата'}</span><b class="num" style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${fmt(Math.abs(s.left))}</b><small>&nbsp;</small></div>
          <div class="tile"><span class="label">На день</span><b class="num">${fmt(s.total / days)}</b><small>${plural(n, 'покупка', 'покупки', 'покупок')}</small></div>
        </div>
        <div class="label" style="margin-bottom:var(--s2)">${c ? 'Порівняння за категоріями' : 'За категоріями'}</div>
        ${catsBlock}
      </section>
      <section class="card">
        <h2>Усі витрати <small>${q ? `знайдено ${sel.rows.length} з ${n}` : ''}</small></h2>
        <table class="tt"><colgroup><col style="width:28%"><col style="width:26%"><col><col style="width:20%"></colgroup>
          <thead><tr><th><span>Дата</span></th><th><span>Категорія</span></th><th><span>Де / що</span></th><th class="r"><span style="justify-content:flex-end">Сума</span></th></tr></thead>
          <tbody>${rows}</tbody></table>
      </section>
    </div>
  </div>`;
}

  let left = Math.min(Math.max(8, cx - tw / 2), innerWidth - tw - 8), top = r.top - th - 8;

/* ---------- бюджет: редагування з додатка → колонка «План» на дашборді ---------- */

const budNum = s => { const n = parseFloat(String(s).replace(/[\s €]/g, '').replace(',', '.')); return isNaN(n) ? NaN : Math.round(n * 100) / 100; };
const budVal = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const prevCats = () => { const m = (D.months || [])[0]; return m && m.cats ? m : null; };

function openBudget() {

        ${c.locked ? `<span class="lock"><b class="num">${fmt(c.plan, 'EUR')}</b>формула в таблиці</span>` : `<span class="step">

function budChanges() {
  const out = [];
  D.categories.forEach(c => {
    const v = c.locked || isNaN(BUD[c.name]) ? c.plan : BUD[c.name];
    const ch = {name: c.name};
    if (!c.locked && !isNaN(BUD[c.name]) && Math.abs(BUD[c.name] - c.plan) > .005) { ch.plan = BUD[c.name]; ch.was = c.plan; }
    const fx = BUDF[c.name] ? v : 0;
    if (Math.abs(fx - (c.fixed || 0)) > .005) { ch.fixed = fx; ch.fixedWas = c.fixed || 0; }
    if (ch.plan != null || ch.fixed != null) out.push(ch);
  });
  return out;
}

function budUpdate() {
  const total = D.categories.reduce((s, c) => s + (isNaN(BUD[c.name]) ? c.plan : BUD[c.name]), 0);
  const was = D.categories.reduce((s, c) => s + c.plan, 0), d = total - was;
  const bad = D.categories.some(c => !c.locked && (isNaN(BUD[c.name]) || BUD[c.name] < 0));
  $('#budSum').textContent = fmt(total, 'EUR');
  $('#budDiff').innerHTML = (Math.abs(d) > .005 ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d), 'EUR')}</span> до поточного<br>` : 'без змін<br>') +
    (DISP !== 'EUR' ? `≈ ${fmt(total)}` : `≈ ${fmt(total, 'UAH')}`);

}

function catOps() {
  const ops = [];
  CED.forEach(c => { if (c.orig && c.del) ops.push({op: 'delete', name: c.orig, moveTo: c.moveTo || ''}); });
  CED.forEach(c => { const n = c.name.trim().replace(/\s+/g, ' '); if (c.orig && !c.del && n !== c.orig) ops.push({op: 'rename', from: c.orig, to: n}); });
  CED.forEach(c => { if (!c.orig && !c.del && c.name.trim()) ops.push({op: 'add', name: c.name.trim().replace(/\s+/g, ' '), plan: budNum(c.plan || 0) || 0}); });
  return ops;
}
function catProblem() {
  const live = CED.filter(c => !c.del && (c.orig || c.name.trim()));
  if (!live.length) return 'Має лишитися хоча б одна категорія';
  const seen = {};
  for (const c of live) {
    const n = c.name.trim().replace(/\s+/g, ' ').toLowerCase();
    if (!n) return 'Вкажіть назву категорії';
    if (/всього|разом/.test(n)) return 'Назва не може містити «всього» чи «разом»';
    if (seen[n]) return 'Дві категорії з однаковою назвою: «' + c.name.trim() + '»';
    seen[n] = 1;
  }

}

let SYNC_AT = 0, SYNC_ST = 'wait', syncBusy = false;
function syncMark(st) { SYNC_ST = st; if (st === 'ok') SYNC_AT = Date.now(); syncLabel(); }
function syncLabel() {
  const el = $('#sync'); if (!el) return;
  if (PWA && !isDemo() && store.get('mode') !== 'google') { el.className = 'sync err'; el.textContent = 'вхід не виконано'; return; }
  if (PWA && NET === 'off') {
    el.className = 'sync err';
    el.textContent = 'офлайн · ' + (Q.length ? plural(Q.length, 'витрата чекає', 'витрати чекають', 'витрат чекають') + ' інтернету' : 'показую збережені дані');
    return;
  }
  if (PWA && Q.length) { el.className = 'sync wait'; el.textContent = 'надсилаю в таблицю: ' + Q.length; return; }
  el.className = 'sync' + (SYNC_ST === 'ok' ? '' : SYNC_ST === 'err' ? ' err' : ' wait');
  if (SYNC_ST === 'err') { el.textContent = 'немає звʼязку з таблицею — спробую ще'; return; }
  if (SYNC_ST === 'wait') { el.textContent = 'синхронізую…'; return; }
  const s = Math.round((Date.now() - SYNC_AT) / 1000);
  el.textContent = D && D.demo ? 'демо: зміни не потрапляють у таблицю' : 'синхронізовано з таблицею ' + (s < 45 ? 'щойно' : s < 3600 ? Math.round(s / 60) + ' хв тому' : 'давно');

    plusSave(t, {mode: ds.roll}, msg);
  }
  else if (t.hasAttribute('data-pig-take')) {

  }

    if (!(day >= 1 && day <= 31)) return err('День місяця — від 1 до 31');
    const list = ((D.extras || {}).recur || []).concat([{note, amount, day, category: $('#rCat').value, currency: 'EUR'}]);
    plusSave(t, {recur: list}, `Додано: ${note || short($('#rCat').value)} щомісяця ${day}-го`);
  }
  else if (ds.rDel) {
    // без «Ви впевнені?»: прибираємо одразу, у сповіщенні — «Повернути». Уже записані витрати лишаються в таблиці
    const old = (D.extras || {}).recur || [], gone = old.find(r => r.id === ds.rDel);
    try {
      D = await busy(t, '…', () => api('setExtras', {recur: old.filter(r => r.id !== ds.rDel)}));
      render(); openPlus();
      toast(`Прибрано: ${gone ? gone.note || short(gone.category) : 'повторювану витрату'}`, 'Повернути', async () => {
        $('#toast').classList.remove('on');
        try { D = await api('setExtras', {recur: old}); render(); if ($('#plusSheet').classList.contains('on')) openPlus(); toast('Повторювану витрату повернуто'); }
        catch (err) { toast(friendly(err), '', null, 'error'); }
      });
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.id === 'digTog') {
    const on = t.getAttribute('aria-pressed') !== 'true';
    plusSave(t, {digest: on}, on ? 'Щонеділі прийде лист з підсумком тижня' : 'Лист вимкнено');
  }
  else if (t.hasAttribute('data-dig-test')) {
    try { const r = await busy(t, 'Надсилаю…', () => api('sendDigestNow')); toast('Лист надіслано' + (r && r.to ? ' на ' + r.to : '')); }
    catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.src != null) { $('#note').value = ds.src; renderSources(); }
  else if (t.parentElement && t.parentElement.id === 'kindSeg') setKind(ds.k);
  else if (ds.inc) {
    const inc = (D.incomes || []).find(x => x.row === +ds.inc); if (!inc) return;
    // без «Ви впевнені?» — після видалення є «Повернути»
    try {
      D = await api('deleteIncome', inc.row, inc.amount); render();
      toast('Дохід видалено', 'Повернути', async () => {
        $('#toast').classList.remove('on');
        try { D = (await api('addIncome', {date: inc.date, amount: inc.amount, currency: normCur(inc.currency), note: inc.note})).data; render(); toast('Дохід повернуто'); }
        catch (err) { toast(friendly(err), '', null, 'error'); }
      });
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.hasAttribute('data-open-sheets')) openSheets();
  else if (ds.shGo) {
    // з екрана вибору (без відкритої таблиці) теж працює
    if (!D) { hubDone(t, 'hub_switch', [ds.shGo]); return; }
    shApply(t, 'Відкриваю…', 'hub_switch', [ds.shGo], 'Перемкнуто на іншу таблицю');
  }
  else if (ds.shForget) {
    if (!confirm('Прибрати таблицю зі списку? Сама таблиця лишиться у вашому Google Диску — її можна підключити знову.')) return;
    try {
      const info = await api('hub_forgetSheet', ds.shForget);
      if (D && ds.shForget !== D.hub.current) { D.hub = Object.assign({}, D.hub, info); openSheets(); toast('Прибрано зі списку'); }
      else if (info.sheets.length) { closeSheets(); await shApply(t, '…', 'hub_switch', [info.sheets[0].id], 'Прибрано · відкрито «' + info.sheets[0].name + '»'); }
      else { closeSheets(); showWelcome(''); }
    } catch (err) { shErr(err); }
  }
  else if (t.hasAttribute('data-sh-new')) shApply(t, 'Створюю…', 'hub_createSheet', [$('#shNewName').value.trim()], 'Нову таблицю створено у вашому Google Диску');
  else if (t.hasAttribute('data-sh-use')) {
    const v = $('#shUrl').value.trim(); if (!v) { shErr('Вставте посилання на таблицю'); return; }
    shApply(t, 'Підключаю…', 'hub_useSheet', [v], 'Таблицю підключено');
  }
  else if (t.hasAttribute('data-sh-rename')) {
    const v = $('#shRename').value.trim(); if (!v) { shErr('Вкажіть назву'); return; }
    try { D = await busy(t, '…', () => api('hub_renameSheet', v)); render(); openSheets(); toast('Назву змінено'); } catch (err) { shErr(err); }
  }
  else if (t.hasAttribute('data-hub-reset')) {
    if (!confirm('Створити нову порожню таблицю? Поточна лишиться у вашому Google Диску, але програма працюватиме з новою.')) return;
    try { await api('hub_forgetSheet'); closeSheets(); showWelcome(''); }
    catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.hasAttribute('data-open-cats')) {
    if ($('#budgetSheet').classList.contains('on') && BUD && budChanges().length && !confirm('Незбережені зміни бюджету буде втрачено. Продовжити?')) return;
    openCats();
  }
  else if (t.hasAttribute('data-cadd')) {
    CED.push({orig: '', name: '', del: false, plan: ''}); renderCats();
    const ins = document.querySelectorAll('[data-cname]'); if (ins.length) ins[ins.length - 1].focus();
  }
  else if (ds.cdel != null) {
    const c = CED[+ds.cdel];
    if (!c.orig) CED.splice(+ds.cdel, 1); else c.del = true;
    renderCats();
  }
  else if (ds.cundo != null) { CED[+ds.cundo].del = false; renderCats(); }
  else if (t.id === 'catSave') {
    const ops = catOps(); if (!ops.length || catProblem()) return;
    const n = ops.filter(o => o.op === 'delete').length;
    if (n && !confirm(`Видалити ${plural(n, 'категорію', 'категорії', 'категорій')} з таблиці? Витрати цього місяця перейдуть у вибрану категорію.`)) return;
    t.disabled = true; t.textContent = 'Записую в таблицю…'; syncMark('wait');
    try {
      const res = await api('editCategories', ops);
      D = res.data; render(); refreshStats(); if (A) loadArchive(true); syncMark('ok');
      toast('Категорії оновлено в таблиці');
      openBudget();
    } catch (err) { syncMark('err'); toast(friendly(err), '', null, 'error'); catUpdate(); }
  }
  else if (ds.budFix) {
    BUDF[ds.budFix] = !BUDF[ds.budFix]; t.setAttribute('aria-pressed', BUDF[ds.budFix]); budUpdate();
  }
  else if (ds.budStep) {
    const inp = t.parentElement.querySelector('input'), name = inp.dataset.bud;
    const v = isNaN(BUD[name]) ? 0 : BUD[name], st = +ds.budStep;
    BUD[name] = Math.max(0, st > 0 ? Math.floor(v / st + 1e-9) * st + st : Math.ceil(v / -st - 1e-9) * -st + st);
    inp.value = budVal(BUD[name]); budUpdate();
  }
  else if (ds.budFill) {
    const pm = prevCats();
    D.categories.forEach(c => { if (c.locked) return;
      BUD[c.name] = ds.budFill === 'prev' && pm ? Math.ceil(Math.max(pm.cats[c.name] || 0, c.fixed || 0)) : c.plan; });
    document.querySelectorAll('[data-bud]').forEach(i => i.value = budVal(BUD[i.dataset.bud])); budUpdate();
  }
  else if (t.id === 'budSave') {
    const ch = budChanges(); if (!ch.length) return;
    t.disabled = true; t.textContent = 'Записую в таблицю…'; syncMark('wait');
    try { await saveBudgets(ch, true); closeSheets(); }
    catch (err) { syncMark('err'); toast(friendly(err), '', null, 'error'); budUpdate(); }
  }
  else if (t.id === 'retry') load();
  else if (t.parentElement && t.parentElement.id === 'dispSeg') {
    DISP = ds.c; store.set('disp', DISP);
    t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); render();
  }
  else if (t.parentElement && t.parentElement.id === 'curSeg') { ADD_CUR = ds.c; store.set('addCur', ADD_CUR); syncCurSeg(); updateEqv(); }
  else if (ds.chip) { ADD_CAT = ds.chip; store.set('addCat', ADD_CAT); renderChips(); }
  else if (ds.cat) {
    if (DESK.matches) { TF = ds.cat; TQ = ''; setTab('hist'); renderTable(); }
    else { FILTER = ds.cat; renderHistory(); setTab('hist'); }
  }
  else if ('clear' in ds) { FILTER = null; renderHistory(); }
  else if (t.id === 'refresh') { await load(); if (D) toast('Дані оновлено'); }

  /* ПК-таблиця */
  else if (ds.sort) { TSORT = {k: ds.sort, dir: TSORT.k === ds.sort ? -TSORT.dir : (ds.sort === 'date' || ds.sort === 'amount' ? -1 : 1)}; renderTableRows(); }
  else if ('tcat' in ds) { TF = ds.tcat || null; document.querySelectorAll('[data-tcat]').forEach(b => b.classList.toggle('on', b.dataset.tcat === (TF || ''))); renderTableRows(); }
  else if (ds.delrow) {
    const tx = txByRow(+ds.delrow); if (!tx) return;
    t.disabled = true;
    try { await removeTx(tx); } catch (err) { t.disabled = false; toast(friendly(err), '', null, 'error'); }
  }

  /* статистика */
  else if (ds.period) { PERIOD = ds.period; store.set('period', PERIOD); hideTip(); renderStats(); }
  else if ('stcat' in ds) { ST_CAT = ds.stcat && ds.stcat !== ST_CAT ? ds.stcat : null; hideTip(); renderStats(); }
  else if (ds.ym && t.classList.contains('vb')) {
    // Натискання на місяць у графіку — відкрити його підсумок, якщо він є
    const ym = ds.ym;
    if (ym === ymOf(D.today)) showMonth('now'); else if ((D.months || []).some(m => m.ym === ym)) showMonth(ym);
  }
  else if (ds.day) {
    // Натискання на день у календарі — показати витрати цього дня
    if (DESK.matches) { TF = null; TQ = ds.day; setTab('hist'); renderTable(); }
    else { FILTER = null; QUERY = ds.day; const q = $('#q'); if (q) q.value = QUERY; renderHistory(); setTab('hist'); }
    findAll(ds.day);
  }

  /* архів */
  else if (ds.arc) { ARC_OPEN = DESK.matches ? ds.arc : ARC_OPEN === ds.arc ? null : ds.arc; hideTip(); renderArchive(); }
  else if (ds.arcAuto) {
    try {
      await busy(t, '…', async () => { D = await api('setMonthArchive', ds.arcAuto === '1'); });
      if (A) A.auto = !!(D.close && D.close.archive);
      render(); renderArchive();
      toast(D.close.archive ? 'Готово: 1-го числа місяць перенесеться в архів сам' : 'Автоперенесення вимкнено');
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }

  /* підсумки місяців */
  else if (ds.closeAuto) {
    try { await busy(t, '…', async () => { D = await api('enableMonthClose', ds.closeAuto === '1'); }); render(); toast(D.close.auto ? 'Підсумок буде автоматично 1-го числа' : 'Автопідсумок вимкнено'); }
    catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.closeMonth) confirmClose(ds.closeMonth);
  else if (t.id === 'closeGo') {
    try {
      const res = await busy(t, 'Підсумовую…', () => api('app_closeMonth', ds.ym));
      D = res.data; render(); showMonth(res.summary.ym); refreshStats(); if (A) loadArchive(true);
      toast(`${monthName(res.summary.ym)}: ${fmt(res.summary.spent)} з ${fmt(res.summary.plan)}${res.summary.moved ? ` · ${res.summary.moved} записів в архіві` : ''}`);
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.month) showMonth(ds.month);

  /* витрати */
  else if (ds.row) { const tx = txByRow(+ds.row); if (tx) openTx(tx); }
  else if (t.parentElement && t.parentElement.id === 'eCurSeg') {
    EDIT.currency = ds.c; t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); editUpdate();
  }
  else if (ds.ecat) {
    EDIT.category = ds.ecat;
    document.querySelectorAll('[data-ecat]').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    editUpdate();
  }
  else if (t.id === 'eSave') {
    const o = OPEN_TX, p = editChanges(); if (!o || !p) return;
    const before = {amount: o.amount, currency: normCur(o.currency), date: o.date, note: o.note, category: o.category};
    try {
      D = await busy(t, 'Записую…', () => api('updateTransaction', o.row, o.amount, p));
      LAST = null; render(); refreshStats(); closeSheets(); refind();
      toast('Зміни збережено в таблиці', 'Повернути', async () => {
        $('#toast').classList.remove('on');
        try { D = await api('updateTransaction', o.row, p.amount, before); render(); refreshStats(); refind(); toast('Попередні дані повернуто'); }
        catch (err) { toast(friendly(err), '', null, 'error'); }
      });
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.id === 'del') {
    if (!OPEN_TX) return; t.disabled = true;
    try { await removeTx(OPEN_TX); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false;
  }
  else if (t.id === 'save') {
    const amount = parseFloat($('#amt').value.replace(',', '.'));
    if (!(amount > 0)) { setAmtError(true); $('#amt').focus(); return; }
    if (ADD_KIND === 'inc') {
      const it = {date: $('#date').value || D.today, amount: Math.round(amount * 100) / 100, currency: ADD_CUR, note: $('#note').value.trim()};
      t.disabled = true; t.textContent = 'Зберігаю…';
      try {
        const res = await api('addIncome', it);
        D = res.data; render(); pulse(); closeSheets();
        toast(`Дохід: +${fmtRaw(it.amount, it.currency)}${it.note ? ' · ' + it.note : ''}`, 'Скасувати', async () => {
          $('#toast').classList.remove('on');
          try { D = await api('deleteIncome', res.row, it.amount); render(); toast('Дохід скасовано'); } catch (err) { toast(friendly(err), '', null, 'error'); }
        });
      } catch (err) { toast(friendly(err), '', null, 'error'); }
      t.disabled = false; t.textContent = 'Додати дохід';
      return;
    }
    const tx = {date: $('#date').value || D.today, amount: Math.round(amount * 100) / 100, currency: ADD_CUR, category: ADD_CAT, note: cleanNote($('#note').value)};
    t.disabled = true; t.textContent = 'Зберігаю…';
    try { await addTx(tx, true); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false; t.textContent = 'Додати витрату';
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'amt') { e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1'); updateEqv(); }
  else if (e.target.id === 'eAmt') {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1');
    const v = budNum(e.target.value); EDIT.amount = isNaN(v) ? 0 : v; editUpdate();
  }
  else if (e.target.id === 'eDate') { EDIT.date = e.target.value; editUpdate(); }
  else if (e.target.id === 'eNote') { EDIT.note = e.target.value.trim(); editUpdate(); }
  else if (e.target.id === 'q') { QUERY = e.target.value; findAll(QUERY); renderHistory(); }
  else if (e.target.id === 'tq') { TQ = e.target.value; findAll(TQ); renderTableRows(); }
  else if (e.target.dataset && e.target.dataset.cname != null) {
    CED[+e.target.dataset.cname].name = e.target.value;
    const row = e.target.closest('.bud'), c = CED[+e.target.dataset.cname];
    if (row && c.orig) row.classList.toggle('chg', c.name.trim() !== c.orig);
    catUpdate();
  }
  else if (e.target.dataset && e.target.dataset.cplan != null) {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '');
    CED[+e.target.dataset.cplan].plan = e.target.value; catUpdate();
  }
  else if (e.target.dataset && e.target.dataset.bud != null) {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1');
    BUD[e.target.dataset.bud] = e.target.value === '' ? NaN : budNum(e.target.value); budUpdate();
  }
  else if (e.target.id === 'arcQ') {
    ARC_Q = e.target.value; const pos = e.target.selectionStart; renderArchive();
    const n = $('#arcQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'note') guessFromNote(e.target.value);
  else if (e.target.id === 'arcCmp') { ARC_CMP = e.target.value; renderArchive(); }
  else if (e.target.dataset && e.target.dataset.cmove != null) CED[+e.target.dataset.cmove].moveTo = e.target.value;
});
['amt', 'note'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') { if (id === 'note') guessFromNote(e.target.value); $('#save').click(); } }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheets(); hideTip(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-row]')) e.target.click();
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bud != null) { e.preventDefault(); $('#budSave').click(); }
});

// Перехід між телефонним і ПК-виглядом (зміна ширини вікна)
const onDesk = () => { hideTip(); if (D) render(); if (A) renderArchive(); };
if (DESK.addEventListener) DESK.addEventListener('change', onDesk); else DESK.addListener(onDesk);

// Лінійний графік перемальовується, коли змінюється ширина
let rsT, lastW = 0;
new ResizeObserver(() => {
  const w = $('#stats').clientWidth; if (Math.abs(w - lastW) < 8) return; lastW = w;
  clearTimeout(rsT); rsT = setTimeout(() => { if (S && document.body.classList.contains('t-stats')) renderStats(); }, 120);
}).observe($('#stats'));

document.querySelectorAll('#dispSeg button').forEach(b => b.classList.toggle('on', b.dataset.c === DISP));
if (PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
