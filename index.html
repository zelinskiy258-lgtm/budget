/* ---------- бюджет: редагування з додатка → колонка «План» на дашборді ---------- */
let BUD = null, BUDF = null; // чернетка: {назва: сума в €}, {назва: фіксована щомісяця}
const budNum = s => { const n = parseFloat(String(s).replace(/[\s €]/g, '').replace(',', '.')); return isNaN(n) ? NaN : Math.round(n * 100) / 100; };
const budVal = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const prevCats = () => { const m = (D.months || [])[0]; return m && m.cats ? m : null; };

function openBudget() {
  if (!D) return;
  BUD = {}; BUDF = {}; D.categories.forEach(c => { BUD[c.name] = c.plan; BUDF[c.name] = c.fixed > 0; });
  const pm = prevCats(), editable = D.categories.filter(c => !c.locked).length;
  $('#budBody').innerHTML = `
    <div class="note">Зміни записуються в колонку «План» аркуша «Дашборд та Бюджет». Денні ліміти та залишки таблиця перерахує сама.</div>
    <div class="bud-total"><div><span class="label">Разом на місяць</span><b class="num" id="budSum"></b></div><div class="r num" id="budDiff"></div></div>
    ${pm ? `<div class="bud-tools"><button class="btn btn-secondary btn-sm" data-bud-fill="prev">${svg('repeat')} Як витрачено в ${MONTHS_G[+pm.ym.slice(5) - 1]}</button><button class="btn btn-quiet btn-sm" data-bud-fill="reset">Скинути зміни</button></div>` : ''}
    ${editable ? '' : `<div class="pending"><span class="ic">${svg('alert')}</span><div><b>Бюджет у таблиці рахується формулами</b>Щоб змінювати його з додатка, впишіть у колонку «План» звичайні числа.</div></div>`}
    <div class="bud-list">${D.categories.map(c => {
      const pv = pm && pm.cats[c.name] != null ? ` · ${MONTHS_G[+pm.ym.slice(5) - 1].slice(0, 3)}. ${fmt(pm.cats[c.name], 'EUR', true)}` : '';
      return `<div class="bud" data-bud-row="${esc(c.name)}" style="--c:${catColor(c.name)}">
        <span class="ic">${catIcon(c.name)}</span>
        <span class="nm">${esc(short(c.name))}<small class="num">витрачено ${fmt(c.fact, 'EUR', true)}${pv}</small>
          <button class="fx" data-bud-fix="${esc(c.name)}" aria-pressed="${c.fixed > 0}" title="Сума рахується з 1-го числа щомісяця, без окремого запису — як оренда чи гуртожиток">${svg('repeat')} щомісяця</button></span>
        ${c.locked ? `<span class="lock"><b class="num">${fmt(c.plan, 'EUR')}</b>формула в таблиці</span>` : `<span class="step">
          <button data-bud-step="-5" aria-label="Менше на 5 €">−</button>
          <label>€<input data-bud="${esc(c.name)}" inputmode="decimal" enterkeyhint="done" value="${budVal(c.plan)}" aria-label="Бюджет: ${esc(short(c.name))}, євро" autocomplete="off"></label>
          <button data-bud-step="5" aria-label="Більше на 5 €">+</button></span>`}
      </div>`; }).join('')}</div>`;
  budUpdate();
  openSheet('#budgetSheet');
}

function budChanges() {
  const out = [];
  D.categories.forEach(c => {
    const v = c.locked || isNaN(BUD[c.name]) ? c.plan : BUD[c.name];
    const ch = {name: c.name};
    if (!c.locked && !isNaN(BUD[c.name]) && Math.abs(BUD[c.name] - c.plan) > .005) { ch.plan = BUD[c.name]; ch.was = c.plan; }
    const fx = BUDF[c.name] ? v : 0;
    if (Math.abs(fx - (c.fixed || 0)) > .005) { ch.fixed = fx; ch.fixedWas = c.fixed || 0; }
    if (ch.plan != null || ch.fixed != null) out.push(ch);
  });
  return out;
}

function budUpdate() {
  const total = D.categories.reduce((s, c) => s + (isNaN(BUD[c.name]) ? c.plan : BUD[c.name]), 0);
  const was = D.categories.reduce((s, c) => s + c.plan, 0), d = total - was;
  const bad = D.categories.some(c => !c.locked && (isNaN(BUD[c.name]) || BUD[c.name] < 0));
  $('#budSum').textContent = fmt(total, 'EUR');
  $('#budDiff').innerHTML = (Math.abs(d) > .005 ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d), 'EUR')}</span> до поточного<br>` : 'без змін<br>') +
    (DISP !== 'EUR' ? `≈ ${fmt(total)}` : `≈ ${fmt(total, 'UAH')}`);
  document.querySelectorAll('[data-bud-row]').forEach(r => {
    const c = D.categories.find(x => x.name === r.dataset.budRow), v = BUD[c.name];
    const fxChg = !!BUDF[c.name] !== (c.fixed > 0);
    r.classList.toggle('chg', fxChg || (!c.locked && !isNaN(v) && Math.abs(v - c.plan) > .005));
    r.classList.toggle('bad', !c.locked && (isNaN(v) || v < 0));
  });
  const n = budChanges().length, b = $('#budSave');
  b.disabled = bad || !n;
  b.textContent = bad ? 'Перевірте суми' : n ? `Зберегти в таблицю · ${plural(n, 'зміна', 'зміни', 'змін')}` : 'Зберегти в таблицю';
}

async function saveBudgets(changes, undoable) {
  const res = await api('setBudgets', changes);
  D = res.data; render(); refreshStats(); syncMark('ok');
  if (res.conflicts.length) {
    toast(`Не збережено: ${res.conflicts.map(short).join(', ')} — їх щойно змінили в таблиці. Перевірте ще раз`, '', null, 'error');
  } else if (res.skipped.length) {
    toast(`Пропущено: ${res.skipped.map(short).join(', ')} (формула або немає в таблиці)`, '', null, 'error');
  } else if (undoable) {
    toast(`Бюджет оновлено в таблиці · ${plural(res.saved, 'категорія', 'категорії', 'категорій')}`, 'Повернути', async () => {
      $('#toast').classList.remove('on');
      try { await saveBudgets(changes.map(c => ({name: c.name, plan: c.plan != null ? c.was : undefined, was: c.plan, fixed: c.fixed != null ? c.fixedWas : undefined})), false); toast('Попередній бюджет повернуто'); }
      catch (err) { toast(friendly(err), '', null, 'error'); }
    });
  }
  return res;
}

/* ---------- синхронізація з таблицею ---------- */
// Додаток пише в таблицю одразу, а зміни, зроблені в самій таблиці чи AppSheet,
// підтягує сам: кожні 30 с, поки вкладка відкрита, і щоразу, коли до неї повертаєтесь.
let SYNC_AT = 0, SYNC_ST = 'wait', syncBusy = false;
function syncMark(st) { SYNC_ST = st; if (st === 'ok') SYNC_AT = Date.now(); syncLabel(); }
function syncLabel() {
  const el = $('#sync'); if (!el) return;
  if (PWA && !store.get('apiUrl')) { el.className = 'sync err'; el.textContent = 'не підключено до таблиці'; return; }
  if (PWA && NET === 'off') {
    el.className = 'sync err';
    el.textContent = 'офлайн · ' + (Q.length ? plural(Q.length, 'витрата чекає', 'витрати чекають', 'витрат чекають') + ' інтернету' : 'показую збережені дані');
    return;
  }
  if (PWA && Q.length) { el.className = 'sync wait'; el.textContent = 'надсилаю в таблицю: ' + Q.length; return; }
  el.className = 'sync' + (SYNC_ST === 'ok' ? '' : SYNC_ST === 'err' ? ' err' : ' wait');
  if (SYNC_ST === 'err') { el.textContent = 'немає звʼязку з таблицею — спробую ще'; return; }
  if (SYNC_ST === 'wait') { el.textContent = 'синхронізую…'; return; }
  const s = Math.round((Date.now() - SYNC_AT) / 1000);
  el.textContent = D && D.demo ? 'демо: зміни не потрапляють у таблицю' : 'синхронізовано з таблицею ' + (s < 45 ? 'щойно' : s < 3600 ? Math.round(s / 60) + ' хв тому' : 'давно');
}
async function syncQuiet() {
  // не оновлюємо, коли відкрита форма — щоб не збити введення
  if (!D || syncBusy || document.hidden || $('#scrim').classList.contains('on')) return;
  syncBusy = true; const was = SYNC_ST; if (was !== 'ok') syncMark('wait');
  try {
    const d = await api('getData');
    if (JSON.stringify(d) !== JSON.stringify(D) && !$('#scrim').classList.contains('on')) {
      const ae = document.activeElement, id = ae && ae.id, pos = ae && ae.selectionStart;
      D = d; render(); refreshStats();
      const n = id && document.getElementById(id); if (n && n.focus) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }
    syncMark('ok');
    flushQueue();
  } catch (e) { syncMark('err'); }
  syncBusy = false;
}
addEventListener('online', () => { NET = 'on'; syncQuiet(); flushQueue(); });
addEventListener('offline', () => { NET = 'off'; syncLabel(); });
setInterval(syncQuiet, 30000);
setInterval(syncLabel, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncQuiet(); });
addEventListener('focus', syncQuiet);

/* ---------- натискання ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button,.scrim,.vb[data-ym],.day[data-day],tr[data-row]'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) setTab(ds.tab);
  else if (t.hasAttribute('data-open-add')) {
    if (!D) return;
    $('#date').value = D.today; $('#amt').value = ''; $('#note').value = ''; setAmtError(false); syncCurSeg(); renderChips(); updateEqv();
    openSheet('#addSheet'); setTimeout(() => $('#amt').focus(), 260);
  }
  else if (t.id === 'scrim' || t.hasAttribute('data-close')) closeSheets();

  /* підключення програми */
  else if (t.id === 'settings') { $('#connBody').innerHTML = connectHTML(true); openSheet('#connSheet'); }
  else if (t.id === 'cGo') {
    const url = $('#cUrl').value.trim(), k = $('#cKey').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec\/?$/.test(url)) { connErr('Посилання має бути з script.google.com і закінчуватись на /exec'); return; }
    if (k.length < 16) { connErr('Вставте ключ повністю — його показує функція apiSetup'); return; }
    connErr('');
    try {
      await busy(t, 'Перевіряю…', () => call_('getData', [], url, k));
      store.set('apiUrl', url); store.set('apiKey', k); store.set('c_getData', '');
      NET = 'on'; closeSheets(); S = null; A = null; await load(); if (D) toast('Підключено до таблиці');
    } catch (err) { connErr(err.net ? 'Немає звʼязку: перевірте інтернет і посилання' : friendly(err)); }
  }
  else if (t.id === 'cDemo') { store.set('apiUrl', 'demo'); load(); }
  else if (t.id === 'cCopy') {
    try { await navigator.clipboard.writeText(ds.link); toast('Посилання скопійовано — відкрийте його на іншому пристрої'); }
    catch (err) { prompt('Скопіюйте посилання:', ds.link); }
  }
  else if (t.id === 'cOff') {
    if (Q.length) { toast(`Спершу дочекайтесь інтернету: ${plural(Q.length, 'витрата', 'витрати', 'витрат')} ще не в таблиці`, '', null, 'error'); return; }
    ['apiUrl', 'apiKey', 'c_getData', 'c_getStats', 'c_getArchive'].forEach(k => store.set(k, ''));
    closeSheets(); showConnect();
  }
  else if (t.hasAttribute('data-open-budget')) openBudget();
  else if (ds.budFix) {
    BUDF[ds.budFix] = !BUDF[ds.budFix]; t.setAttribute('aria-pressed', BUDF[ds.budFix]); budUpdate();
  }
  else if (ds.budStep) {
    const inp = t.parentElement.querySelector('input'), name = inp.dataset.bud;
    const v = isNaN(BUD[name]) ? 0 : BUD[name], st = +ds.budStep;
    BUD[name] = Math.max(0, st > 0 ? Math.floor(v / st + 1e-9) * st + st : Math.ceil(v / -st - 1e-9) * -st + st);
    inp.value = budVal(BUD[name]); budUpdate();
  }
  else if (ds.budFill) {
    const pm = prevCats();
    D.categories.forEach(c => { if (c.locked) return;
      BUD[c.name] = ds.budFill === 'prev' && pm ? Math.ceil(Math.max(pm.cats[c.name] || 0, c.fixed || 0)) : c.plan; });
    document.querySelectorAll('[data-bud]').forEach(i => i.value = budVal(BUD[i.dataset.bud])); budUpdate();
  }
  else if (t.id === 'budSave') {
    const ch = budChanges(); if (!ch.length) return;
    t.disabled = true; t.textContent = 'Записую в таблицю…'; syncMark('wait');
    try { await saveBudgets(ch, true); closeSheets(); }
    catch (err) { syncMark('err'); toast(friendly(err), '', null, 'error'); budUpdate(); }
  }
  else if (t.id === 'retry') load();
  else if (t.parentElement && t.parentElement.id === 'dispSeg') {
    DISP = ds.c; store.set('disp', DISP);
    t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); render();
  }
  else if (t.parentElement && t.parentElement.id === 'curSeg') { ADD_CUR = ds.c; store.set('addCur', ADD_CUR); syncCurSeg(); updateEqv(); }
  else if (ds.chip) { ADD_CAT = ds.chip; store.set('addCat', ADD_CAT); renderChips(); }
  else if (ds.cat) {
    if (DESK.matches) { TF = ds.cat; TQ = ''; setTab('hist'); renderTable(); }
    else { FILTER = ds.cat; renderHistory(); setTab('hist'); }
  }
  else if ('clear' in ds) { FILTER = null; renderHistory(); }
  else if (t.id === 'refresh') { await load(); if (D) toast('Дані оновлено'); }

  /* ПК-таблиця */
  else if (ds.sort) { TSORT = {k: ds.sort, dir: TSORT.k === ds.sort ? -TSORT.dir : (ds.sort === 'date' || ds.sort === 'amount' ? -1 : 1)}; renderTableRows(); }
  else if ('tcat' in ds) { TF = ds.tcat || null; document.querySelectorAll('[data-tcat]').forEach(b => b.classList.toggle('on', b.dataset.tcat === (TF || ''))); renderTableRows(); }
  else if (ds.delrow) {
    const tx = D.recent.find(x => x.row === +ds.delrow); if (!tx) return;
    t.disabled = true;
    try { await removeTx(tx); } catch (err) { t.disabled = false; toast(friendly(err), '', null, 'error'); }
  }

  /* статистика */
  else if (ds.period) { PERIOD = ds.period; store.set('period', PERIOD); hideTip(); renderStats(); }
  else if ('stcat' in ds) { ST_CAT = ds.stcat && ds.stcat !== ST_CAT ? ds.stcat : null; hideTip(); renderStats(); }
  else if (ds.ym && t.classList.contains('vb')) {
    // Натискання на місяць у графіку — відкрити його підсумок, якщо він є
    const ym = ds.ym;
    if (ym === ymOf(D.today)) showMonth('now'); else if ((D.months || []).some(m => m.ym === ym)) showMonth(ym);
  }
  else if (ds.day) {
    // Натискання на день у календарі — показати витрати цього дня
    if (DESK.matches) { TF = null; TQ = ds.day; setTab('hist'); renderTable(); }
    else { FILTER = null; QUERY = ds.day; const q = $('#q'); if (q) q.value = QUERY; renderHistory(); setTab('hist'); }
  }

  /* архів */
  else if (ds.arc) { ARC_OPEN = DESK.matches ? ds.arc : ARC_OPEN === ds.arc ? null : ds.arc; hideTip(); renderArchive(); }
  else if (ds.arcAuto) {
    try {
      await busy(t, '…', async () => { D = await api('setMonthArchive', ds.arcAuto === '1'); });
      if (A) A.auto = !!(D.close && D.close.archive);
      render(); renderArchive();
      toast(D.close.archive ? 'Готово: 1-го числа місяць перенесеться в архів сам' : 'Автоперенесення вимкнено');
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }

  /* підсумки місяців */
  else if (ds.closeAuto) {
    try { await busy(t, '…', async () => { D = await api('enableMonthClose', ds.closeAuto === '1'); }); render(); toast(D.close.auto ? 'Підсумок буде автоматично 1-го числа' : 'Автопідсумок вимкнено'); }
    catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.closeMonth) confirmClose(ds.closeMonth);
  else if (t.id === 'closeGo') {
    try {
      const res = await busy(t, 'Підсумовую…', () => api('app_closeMonth', ds.ym));
      D = res.data; render(); showMonth(res.summary.ym); refreshStats(); if (A) loadArchive(true);
      toast(`${monthName(res.summary.ym)}: ${fmt(res.summary.spent)} з ${fmt(res.summary.plan)}${res.summary.moved ? ` · ${res.summary.moved} записів в архіві` : ''}`);
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.month) showMonth(ds.month);

  /* витрати */
  else if (ds.row) {
    OPEN_TX = D.recent.find(x => x.row === +ds.row); if (!OPEN_TX) return;
    const cur = normCur(OPEN_TX.currency), d = parseD(OPEN_TX.date);
    $('#txBody').innerHTML = `<span class="label">${catIcon(OPEN_TX.category)} ${esc(OPEN_TX.category)}</span>
      <div class="detail num">${fmtRaw(OPEN_TX.amount, cur)}</div>
      <dl class="dl">
        <dt>Де / що</dt><dd>${esc(OPEN_TX.note || '—')}</dd>
        <dt>Дата</dt><dd>${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${DOW[d.getDay()]}</dd>
        ${cur !== 'EUR' ? `<dt>У євро</dt><dd class="num">${fmt(toEur(OPEN_TX.amount, cur, D.rates), 'EUR')}</dd>` : ''}
        <dt>У таблиці</dt><dd>${OPEN_TX.row > 0 ? 'рядок ' + OPEN_TX.row : 'ще ні — надішлеться, коли буде інтернет'}</dd>
      </dl>
      <span class="flabel">Змінити категорію</span>
      <div class="chips" style="margin-bottom:var(--s3)">${D.categories.map(c => `<button class="chip ${c.name === OPEN_TX.category ? 'on' : ''}" data-recat="${esc(c.name)}">${catIcon(c.name)} ${esc(short(c.name))}</button>`).join('')}</div>`;
    openSheet('#txSheet');
    SEL_ROW = OPEN_TX.row; document.querySelectorAll('tr[data-row]').forEach(r => r.classList.toggle('sel', +r.dataset.row === SEL_ROW));
  }
  else if (ds.recat) {
    if (!OPEN_TX || ds.recat === OPEN_TX.category) return;
    try { D = await api('updateCategory', OPEN_TX.row, OPEN_TX.amount, ds.recat); render(); refreshStats(); closeSheets(); toast(`Категорію змінено: ${short(ds.recat)}`); }
    catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.id === 'del') {
    if (!OPEN_TX) return; t.disabled = true;
    try { await removeTx(OPEN_TX); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false;
  }
  else if (t.id === 'save') {
    const amount = parseFloat($('#amt').value.replace(',', '.'));
    if (!(amount > 0)) { setAmtError(true); $('#amt').focus(); return; }
    const tx = {date: $('#date').value || D.today, amount: Math.round(amount * 100) / 100, currency: ADD_CUR, category: ADD_CAT, note: $('#note').value.trim()};
    t.disabled = true; t.textContent = 'Зберігаю…';
    try { await addTx(tx, true); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false; t.textContent = 'Додати витрату';
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'amt') { e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1'); updateEqv(); }
  else if (e.target.id === 'q') { QUERY = e.target.value; renderHistory(); }
  else if (e.target.id === 'tq') { TQ = e.target.value; renderTableRows(); }
  else if (e.target.dataset && e.target.dataset.bud != null) {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1');
    BUD[e.target.dataset.bud] = e.target.value === '' ? NaN : budNum(e.target.value); budUpdate();
  }
  else if (e.target.id === 'arcQ') {
    ARC_Q = e.target.value; const pos = e.target.selectionStart; renderArchive();
    const n = $('#arcQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'note') guessFromNote(e.target.value);
  else if (e.target.id === 'arcCmp') { ARC_CMP = e.target.value; renderArchive(); }
});
['amt', 'note'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') { if (id === 'note') guessFromNote(e.target.value); $('#save').click(); } }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheets(); hideTip(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-row]')) e.target.click();
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bud != null) { e.preventDefault(); $('#budSave').click(); }
});

// Перехід між телефонним і ПК-виглядом (зміна ширини вікна)
const onDesk = () => { hideTip(); if (D) render(); if (A) renderArchive(); };
if (DESK.addEventListener) DESK.addEventListener('change', onDesk); else DESK.addListener(onDesk);

// Лінійний графік перемальовується, коли змінюється ширина
let rsT, lastW = 0;
new ResizeObserver(() => {
  const w = $('#stats').clientWidth; if (Math.abs(w - lastW) < 8) return; lastW = w;
  clearTimeout(rsT); rsT = setTimeout(() => { if (S && document.body.classList.contains('t-stats')) renderStats(); }, 120);
}).observe($('#stats'));

document.querySelectorAll('#dispSeg button').forEach(b => b.classList.toggle('on', b.dataset.c === DISP));
if (PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
