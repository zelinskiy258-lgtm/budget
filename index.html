<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141311">
<meta name="color-scheme" content="dark">
<title>Мій бюджет</title>
<!-- Для встановлюваної програми (GitHub Pages). В Apps Script ці рядки ні на що не впливають -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<script>
// Програма відкрита напряму (не всередині Apps Script чи сторінки-демо)
window.BUDGET_PWA = (function () { try { return window.top === window && !/google/.test(location.hostname); } catch (e) { return false; } })();
// Програма з GitHub Pages: налаштування входу через Google лежать поруч, у config.js
if (window.BUDGET_PWA) document.write('<script src="config.js"><\/script>');
// Іконка для iPhone малюється тут же — окремий PNG-файл не потрібен
if (window.BUDGET_PWA) (function () {
  try {
    var c = document.createElement('canvas'), x = c.getContext('2d'); c.width = c.height = 180;
    x.fillStyle = '#F0703F'; x.fillRect(0, 0, 180, 180);
    var s = 180 * .56 / 24, o = 180 * .22; x.setTransform(s, 0, 0, s, o, o);
    x.strokeStyle = '#1A0F0A'; x.lineWidth = 1.8; x.lineCap = 'round'; x.lineJoin = 'round';
    x.stroke(new Path2D('M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3'));
    x.stroke(new Path2D('M6.5 8H17.5A2.5 2.5 0 0 1 20 10.5V16.5A2.5 2.5 0 0 1 17.5 19H6.5A2.5 2.5 0 0 1 4 16.5V10.5A2.5 2.5 0 0 1 6.5 8Z'));
    x.fillStyle = '#1A0F0A'; x.beginPath(); x.arc(16, 13.5, 1.3, 0, Math.PI * 2); x.fill();
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
})();
</script>
<style>
:root{
  --paper:#141311; --card:#1D1B18; --sunk:#27241F; --raise:#2E2A25; --line:#38332C;
  --ink:#F3EDE3; --ink2:#C7BEB1; --mute:#9A9084;
  --accent:#F0703F; --on-accent:#1A0F0A; --accent-soft:rgba(240,112,63,.16);
  --ok:#5CC690; --warn:#E8B44E; --bad:#F27A6E;
  --ok-bg:rgba(92,198,144,.14); --warn-bg:rgba(232,180,78,.14); --bad-bg:rgba(242,122,110,.15);
  --sans:"Segoe UI Variable Text","SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  /* Одиниці: rem — шрифти, відступи й розміри елементів; em — внутрішні відступи кнопок; % і fr — ширина колонок;
     px — лише рамки й тіні; vw/dvh — повноекранні блоки. 1rem = базовий розмір шрифту, який сам підлаштовується під екран */
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.25rem; --fs-xl:1.75rem; --fs-hero:clamp(3rem,13vw,3.75rem);
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
  --r-card:1.5rem; --pad-card:1rem; --r-inner:.5rem; --tap:2.75rem; --side:15.25rem;
  --vh:100vh;
  --fast:150ms; --mid:250ms; --ease:cubic-bezier(.2,.8,.2,1);
}
@supports(height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;margin:0;padding:0}
/* Базовий розмір шрифту — плавно від ширини екрана (телефон) або від ширини й висоти вікна (ПК).
   Від нього рахується все в rem, тому інтерфейс пропорційний на будь-якому екрані й у вкладці будь-якого розміру */
html{font-size:clamp(15px,4.1vw,17px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(min-width:900px){html{font-size:clamp(14px,min(.42vw + 10.4px,1.15vh + 6px),20px)}}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* свайп за край сторінки не «відтягує» її — не видно білого тла зверху */
html,body{overscroll-behavior:none}
/* сторінка ніколи не їздить вліво-вправо (clip, а не hidden — щоб не ламати «прилиплі» панелі) */
html,body{overflow-x:clip}
body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(240,112,63,.08),transparent 70%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-inner)}
.num{font-variant-numeric:tabular-nums}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;color:var(--mute)}
.hint{font-size:var(--fs-xs);color:var(--mute)}

.app{width:100%;max-width:70rem;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s5)) var(--s4) calc(env(safe-area-inset-bottom) + 6rem)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3) var(--s4);margin-bottom:var(--s5)}
.top h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.top .rates{font-size:var(--fs-xs);color:var(--mute);margin-top:var(--s1)}
.actions{display:flex;gap:var(--s2);align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-inner);padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-width:var(--tap);height:2.5rem;padding:0 .85em;border-radius:.375rem;font-weight:600;font-size:var(--fs-sm);color:var(--ink2);transition:background var(--fast),color var(--fast)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:var(--tap);padding:0 1.7em;border-radius:.75rem;font-weight:600;font-size:var(--fs-sm);transition:background var(--fast),transform var(--fast)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#F5845A}
.btn-secondary{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-secondary:hover{background:var(--raise)}
.btn-quiet{color:var(--ink2)} .btn-quiet:hover{background:var(--sunk)}
.btn-danger{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-bg)} .btn-danger:hover{background:var(--bad-bg)}
.btn-sm{min-height:2.25rem;padding:0 1em;font-size:var(--fs-xs);border-radius:.625rem}
[aria-busy="true"] .spin-ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.add-desktop{display:none}

.grid{display:flex;flex-direction:column;gap:var(--s4)}
.col{display:contents}
.card{background:var(--card);border-radius:var(--r-card);padding:var(--pad-card);min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 12px 28px -18px rgba(0,0,0,.6);animation:rise var(--mid) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(.5rem)}}
.card h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
.card h2 small{font-size:var(--fs-xs);font-weight:500;color:var(--mute);text-align:right}
#hero{order:1}#cats{order:2}#cal{order:3}#hist{order:4}

/* головне число */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.badge{display:inline-flex;align-items:center;gap:var(--s1);height:1.75rem;padding:0 .9em;border-radius:999px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.big{font-family:var(--serif);font-size:var(--fs-hero);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:var(--s2) 0 var(--s1)}
.big.pulse{animation:pulse 300ms var(--ease)}
@keyframes pulse{50%{transform:scale(1.03)}}
.sub{color:var(--ink2);font-size:var(--fs-sm)} .sub b{color:var(--ink);font-weight:600}
.stack{display:flex;gap:2px;height:.625rem;border-radius:999px;overflow:hidden;background:var(--sunk);margin:var(--s4) 0 var(--s2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:var(--fs-xs);color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:2px;background:var(--c);margin-right:var(--s1)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s4)}
.tile{background:var(--sunk);border-radius:var(--r-inner);padding:var(--s3);min-width:0}
.tile b{display:block;font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;line-height:1.2;margin:var(--s1) 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.over{background:var(--bad-bg)} .tile.over b,.tile.over small{color:var(--bad)}
.delta{font-weight:700} .delta.up{color:var(--bad)} .delta.down{color:var(--ok)}

/* категорії */
.cat{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;width:100%;min-height:3.5rem;text-align:left;padding:var(--s2);border-radius:.75rem;transition:background var(--fast)}
.cat+.cat{margin-top:2px}
.cat:hover{background:var(--sunk)}
.ic{display:grid;place-items:center;flex:none}
.cat .ic,.tx .ic{width:2.5rem;height:2.5rem;border-radius:.75rem;font-size:1.125rem;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.cat .ic{grid-row:span 3}
.cat .nm{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .lf{font-family:var(--serif);font-weight:600;font-size:var(--fs-md);text-align:right;white-space:nowrap}
.cat .bar{grid-column:2 / 4;height:.375rem;border-radius:999px;background:var(--sunk);overflow:hidden;margin:var(--s1) 0}
.cat .bar i{display:block;height:100%;border-radius:999px}
.cat .meta{grid-column:2 / 4;display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--fs-xs);color:var(--mute)}
.st{font-weight:600;white-space:nowrap} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.ok{color:var(--ok)}

/* календар */
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.95fr);gap:var(--s1)}
/* Σ — підсумок тижня в кінці рядка */
.wk{position:relative;border-radius:var(--r-inner);padding:var(--s1) .375rem;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--fs-xs);min-width:0;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.wk .d{font-weight:700;color:var(--mute)}
.wk .v{font-size:.6875rem;font-weight:700;text-align:right;white-space:nowrap}
.wk.ok{background:var(--ok-bg);box-shadow:none} .wk.ok .v{color:var(--ok)}
.wk.warn{background:var(--warn-bg);box-shadow:none} .wk.warn .v{color:var(--warn)}
.wk.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)} .wk.bad .v{color:var(--bad)}
.wk.future{opacity:.45}
/* дні сусіднього місяця — сіріші, без кліку */
.day.out{background:transparent;box-shadow:inset 0 0 0 1px var(--line);opacity:.4;cursor:default}
.day.out .v{color:var(--mute)}
/* запис з архіву в результатах пошуку — лише перегляд */
.tx.old{cursor:default} .tx.old:hover{background:none}
.tx .s .arc{color:var(--mute);font-weight:600}
.wk-toggle{display:grid;grid-template-columns:1.5rem minmax(0,1fr) 2.5rem;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s3);margin:0 0 var(--s3);border-radius:.75rem;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--fs-xs);color:var(--mute)}
.wk-toggle > .i{font-size:1.25rem;color:var(--ink2)}
.wk-toggle b{display:block;font-size:var(--fs-sm);color:var(--ink)}
.wk-toggle .sw{position:relative;width:2.5rem;height:1.5rem;border-radius:999px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--fast)}
.wk-toggle .sw::after{content:"";position:absolute;top:.1875rem;left:.1875rem;width:1.125rem;height:1.125rem;border-radius:50%;background:var(--ink2);transition:transform var(--fast)}
.wk-toggle[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.wk-toggle[aria-pressed="true"] > .i{color:var(--accent)}
.wk-toggle[aria-pressed="true"] .sw{background:var(--accent)}
.wk-toggle[aria-pressed="true"] .sw::after{transform:translateX(1rem);background:var(--on-accent)}
@media(max-width:899px){.day,.wk{padding:.1875rem .25rem}.day .v,.wk .v{font-size:.625rem}}
[hidden]{display:none !important}
/* доходи, перенесений залишок, скарбничка */
.inc-line{font-size:var(--fs-sm);color:var(--mute);margin-top:var(--s1);display:flex;flex-wrap:wrap;gap:2px .625rem;align-items:center}
.inc-line .ok{color:var(--ok);font-weight:700}
.inc-line .i{width:.875rem;height:.875rem;vertical-align:-2px}
.xtra{color:var(--ok);font-weight:600;white-space:nowrap}
.btn-link{display:inline-flex;align-items:center;gap:.25em;color:var(--ink2);font-size:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.btn-link:hover{color:var(--ink)}
.tx.inc .a{color:var(--ok)}
.tx.inc .ic{color:var(--ok);background:var(--ok-bg)}
.seg.kind{display:flex;width:100%;margin:0 0 var(--s3)}
.seg.kind button{flex:1}
/* налаштування */
.pl-sec{padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--line)}
.pl-sec:last-of-type{border-bottom:0}
.pl-sec h4{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2);font-size:var(--fs-md)}
.pl-sec .hint{margin:0 0 var(--s3)}
.pl-sec .seg{display:flex;width:100%;margin-bottom:var(--s2)}
.pl-sec .seg button{flex:1;padding:0 .45em}
.pig{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s2) 0}
.pig b{font-family:var(--serif);font-size:var(--fs-xl)}
.r-row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto 2.25rem;gap:var(--s3);align-items:center;padding:.375rem 0;border-top:1px solid var(--line)}
.r-row .ic{width:2rem;height:2rem;border-radius:.625rem;display:grid;place-items:center;background:var(--sunk);color:var(--c)}
.r-row small{display:block;font-size:var(--fs-xs);color:var(--mute)}
.r-add{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1.2fr) 4rem;gap:var(--s2);margin-top:var(--s3)}
.r-add .box{margin:0}
.r-add .btn{grid-column:1 / -1;margin-top:0 !important}
@media(max-width:520px){.r-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.hbar .nm small{display:block;font-size:.6875rem;font-weight:600;color:var(--mute);line-height:1.2}
.hbar .nm small.up{color:var(--bad)} .hbar .nm small.down{color:var(--ok)}
.dow span{font-size:var(--fs-xs);font-weight:600;color:var(--mute);text-align:center;padding-bottom:var(--s1)}
.day{position:relative;aspect-ratio:1/1.05;border-radius:var(--r-inner);padding:var(--s1) .375rem;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--fs-xs);background:var(--sunk);min-width:0;overflow:hidden}
.day .d{font-weight:600;color:var(--ink2)}
.day .v{font-size:.6875rem;font-weight:600;text-align:right;white-space:nowrap}
.day.zero,.day.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.day.future{opacity:.45}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.over{background:var(--bad-bg)} .day.over .v{color:var(--bad)}
.day.over::after{content:"!";position:absolute;top:.1875rem;right:.3125rem;font-weight:800;font-size:.6875rem;color:var(--bad)}
.cal-key{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--fs-xs);color:var(--mute);margin-top:var(--s3)}
.cal-key i{display:inline-block;width:.625rem;height:.625rem;border-radius:3px;margin-right:var(--s1);vertical-align:-1px}

/* історія */
.search{margin-bottom:var(--s2)}
.filter{display:inline-flex;gap:var(--s1);align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 0 0 var(--s3);font-size:var(--fs-xs);font-weight:600;margin:0 var(--s1) var(--s2) 0}
.filter button{width:2.25rem;height:2.25rem;border-radius:50%;color:var(--paper);font-size:var(--fs-sm)}
.group{font-size:var(--fs-xs);font-weight:600;color:var(--mute);display:flex;justify-content:space-between;padding:var(--s4) var(--s2) var(--s1)}
.group:first-child{padding-top:var(--s1)}
.tx{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:3.5rem;text-align:left;padding:var(--s2);border-radius:.75rem;transition:background var(--fast)}
.tx:hover{background:var(--sunk)}
.tx.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{from{background:var(--ok-bg)}}
.tx .t{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;font-family:var(--serif);font-weight:600;font-size:var(--fs-md);white-space:nowrap}
.tx .a small{display:block;font-family:var(--sans);font-weight:400;font-size:var(--fs-xs);color:var(--mute)}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--ink2);font-size:var(--fs-sm)}
.empty .e-ic{display:grid;place-items:center;width:3.5rem;height:3.5rem;margin:0 auto var(--s3);border-radius:1rem;background:var(--sunk);color:var(--ink2);font-size:1.5rem}
.empty b{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:var(--s1)}
.empty .btn{margin-top:var(--s4)}

/* редактор бюджету */
.sync{display:inline-flex;align-items:center;gap:.375rem;font-size:var(--fs-xs);color:var(--mute);margin-top:2px}
.sync::before{content:"";width:.4375rem;height:.4375rem;border-radius:50%;background:var(--ok)}
.sync.wait::before{background:var(--warn);animation:blink 1s ease-in-out infinite}
.sync.err::before{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.bud-total{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);background:var(--sunk);border-radius:1rem;padding:var(--s3) var(--s4);margin:var(--s2) 0 var(--s3)}
.bud-total b{display:block;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600;line-height:1.1}
.bud-total .r{text-align:right;font-size:var(--fs-xs);color:var(--mute)}
.bud-list{display:flex;flex-direction:column}
.bud{display:grid;grid-template-columns:2.25rem minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;padding:var(--s2) 0}
.bud+.bud{border-top:1px solid var(--line)}
.bud .ic{width:2.25rem;height:2.25rem;border-radius:.625rem;font-size:1.0625rem;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.bud .nm{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .nm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud.chg .nm small{color:var(--accent)}
.step{display:flex;align-items:center;background:var(--sunk);border-radius:.75rem;box-shadow:inset 0 0 0 1px var(--line)}
.bud.chg .step{box-shadow:inset 0 0 0 1px var(--accent)}
.bud.bad .step{box-shadow:inset 0 0 0 1px var(--bad)}
.step button{width:2.5rem;height:2.75rem;display:grid;place-items:center;color:var(--ink2);font-size:var(--fs-md);border-radius:.75rem}
.step button:hover{color:var(--ink);background:var(--raise)}
.step label{display:flex;align-items:center;color:var(--mute);font-size:var(--fs-sm)}
.step input{width:4rem;height:2.75rem;border:0;background:none;text-align:right;font-family:var(--serif);font-weight:600;font-size:var(--fs-md);font-variant-numeric:tabular-nums;outline:none;padding:0 2px}
.bud .lock{font-size:var(--fs-xs);color:var(--mute);text-align:right;white-space:nowrap}
.bud .lock b{display:block;font-family:var(--serif);font-size:var(--fs-md);color:var(--ink)}
.bud .fx{display:inline-flex;align-items:center;gap:.25em;margin-top:var(--s1);min-height:1.75rem;padding:0 .9em;border-radius:999px;font-size:.6875rem;font-weight:600;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.bud .fx:hover{color:var(--ink)}
.bud .fx[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.bud-tools{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0 0 var(--s2)}
#budgetSheet .note{font-size:var(--fs-xs);color:var(--mute);margin:var(--s2) 0 var(--s3)}
#catSheet .note{font-size:var(--fs-xs);color:var(--mute);margin:var(--s2) 0 var(--s3)}
#catSheet .bud{grid-template-columns:2.25rem minmax(0,1fr) auto auto}
#catSheet .btn-primary,#catSheet .btn-quiet:not(.btn-sm),#catSheet .btn-secondary{width:100%}
.cname{width:100%;height:2.25rem;border:0;border-radius:.5rem;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);padding:0 .7em;font:inherit;font-weight:600;font-size:var(--fs-sm);color:var(--ink);outline:none}
.cname:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.bud.chg .cname{box-shadow:inset 0 0 0 1px var(--accent)}
.ib{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.625rem;color:var(--mute)}
.ib:hover{background:var(--bad-bg);color:var(--bad)}
.cat-del{opacity:.75}
.cat-del .nm s{color:var(--mute)}
.cat-del .selx{margin-top:.375rem;max-width:100%}

/* перемикач таблиць і акаунта */
.sh-pill{display:inline-flex;align-items:center;gap:.375rem;max-width:100%;min-height:2rem;margin:.375rem 0 2px;padding:0 1em 0 .85em;border-radius:999px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--fs-xs);font-weight:600;color:var(--ink2)}
.sh-pill:hover{color:var(--ink);background:var(--raise)}
.sh-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-pill .chev{transform:rotate(90deg);font-size:var(--fs-xs);color:var(--mute)}
.acct{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:1rem;background:var(--sunk);margin:var(--s2) 0 var(--s4)}
.acct .av{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.acct .who{flex:1;min-width:0;font-size:var(--fs-sm)}
.acct .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who small{color:var(--mute);font-size:var(--fs-xs)}
.sh-list{display:flex;flex-direction:column;gap:var(--s2);margin-bottom:var(--s4)}
.sh-row{display:grid;grid-template-columns:2.25rem minmax(0,1fr) auto auto;gap:var(--s3);align-items:center;padding:var(--s2) var(--s3);border-radius:.875rem;box-shadow:inset 0 0 0 1px var(--line)}
.sh-row.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.sh-row .ic{width:2.25rem;height:2.25rem;border-radius:.625rem;background:var(--raise);color:var(--ink2);font-size:1.0625rem;display:grid;place-items:center}
.sh-row.on .ic{background:var(--accent-soft);color:var(--accent)}
.sh-row .nm{font-weight:600;font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.sh-row .nm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--mute)}
.sh-row button.nm{min-height:2.5rem}
.sh-row a.ib{text-decoration:none}
#sheetsSheet .btn:not(.btn-sm),.conn .sh-list+.btn{width:100%}
.sh-new{display:flex;gap:var(--s2);margin-bottom:var(--s2)}
.sh-new .box{flex:1;margin:0}

/* встановлювана програма: підключення */
/* поки таблиці немає — ховаємо меню й кнопки, які без неї нічого не можуть */
body.nosheet .side .nav,body.nosheet .side .add,body.nosheet .side-foot,body.nosheet #dispSeg,body.nosheet .tabbar,body.nosheet #stats,body.nosheet #archive,body.nosheet #table{display:none !important}
.pwa-only{display:none} body.pwa .pwa-only{display:inline-flex}
.conn{max-width:32.5rem;margin:0 auto}
.conn h2{justify-content:flex-start;gap:var(--s2)}
.conn .btn,#connSheet .btn{width:100%;margin-top:var(--s2)}
.conn .note,#connSheet .note{font-size:var(--fs-sm);color:var(--ink2);margin-bottom:var(--s4)}
.conn ol{margin:0 0 var(--s4) 1.125rem;font-size:var(--fs-sm);color:var(--ink2)}
.conn ol li+li{margin-top:var(--s1)}
.tx .s .pend,.tt .pend{color:var(--warn);font-weight:600}
/* перший вхід і вибір таблиці: без шапки й бічного меню — одна картка по центру екрана */
body.nosheet .top,body.nosheet .side{display:none !important}
body.nosheet .app{margin-left:auto;margin-right:auto;max-width:100%}
body.nosheet #root{display:grid;place-items:center;min-height:calc(var(--vh) - 7.5rem)}
.onb{width:min(100%,27.5rem);padding:var(--s6) var(--s5);text-align:center}
.onb-logo{display:grid;place-items:center;width:4rem;height:4rem;margin:0 auto var(--s4);border-radius:1.25rem;background:var(--accent);color:var(--on-accent);font-size:2rem;box-shadow:0 12px 28px -12px rgba(240,112,63,.6)}
.onb h2{justify-content:center;font-size:var(--fs-xl);margin-bottom:var(--s2)}
.onb-sub{font-size:var(--fs-md);color:var(--ink2);margin:0 auto var(--s5);max-width:34ch}
.onb-pts{list-style:none;display:flex;flex-direction:column;gap:var(--s3);margin:0 0 var(--s5);text-align:left}
.onb-pts li{display:grid;grid-template-columns:2.5rem minmax(0,1fr);gap:var(--s3);align-items:center;font-size:var(--fs-sm);color:var(--mute)}
.onb-pts .ic{width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--sunk);color:var(--ink2);font-size:1.125rem}
.onb-pts b{display:block;color:var(--ink);font-weight:600}
.onb .btn{width:100%}
.onb .btn-primary{min-height:3.25rem;font-size:var(--fs-md)}
.onb .errmsg{justify-content:center;text-align:left}
.onb-or{display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0 var(--s4);font-size:var(--fs-xs);font-weight:600;color:var(--mute)}
.onb-or::before,.onb-or::after{content:"";flex:1;height:1px;background:var(--line)}
.onb .f,.onb #hubPrev{text-align:left}
.onb .f{margin-bottom:var(--s2)}
.onb .acct{margin:var(--s5) 0 0}
.onb-foot{margin-top:var(--s4);font-size:var(--fs-xs);color:var(--mute)}
.onb-foot a{color:var(--ink2);text-underline-offset:3px}
/* акаунт: довга адреса не стискає кнопку в колонку — кнопка переходить на новий рядок */
.acct{flex-wrap:wrap}
.acct .who{min-width:10rem}
.acct .who b{font-size:var(--fs-sm)}

/* статистика */
#stats{display:none;flex-direction:column;gap:var(--s4)}
.st-bar{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) 0;margin-top:calc(-1 * var(--s2));background:linear-gradient(var(--paper) 80%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.kpi{background:var(--card);border-radius:1rem;padding:var(--s3) var(--s4);min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.kpi b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:600;line-height:1.2;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:var(--fs-xs);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-grid{display:flex;flex-direction:column;gap:var(--s4)}
/* телефон: 5 періодів уміщаються в один ряд без прокрутки вбік */
@media(max-width:899px){
  .st-bar .seg{display:flex;width:100%}
  .st-bar .seg button{flex:1 1 auto;min-width:0;padding:0 .4em}
  .vbars{gap:var(--s1)}
}
/* вузький телефон: перемикачі в налаштуваннях і періоди — дрібнішим шрифтом, щоб не вилазили */
@media(max-width:400px){
  .pl-sec .seg button,.st-bar .seg button{font-size:var(--fs-xs);padding:0 .3em}
}
.chart-wrap{position:relative;width:100%;height:clamp(11.25rem,26vh,15rem);overflow:hidden}
.chart-wrap svg{display:block;width:100%;height:100%}
.ax{font-size:.6875rem;fill:var(--mute);font-family:var(--sans)}
.gridl{stroke:var(--line);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.ckey{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--fs-xs);color:var(--ink2);margin-top:var(--s2)}
.ckey i{display:inline-block;width:.875rem;height:3px;border-radius:2px;margin-right:.375rem;vertical-align:3px}
.ckey i.dash{background:repeating-linear-gradient(90deg,var(--mute) 0 4px,transparent 4px 7px)}
.hbar{display:grid;grid-template-columns:1.75rem minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s2) var(--s1);border-radius:.625rem;transition:background var(--fast)}
.hbar:hover{background:var(--sunk)}
.hbar .ic{color:var(--c);font-size:1.0625rem}
.hbar .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .v{font-size:var(--fs-sm);font-weight:600;text-align:right;white-space:nowrap}
.hbar .v small{font-weight:500;color:var(--mute);margin-left:.375rem}
.hbar .track{grid-column:2 / 4;height:.5rem;border-radius:999px;background:var(--sunk);overflow:hidden;position:relative}
.hbar .track i{display:block;height:100%;border-radius:999px;background:var(--c)}
.hbar .track .pl{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);border-radius:1px}
.hbar.sel{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.vbars{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--s2);align-items:end;height:clamp(8.75rem,20vh,11.25rem)}
.vb{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:var(--s1);min-width:0;border-radius:.5rem;cursor:default}
.vb:hover{background:rgba(255,255,255,.03)}
.vb .plot{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vb .plot i{display:block;width:70%;max-width:2.125rem;border-radius:4px 4px 0 0;background:var(--c,var(--ok));min-height:2px}
.vb .plot i.over{background:var(--bad)}
.vb .plot i.now{background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 55%,var(--card)) 5px 10px)}
.vb .plot .lim{position:absolute;left:8%;right:8%;border-top:2px dashed var(--mute)}
.vb b{font-size:.6875rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.vb span{font-size:.6875rem;color:var(--mute);white-space:nowrap}
.vb.peak .plot i{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ink2)}
.rank{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;padding:var(--s2) var(--s1)}
.rank+.rank{border-top:1px solid var(--line)}
.rank .n{font-size:var(--fs-xs);font-weight:700;color:var(--mute);text-align:center}
.rank .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--mute)}
.rank .v{font-family:var(--serif);font-weight:600;text-align:right;white-space:nowrap}
.insights{display:flex;flex-direction:column;gap:var(--s2)}
.ins{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:var(--s3);align-items:start;font-size:var(--fs-sm);color:var(--ink2)}
.ins .ic{width:2rem;height:2rem;border-radius:.625rem;background:var(--sunk);color:var(--ink)}
.ins b{color:var(--ink)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s2);border-radius:.75rem}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .nm{font-weight:600;font-size:var(--fs-sm)}
.mrow .nm small{font-weight:500;color:var(--accent);margin-left:.375rem;font-size:.6875rem}
.mrow .v{font-family:var(--serif);font-weight:600;text-align:right;white-space:nowrap}
.mrow .s{font-size:var(--fs-xs);color:var(--mute)}
.mrow .d{font-size:var(--fs-xs);font-weight:600;text-align:right;white-space:nowrap}
.mrow .d.ok{color:var(--ok)} .mrow .d.bad{color:var(--bad)}
.pending{display:flex;align-items:center;gap:var(--s3);background:var(--accent-soft);border-radius:1rem;padding:var(--s3);margin-bottom:var(--s3)}
.pending div{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--ink2)}
.pending b{display:block;color:var(--ink);font-size:var(--fs-sm)}
.sk{background:linear-gradient(90deg,var(--sunk) 0%,var(--raise) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:var(--r-inner)}
@keyframes sk{to{background-position:-200% 0}}
.sk-card{background:var(--card);border-radius:var(--r-card);padding:var(--pad-card);display:flex;flex-direction:column;gap:var(--s3)}

/* підказка при наведенні */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:.625rem;padding:.4em .7em;font-size:var(--fs-xs);font-weight:500;line-height:1.4;max-width:13.75rem;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity 120ms,transform 120ms}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:700}

/* нижня панель — низько, біля краю екрана, як у Telegram / Instagram */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(var(--s2),calc(env(safe-area-inset-bottom) - var(--s2)));display:flex;align-items:center;gap:2px;width:max-content;max-width:calc(100vw - var(--s4));background:rgba(39,36,31,.92);backdrop-filter:blur(14px);border-radius:999px;padding:.375rem;z-index:20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 12px 28px -10px rgba(0,0,0,.7)}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mute);height:3.125rem;min-width:3.5rem;padding:0 .55em;border-radius:999px;font-weight:600;font-size:.6875rem;transition:background var(--fast),color var(--fast)}
.tabbar .tab .i{font-size:1.1875rem}
.tabbar .tab.on{background:rgba(243,237,227,.1);color:var(--ink)}
.fab{display:grid;place-items:center;width:3.625rem;height:3.625rem;margin:-.875rem .25rem 0;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--paper),0 10px 22px -8px rgba(240,112,63,.7);transition:transform var(--fast)}
.fab:active{transform:scale(.92)}
.fab .i{font-size:1.75rem;stroke-width:2.4}

/* архів */
#archive{display:none;flex-direction:column;gap:var(--s4)}
.arc-head{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto;gap:var(--s3);align-items:center}
.arc-head .ic{width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--sunk);font-size:1.125rem}
.arc-head b{display:block;font-size:var(--fs-sm)}
.arc-head small{display:block;font-size:var(--fs-xs);color:var(--mute)}
.arc-warn{display:flex;gap:var(--s2);font-size:var(--fs-xs);color:var(--ink2);background:var(--warn-bg);border-radius:.75rem;padding:var(--s3);margin-top:var(--s3)}
.arc-warn .i{color:var(--warn);margin-top:1px}
.arc-m{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.arc-m > button{display:grid;grid-template-columns:minmax(0,1fr) auto 1.25rem;gap:2px var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s4)}
.arc-m > button:hover{background:var(--sunk)}
:is(.arc-m,.arc-li) .nm{font-weight:700;font-size:var(--fs-md)}
:is(.arc-m,.arc-li) .v{font-family:var(--serif);font-weight:600;font-size:var(--fs-lg);text-align:right;white-space:nowrap}
:is(.arc-m,.arc-li) .s{font-size:var(--fs-xs);color:var(--mute)}
:is(.arc-m,.arc-li) .d{font-size:var(--fs-xs);font-weight:600;text-align:right;white-space:nowrap}
:is(.arc-m,.arc-li) .d.ok{color:var(--ok)} :is(.arc-m,.arc-li) .d.bad{color:var(--bad)}
.arc-m .chev{grid-row:span 2;color:var(--mute);transition:transform var(--mid)}
.arc-m.open .chev{transform:rotate(90deg)}
:is(.arc-m,.arc-li) .mini{grid-column:1 / 3;display:flex;gap:2px;height:.375rem;border-radius:999px;overflow:hidden;background:var(--sunk);margin-top:var(--s2)}
:is(.arc-m,.arc-li) .mini i{display:block;height:100%}
.arc-body{display:none;padding:0 var(--s4) var(--s4)}
.arc-m.open .arc-body{display:block}

body.t-over #hist,body.t-over #stats,body.t-over #archive{display:none}
body.t-hist #hero,body.t-hist #cats,body.t-hist #cal,body.t-hist #stats,body.t-hist #archive{display:none}
body.t-stats .grid,body.t-arch .grid{display:none}
body.t-stats #stats{display:flex}
body.t-arch #archive{display:flex}
.side,#table{display:none}
@media(max-width:899px){.desk-only{display:none !important}}

/* ---------- ПК ---------- */
/* бічне меню */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);flex-direction:column;gap:2px;padding:var(--s5) var(--s4);background:#181613;box-shadow:inset -1px 0 0 var(--line);z-index:20;overflow:auto}
.brand{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s2) var(--s5)}
.brand .logo{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--accent);color:var(--on-accent);font-size:1.25rem;flex:none}
.brand b{display:block;font-size:var(--fs-md);line-height:1.2}
.brand small{display:block;font-size:var(--fs-xs);color:var(--mute)}
.side .add{width:100%;margin-bottom:var(--s4)}
.nav{position:relative;display:flex;align-items:center;gap:var(--s3);width:100%;min-height:2.75rem;padding:0 .85em;border-radius:.75rem;color:var(--ink2);font-weight:600;font-size:var(--fs-sm);text-align:left;transition:background var(--fast),color var(--fast)}
.nav .i{font-size:1.1875rem}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--raise);color:var(--ink)}
.nav.on::before{content:"";position:absolute;left:calc(-1 * var(--s4));top:.625rem;bottom:.625rem;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .k{margin-left:auto;font-size:var(--fs-xs);font-weight:500;color:var(--mute)}

.tbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s3)}

.tt th.r button{justify-content:flex-end}

.tt .acts button{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.5rem;color:var(--ink2)}
.tt .acts button:hover{background:var(--raise);color:var(--ink)}
.tt .acts .del:hover{background:var(--bad-bg);color:var(--bad)}

/* карта року */

.arc-md{display:grid;grid-template-columns:minmax(13.75rem,30%) minmax(0,1fr);gap:var(--s5);align-items:start}

.arc-li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s3) var(--s4);border-radius:1rem;background:var(--card);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);transition:background var(--fast)}
.arc-li:hover{background:var(--sunk)}
.arc-li.on{background:var(--raise);box-shadow:inset 0 0 0 1px var(--line),inset 3px 0 0 var(--accent)}
.arc-detail{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.ad-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s4)}
.ad-top h2{margin:2px 0 0}
.ad-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin-bottom:var(--s5)}
.cmp{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-xs);font-weight:600;color:var(--mute)}
.selx{height:2.25rem;padding:0 var(--s3);border:0;border-radius:.625rem;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:inherit;font-size:var(--fs-xs);font-weight:600;color-scheme:dark;cursor:pointer}
.cmp-row{display:grid;grid-template-columns:1.75rem minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:var(--s3);align-items:center;padding:var(--s2) var(--s1);border-radius:.625rem}
.cmp-row:hover{background:var(--sunk)}
.cmp-row .ic{font-size:1.0625rem}
.cmp-row .nm{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-bars{display:flex;flex-direction:column;gap:3px}

.cmp-row .v small{display:block;font-weight:500;font-size:var(--fs-xs);color:var(--mute)}
.cmp-row .d{text-align:right;font-size:var(--fs-xs);font-weight:700;white-space:nowrap;color:var(--mute)}
.cmp-row .d.bad{color:var(--bad)} .cmp-row .d.ok{color:var(--ok)}
.cmp-row.total{box-shadow:inset 0 1px 0 var(--line);border-radius:0;margin-top:var(--s2);padding-top:var(--s3)}

@media(min-width:900px){

  body[class] #hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"a t" "b t";gap:var(--s3) var(--s6);align-items:center}

  .chart-wrap{height:clamp(15rem,34vh,21.25rem)}

  .day .v{font-size:var(--fs-xs)}
  .mob-only{display:none !important}
}
@media(min-width:1100px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"hero hero hero" "cats cal hist"}
  body[class] #hero{grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"a b t"}
}
/* ПК: огляд уміщається в один екран — категорії, календар та історія в один ряд, прокрутка всередині карток */
@media(min-width:900px){
  /* компактніше: менше відступів і менші цифри */
  body.t-over .card{padding:var(--s4)}
  body.t-over .card h2{margin-bottom:var(--s2)}
  body.t-over .grid{gap:var(--s3)}
  body.t-over #hero .tile{padding:var(--s2) var(--s3)}

  body.t-over .big{font-size:2.5rem;line-height:1.05}
  body.t-over .top{margin-bottom:var(--s3)}

  body.t-over #hist .search{display:none}
  body.t-over .cat{min-height:2.75rem;padding:var(--s1) var(--s2)}
  body.t-over .tx{min-height:2.875rem;padding-top:var(--s1);padding-bottom:var(--s1)}

}
.more-hist{width:100%;margin-top:var(--s3)}
/* сповіщення про нову версію */
.upd{position:fixed;left:50%;top:.75rem;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:var(--s3);width:min(35rem,calc(100vw - 1.5rem));padding:var(--s3) var(--s3) var(--s3) var(--s4);border-radius:1rem;background:var(--raise);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 0 0 1px var(--accent);font-size:var(--fs-xs);color:var(--ink2)}
.upd > .i{color:var(--accent);font-size:1.25rem;flex:none}
.upd span{flex:1;min-width:0}
.upd b{display:block;color:var(--ink);font-size:var(--fs-sm)}
@media(min-width:900px){.upd{left:calc(50% + var(--side) / 2)}}
/* ПК: шапка в один тонкий рядок */
@media(min-width:900px){
  .top{align-items:center}
  .top > div:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);min-width:0}
  .top #eyebrow{display:none}
  .top .rates,.top .sync,.top .sh-pill{margin:0}

}
@media(min-width:900px) and (max-width:1279px){:root{--side:13.25rem}}
/* ПК: огляд рівно на висоту вікна — без прокрутки сторінки.
   Категорії, календар та історія в один ряд, однакової висоти; прокрутка лише всередині карток */
@media(min-width:1000px){
  body.t-over .app{height:var(--vh);min-height:32.5rem;display:flex;flex-direction:column;padding:var(--s4) var(--s5)}
  body.t-over .top{flex:none;margin-bottom:var(--s3)}
  body.t-over #root{flex:1;min-height:0}
  body.t-over .grid{height:100%;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"hero hero hero" "cats cal hist";grid-template-rows:auto minmax(0,1fr);align-items:stretch;gap:var(--s3)}
  /* верхня картка — один блок: зліва залишок і під ним 2×2 (Бюджет · Витрачено / Минуло · Скарбничка),
     праворуч 4 показники в одну лінію, під ними — «Куди пішли гроші» на всю їхню ширину.
     Усі підписи в картці однакові: 12 px великими літерами */
  body[class].t-over #hero{grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));
    grid-template-areas:"top t1 t2 t3 t4" "big t1 t2 t3 t4" "meta b b b b";
    grid-template-rows:auto auto auto;gap:0 var(--s5);align-items:stretch;padding:var(--s3) var(--s4)}
  body.t-over #hero .hero-a,body.t-over #hero .tiles{display:contents}
  body.t-over #hero .hero-top{grid-area:top;justify-content:flex-start;gap:var(--s3)}
  body.t-over #hero .big{grid-area:big;font-size:2.125rem;line-height:1.1;margin:2px 0 0}
  body.t-over #hero .hero-meter{display:none}
  body.t-over #hero .hero-meta{grid-area:meta;align-self:end;margin-top:var(--s3)}
  /* під залишком — 2×2: Бюджет · Витрачено / Минуло · Скарбничка; «Куди пішли гроші» — на всю ширину під показниками */
  body.t-over #hero .hero-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2) 0}
  body.t-over #hero .hero-meta > :nth-child(odd){padding-left:0;box-shadow:none}
  body.t-over #hero .hero-b{grid-area:b;align-self:end;min-width:0;margin-top:var(--s3)}
  body.t-over #hero .hero-b .stack{margin-top:var(--s1)}
  body.t-over #hero .tile{display:flex;flex-direction:column;justify-content:space-between;background:none;padding:0;min-width:0}
  body.t-over #hero .tile:nth-child(1){grid-area:t1} body.t-over #hero .tile:nth-child(2){grid-area:t2}
  body.t-over #hero .tile:nth-child(3){grid-area:t3} body.t-over #hero .tile:nth-child(4){grid-area:t4}
  body.t-over #hero .tile .label,body.t-over #hero .hero-b .label{font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase}
  body.t-over #hero .tile b{font-size:var(--fs-lg);line-height:1.2;margin:2px 0}
  body.t-over .big{font-size:2.375rem;margin:2px 0}
  body.t-over .hero-b .stack{margin:var(--s1) 0 .375rem;height:.625rem}
  body.t-over #cats,body.t-over #cal,body.t-over #hist{display:flex !important;flex-direction:column;min-height:0;height:100%;overflow:hidden;padding:var(--s3) var(--s4)}
  body.t-over #cats h2,body.t-over #cal h2,body.t-over #hist h2{flex:none;font-size:var(--fs-md)}
  body.t-over .cat-list,body.t-over #hist .list{flex:1;min-height:0;overflow:auto;max-height:none;margin-right:calc(-1 * var(--s2));padding-right:var(--s2)}
  body.t-over #cal .cal-body{flex:1;min-height:0;display:flex;flex-direction:column}
  body.t-over #cal .days{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  body.t-over #cal .day{aspect-ratio:auto;min-height:0}
  body.t-over .cat .ic,body.t-over .tx .ic{width:2rem;height:2rem;font-size:.9375rem;border-radius:.625rem}
  body.t-over .cat,body.t-over .tx{grid-template-columns:2rem minmax(0,1fr) auto}
  /* категорії щільно, щоб уміщались усі; якщо й так не влазять — ховаємо рядок «€x з €y» */
  body.t-over .cat-list{display:flex;flex-direction:column;gap:2px}
  body.t-over .cat-list .cat{min-height:0;margin:0;padding:var(--s1) var(--s2);gap:0 var(--s3)}
  body.t-over .cat .nm,body.t-over .cat .lf{font-size:var(--fs-sm);line-height:1.25}
  body.t-over .cat .bar{height:.3125rem;margin:.1875rem 0}
  body.t-over .cat .meta{font-size:var(--fs-xs);line-height:1.25}
  body.t-over #cats.tight .cat .meta{display:none}
  body.t-over #cats.tight .cat .ic{grid-row:span 2;width:1.75rem;height:1.75rem}
  body.t-over #cats.tight .cat{grid-template-columns:1.75rem minmax(0,1fr) auto}
  /* історія: стільки останніх витрат, скільки влазить (решта — «Уся історія») */
  body.t-over #hist .list{overflow:hidden}
  body.t-over .tx{min-height:0;padding:var(--s1) var(--s2)}
  body.t-over .group,body.t-over .group:first-child{padding:.375rem var(--s2) 2px}
  body.t-over #hist .more-hist{margin-top:var(--s2);min-height:2.25rem}
  /* якщо в картці лишається місце: категорії рівномірно до низу, «Уся історія» — притиснута до низу,
     щоб низ трьох карток був на одній лінії */
  body.t-over .cat-list{justify-content:space-between}
  body.t-over #hist .list{display:flex;flex-direction:column}
  body.t-over #hist .list > *{flex-shrink:0}
  body.t-over #hist .more-hist{margin-top:auto}
  /* «Уся історія» вже є кнопкою внизу картки — у заголовку не дублюємо */
  body.t-over #hist h2 .btn{display:none}
}
.top-tabs{display:none}
[hidden]{display:none !important}
a.nav{text-decoration:none}
/* ПК: бічне меню вміщається без прокрутки */
@media(min-width:900px){
  .side{padding:var(--s4) var(--s3);overflow:hidden}

/* картка «Залишилось» */
.hero-meter{position:relative;height:.5rem;border-radius:999px;background:var(--sunk);margin:var(--s2) 0 var(--s3)}
.hero-meter i{display:block;height:100%;border-radius:999px;transition:width var(--mid) var(--ease)}

   підписи 12 px великими літерами. Порядок: залишок і 2×2 під ним → 4 показники 2×2 → «Куди пішли гроші» */

/* календар: у клітинці лише число й колір, суми — у підказці */
.day,.wk{justify-content:center;align-items:center;cursor:default;transition:box-shadow var(--fast)}

.side .sheet-link{margin-top:var(--s2);box-shadow:inset 0 1px 0 var(--line);border-radius:0 0 .75rem .75rem;padding-top:var(--s2)}

.scrim{position:fixed;inset:0;background:rgba(5,4,3,.6);opacity:0;pointer-events:none;transition:opacity var(--mid);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:30rem;margin:0 auto;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;padding:var(--s3) var(--s5) calc(env(safe-area-inset-bottom) + var(--s5));z-index:50;transform:translateY(105%);transition:transform var(--mid) var(--ease);max-height:calc(var(--vh) * .92);overflow:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

@media(min-width:900px){.sheet{bottom:50%;border-radius:var(--r-card);transform:translateY(55%) scale(.97);opacity:0;pointer-events:none;transition:transform var(--mid) var(--ease),opacity var(--mid)}.sheet.on{transform:translateY(50%);opacity:1;pointer-events:auto}
  /* деталі витрати на ПК — панель справа, список лишається видно */
  #txSheet{top:0;bottom:0;left:auto;right:0;margin:0;width:26.25rem;max-width:calc(100vw - 3rem);max-height:none;border-radius:var(--r-card) 0 0 var(--r-card);padding:var(--s6) var(--s5);transform:translateX(105%);opacity:1;box-shadow:inset 1px 0 0 var(--line),-24px 0 48px -24px rgba(0,0,0,.7)}
  #txSheet.on{transform:none}

}
/* закрита панель повністю невидима — на телефоні не визирає з-під нижнього меню, коли Safari ховає/показує адресний рядок.
   Ховається вже після анімації закриття */

<script>
/* ---------- дані: Apps Script або демо ---------- */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// Версія інтерфейсу — має збігатися з BUDGET_APP.BUILD у BudgetApp.gs
const BUILD = '2026-11-15.12';
// Встановлювана програма (GitHub Pages): той самий інтерфейс, вхід через Google, дані — через Apps Script API
const PWA = !IS_GAS && !!window.BUDGET_PWA;
const CLOUD = window.BUDGET_CLOUD || {};

const Demo = (() => {
  const CATS = [
    {name:'Житло (Гуртожиток)', plan:85, fixed:85},
    {name:'Харчування та їжа', plan:140},
    {name:'Транспорт', plan:10},
    {name:'Навчання', plan:9},
    {name:"Зв'язок", plan:16},
    {name:'Інше', plan:40},
  ];
  const rates = {uah: 51.02, usd: 1.11};
  const today = '2026-11-11';
  // Листопад — ваші справжні суми з дашборду
  const nov = [
    ['2026-11-10','Харчування та їжа',1.29,'Вода'],
    ['2026-11-09','Транспорт',8.20,'IMHD квиток'],
    ['2026-11-08','Харчування та їжа',13.97,'Lidl'],
    ['2026-11-08','Інше',26.46,'dm drogerie'],
    ['2026-11-07','Харчування та їжа',3.90,'Кава й булочка'],
    ['2026-11-05','Інше',0.52,'Друк'],
    ['2026-11-03','Харчування та їжа',10.34,'Billa'],
    ['2026-11-02','Харчування та їжа',15.11,'Kaufland'],
    ['2026-11-02',"Зв'язок",16.00,'Kyivstar'],
  ].map((r, i) => ({row: 100 - i, date: r[0], category: r[1], amount: r[2], currency: 'EUR', note: r[3]}));

  // Серпень–жовтень — вигадана історія для демо статистики
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const hist = [];
  ['2026-08', '2026-09', '2026-10'].forEach((ym, mi) => {
    const [y, m] = ym.split('-').map(Number), dim = new Date(y, m, 0).getDate();
    hist.push([ym + '-02', "Зв'язок", 16, 'Kyivstar'], [ym + '-05', 'Інше', 3.99, 'Spotify']);
    if (m === 9) hist.push([ym + '-03', 'Навчання', 24.5, 'Підручники'], [ym + '-15', 'Навчання', 13.5, 'Книгарня']);
    for (let d = 1; d <= dim; d++) {
      const ds = ym + '-' + String(d).padStart(2, '0'), wd = new Date(y, m - 1, d).getDay();
      const shop = rnd() < (wd === 6 || wd === 0 ? .8 : .45);
      if (shop) hist.push([ds, 'Харчування та їжа', +(6 + rnd() * (wd === 6 ? 22 : 12)).toFixed(2), pick(['Lidl', 'Lidl', 'Billa', 'Kaufland', 'Tesco'])]);
      if (rnd() < .35) hist.push([ds, 'Харчування та їжа', +(1.6 + rnd() * 3).toFixed(2), pick(['Кава й булочка', 'Coffee Shop', 'Вода'])]);
      if (wd === 5 && rnd() < .5) hist.push([ds, 'Харчування та їжа', +(8 + rnd() * 9).toFixed(2), pick(['Glovo', 'Bistro'])]);
      if (rnd() < .12) hist.push([ds, 'Транспорт', pick([1.2, 1.2, 6.8, 9.9]), pick(['IMHD квиток', 'Bolt', 'Regiojet'])]);
      if (rnd() < .07 + mi * .02) hist.push([ds, 'Інше', +(2 + rnd() * 14).toFixed(2), pick(['dm drogerie', 'Pepco', 'Аптека', 'Друк'])]);
    }
  });

  const state = {
    today, rates, recent: nov, columns: {currency: 'Валюта'}, demo: true,
    close: {auto: false, pending: '2026-10', archive: false, email: true},
    incomes: [{row: 2, date: '2026-11-01', amount: 350, currency: 'EUR', note: 'Стипендія'}],
    extras: {mode: 'off', roll: {ym: '2026-10', plan: 300, spent: 276.6, left: 23.4, from: 'calc'}, rollAdd: 0, bonus: 0,
             piggy: 0, piggyLog: {}, recur: [{id: 'd1', note: 'Spotify', category: 'Інше', amount: 3.99, currency: 'EUR', day: 5, last: '2026-11'}],
             digest: false, email: 'ви@gmail.com'},
  };
  const all = () => hist.map(r => ({date: r[0], category: r[1], eur: r[2], note: r[3]}))
    .concat(state.recent.map(t => ({date: t.date, category: t.category, eur: toEur(t.amount, t.currency, rates), note: t.note})));
  const summarize = ym => {
    const list = all().filter(t => t.date.slice(0, 7) === ym);
    const cats = {}; CATS.forEach(c => cats[c.name] = c.fixed || 0);
    list.forEach(t => cats[t.category] = (cats[t.category] || 0) + t.eur);
    const plan = CATS.reduce((s, c) => s + c.plan, 0), spent = Object.values(cats).reduce((a, b) => a + b, 0);
    const big = list.slice().sort((a, b) => b.eur - a.eur)[0];
    return {ym, plan, spent: +spent.toFixed(2), left: +(plan - spent).toFixed(2), pct: spent / plan * 100, count: list.length,
            avg: spent / new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate(), overDays: 0, biggest: big ? big.note + ' · €' + big.eur.toFixed(2) : '', cats};
  };
  let months = null; // рахуємо при першому запиті, коли всі функції вже готові
  const getMonths = () => months || (months = ['2026-09', '2026-08'].map(summarize));

  const snapshot = () => {
    const ym = today.slice(0, 7);
    const cur = state.recent.filter(t => t.date.slice(0, 7) === ym);
    const categories = CATS.map(c => ({...c, fact: +Math.max(c.fixed || 0, (c.fixed || 0) + cur.filter(t => t.category === c.name).reduce((s, t) => s + toEur(t.amount, t.currency, rates), 0)).toFixed(2)}));
    const days = Array.from({length: 30}, (_, i) => {
      const date = ym + '-' + String(i + 1).padStart(2, '0');
      return {date, spent: +cur.filter(t => t.date === date).reduce((s, t) => s + toEur(t.amount, t.currency, rates), 0).toFixed(2), limit: 7.17};
    });
    return JSON.parse(JSON.stringify({...state, categories, days, months: getMonths()}));
  };
  let next = 200;
  const fail = m => { throw new Error(m); };
  return {
    getData: () => snapshot(),
    getStats: () => ({today, categories: snapshot().categories, fixed: {'Житло (Гуртожиток)': 85},
                      tx: all().map(t => [t.date, t.category, +t.eur.toFixed(2), t.note])}),
    addTransaction: t => { const row = next++; state.recent.unshift({...t, row}); return {row, data: snapshot()}; },
    deleteTransaction: row => { state.recent = state.recent.filter(t => t.row !== row); return snapshot(); },
    updateCategory: (row, amount, category) => { const t = state.recent.find(x => x.row === row); if (!t) fail('Рядок змінився'); t.category = category; return snapshot(); },
    updateTransaction: (row, amount, p) => { const t = state.recent.find(x => x.row === row); if (!t) fail('Рядок змінився'); Object.assign(t, p); return snapshot(); },
    searchAll: q => hist.map(r => ({row: 0, date: r[0], category: r[1], amount: r[2], currency: 'EUR', note: r[3], archived: true}))
      .filter(t => (t.note + ' ' + t.category + ' ' + t.date).toLowerCase().includes(q) || String(t.amount).includes(q))
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 200),
    addIncome: t => { const row = next++; state.incomes.push({...t, row}); return {row, data: snapshot()}; },
    deleteIncome: row => { state.incomes = state.incomes.filter(t => t.row !== row); return snapshot(); },
    sendDigestNow: () => ({to: state.extras.email}),
    setExtras: o => {
      const x = state.extras;
      if (o.mode != null) x.mode = o.mode;
      if (o.digest != null) x.digest = !!o.digest;
      if (o.recur) x.recur = o.recur.map(r => ({...r, id: r.id || String(next++), last: r.last || (r.day <= +today.slice(8) ? today.slice(0, 7) : '')}));
      if (x.mode === 'piggy' && !(x.roll.ym in x.piggyLog)) { x.piggyLog[x.roll.ym] = Math.max(0, x.roll.left); x.piggy += Math.max(0, x.roll.left); }
      if (o.piggySet != null) x.piggy = Math.max(0, Math.round((+o.piggySet || 0) * 100) / 100);
      if (o.piggyTake) { const a = Math.min(x.piggy, o.piggyTake); if (!(a > 0)) fail('У скарбничці недостатньо грошей'); x.piggy -= a; x.bonus += a; }
      x.rollAdd = x.mode === 'budget' ? Math.max(0, x.roll.left) : 0;
      return snapshot();
    },
    enableMonthClose: on => { state.close.auto = !!on; return snapshot(); },
    setMonthArchive: on => { state.close.archive = !!on; if (on) state.close.auto = true; return snapshot(); },
    setBudgets: changes => {
      let saved = 0;
      changes.forEach(ch => { const c = CATS.find(x => x.name === ch.name); if (!c) return;
        if (ch.plan != null) c.plan = Math.round(ch.plan * 100) / 100;
        if (ch.fixed != null) c.fixed = ch.fixed || 0;
        saved++; });
      return {saved, skipped: [], conflicts: [], data: snapshot()};
    },
    editCategories: ops => {
      ops.forEach(o => {
        if (o.op === 'rename') {
          const c = CATS.find(x => x.name === o.from); if (!c) return;
          if (CATS.some(x => x.name === o.to)) fail('Категорія «' + o.to + '» уже є');
          c.name = o.to;
          state.recent.forEach(t => { if (t.category === o.from) t.category = o.to; });
          hist.forEach(r => { if (r[1] === o.from) r[1] = o.to; });
        } else if (o.op === 'delete') {
          if (CATS.length <= 1) fail('Має лишитися хоча б одна категорія');
          const i = CATS.findIndex(x => x.name === o.name); if (i < 0) return;
          CATS.splice(i, 1);
          if (o.moveTo) state.recent.forEach(t => { if (t.category === o.name) t.category = o.moveTo; });
        } else if (o.op === 'add') {
          if (CATS.some(x => x.name === o.name)) fail('Категорія «' + o.name + '» уже є');
          CATS.splice(Math.max(0, CATS.length - 1), 0, {name: o.name, plan: +o.plan || 0});
        }
      });
      return {done: ops.length, data: snapshot()};
    },
    getArchive: () => {
      const by = {};
      hist.forEach(r => (by[r[0].slice(0, 7)] = by[r[0].slice(0, 7)] || []).push([r[0], r[1], r[2], r[3]]));
      return {found: true, auto: state.close.archive,
              months: Object.keys(by).sort().reverse().map(ym => ({ym, rows: by[ym].sort((a, b) => b[0].localeCompare(a[0]))}))};
    },
    app_closeMonth: ym => {
      if (getMonths().some(s => s.ym === ym)) fail('Цей місяць уже підсумовано');
      const s = summarize(ym); months.unshift(s); months.sort((a, b) => b.ym.localeCompare(a.ym)); state.close.pending = null;
      if (state.close.archive) s.moved = s.count;
      return {summary: s, data: snapshot()};
    },
  };
})();

function toEur(amount, cur, rates) { cur = normCur(cur); return cur === 'UAH' ? amount / rates.uah : cur === 'USD' ? amount / rates.usd : amount; }
function fromEur(eur, cur, rates) { return cur === 'UAH' ? eur * rates.uah : cur === 'USD' ? eur * rates.usd : eur; }

/** Один виклик функції на сервері (Apps Script API) від імені користувача. Помилка мережі має .net, потрібен вхід — .auth */
async function call_(fn, args) {
  const fail = (m, k) => { const err = new Error(m); err[k] = true; return err; };
  if (navigator.onLine === false) throw fail('Немає звʼязку з таблицею (network)', 'net');
  if (!CLOUD.deployment) throw new Error('Програму ще не налаштовано: у config.js немає deployment');
  if (!tokenOk()) throw fail('Потрібно увійти в Google', 'auth');
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  // створення таблиці з шаблону може тривати до пів хвилини
  const timer = ctl && setTimeout(() => ctl.abort(), 90000);
  let res, j;
  try {
    res = await fetch('https://script.googleapis.com/v1/scripts/' + encodeURIComponent(CLOUD.deployment) + ':run', {
      method: 'POST', headers: {'Authorization': 'Bearer ' + store.get('gTok'), 'Content-Type': 'application/json'},
      body: JSON.stringify({function: fn, parameters: args}), signal: ctl && ctl.signal});
    j = await res.json();
  } catch (e) {
    if (res) throw new Error('Сервер відповів незрозуміло (' + res.status + '). Спробуйте ще раз.');
    throw fail('Немає звʼязку з таблицею (network)', 'net');
  } finally { if (timer) clearTimeout(timer); }
  const er = j.error;
  if (!er) return j.response ? j.response.result : null;
  // помилка в коді на сервері (напр. NO_SHEET) — показуємо її текст
  const d = (er.details || []).find(x => x.errorMessage != null);
  if (d) throw new Error(d.errorMessage);
  if (res.status === 401 || er.status === 'UNAUTHENTICATED') { store.set('gTok', ''); throw fail('Потрібно увійти в Google', 'auth'); }
  if (/usersettings/.test(er.message || '')) throw new Error('APISET');
  throw new Error(er.message || 'Помилка сервера');
}

/** Витрата, яку поки не вдалося надіслати, — у чергу на пристрої */
function queueTx(t) {
  const item = {...t, row: -(Q.length + 1) * 1000 - Math.floor(Math.random() * 999)};
  Q.push(item); saveQ();
  return {row: item.row, data: withQueue(baseData()), queued: true};
}

/** Вхід застарів (раз на годину): витрату ставимо в чергу й оновлюємо вхід — сторінка Google на мить і назад */
function authLost(fn, args) {
  if (fn === 'addTransaction') {
    const r = queueTx(args[0]);
    setTimeout(() => { if (!reauth()) showSignIn('Сеанс завершився — увійдіть ще раз. Витрата збережена на пристрої й надішлеться після входу.'); }, 1500);
    return r;
  }
  if (!reauth()) showSignIn('Сеанс завершився — увійдіть ще раз.');
  throw new Error('Оновлюю вхід у Google…');
}

/** Виклик з урахуванням офлайну: читання — з кешу, нові витрати — у чергу */
async function remote(fn, args) {
  if (fn === 'addTransaction') args = [{...args[0], cid: args[0].cid || newCid()}];
  if (+args[0] < 0) { // витрата ще в черзі, у таблиці її немає
    if (fn === 'deleteTransaction') { Q = Q.filter(q => q.row !== args[0]); saveQ(); return withQueue(baseData()); }
    if (fn === 'updateCategory') { const q = Q.find(x => x.row === args[0]); if (q) { q.category = args[2]; saveQ(); } return withQueue(baseData()); }
    if (fn === 'updateTransaction') { const q = Q.find(x => x.row === args[0]); if (q) { Object.assign(q, args[2]); saveQ(); } return withQueue(baseData()); }
  }
  try {
    const r = await call_(fn, args);
    NET = 'on';
    if (READS.includes(fn)) store.set('c_' + fn, JSON.stringify(r));
    if (isData(r)) { store.set('c_getData', JSON.stringify(r)); return withQueue(r); }
    if (r && isData(r.data)) { store.set('c_getData', JSON.stringify(r.data)); r.data = withQueue(r.data); }
    return r;
  } catch (e) {
    if (e.auth) return authLost(fn, args);
    if (!e.net) throw e;
    NET = 'off'; syncLabel();
    if (READS.includes(fn)) { const c = store.get('c_' + fn); if (c) { const r = JSON.parse(c); return fn === 'getData' ? withQueue(r) : r; } }
    if (fn === 'addTransaction') return queueTx(args[0]);
    throw new Error('Немає інтернету — ця дія спрацює, коли зʼявиться звʼязок (network).');
  }
}

/** Останні дані з таблиці (без витрат із черги) */
function baseData() {
  try { const c = store.get('c_getData'); if (c) return JSON.parse(c); } catch (e) {}
  return D ? {...D, recent: D.recent.filter(t => !t.pending)} : null;
}

/** Показуємо витрати з черги так, ніби вони вже в таблиці */
function withQueue(d) {
  if (!Q.length || !isData(d)) return d;
  d = JSON.parse(JSON.stringify(d));
  const ym = d.today.slice(0, 7);
  Q.forEach(q => {
    d.recent.unshift({row: q.row, date: q.date, category: q.category, amount: q.amount, currency: q.currency, note: q.note || '', pending: true});
    if (q.date.slice(0, 7) !== ym) return;
    const eur = toEur(q.amount, q.currency, d.rates);
    const c = d.categories.find(x => x.name === q.category); if (c) c.fact = Math.round((c.fact + eur) * 100) / 100;
    const day = d.days.find(x => x.date === q.date); if (day) day.spent = Math.round((day.spent + eur) * 100) / 100;
  });
  return d;
}

/** Надсилаємо чергу, коли зʼявився інтернет. ID витрати захищає від дублів */
let flushing = false;
async function flushQueue() {

/* ---------- пошук по всій історії ---------- */
// В «останніх» лише 80 записів; коли шукаєте — таблиця шукає ще й у старших записах і в архіві
let FOUND = {q: '', list: []}, FIND_WAIT = '', findT = null;
const normQ = s => String(s || '').trim().toLowerCase().replace(',', '.');
function findAll(raw) {
  const q = normQ(raw);
  clearTimeout(findT);
  if (q.length < 2 || FOUND.q === q) { FIND_WAIT = ''; return; }
  FIND_WAIT = q;
  findT = setTimeout(async () => {
    try {
      const list = await api('searchAll', q);
      FOUND = {q, list: list || []};
    } catch (e) { FOUND = {q, list: []}; }
    if (FIND_WAIT === q) FIND_WAIT = '';
    if (normQ(QUERY) === q && $('#txList')) renderHistory();
    if (normQ(TQ) === q) renderTableRows();
  }, 350);
}
/** Знайдене в старих записах, яких немає серед останніх */
function foundFor(q) {
  if (!q || FOUND.q !== q) return [];
  const have = new Set(D.recent.map(t => t.row));
  return FOUND.list.filter(t => !(t.row > 0 && have.has(t.row)));
}
/** Після зміни чи видалення рядки могли зсунутись — шукаємо наново */
function refind() { FOUND = {q: '', list: []}; findAll(QUERY || TQ); }
const txByRow = row => D.recent.find(x => x.row === row) || FOUND.list.find(x => x.row === row && !x.archived);

function renderHistory() {
  const q = QUERY.trim().toLowerCase().replace(',', '.');
  const hit = t => !q || ((t.note || '') + ' ' + (t.category || 'дохід') + ' ' + t.date).toLowerCase().includes(q) || String(t.amount).includes(q);
  // Доходи — в історії поруч із витратами (зелені), але не під фільтром категорії
  const incs = FILTER ? [] : (D.incomes || []).map(t => ({...t, _inc: true})).filter(hit);
  const list = D.recent.filter(t => (!FILTER || t.category === FILTER) && hit(t))
    .concat(foundFor(q).filter(t => !FILTER || t.category === FILTER)).concat(incs)
    .sort((a, b) => b.date.localeCompare(a.date) || b.row - a.row);
  $('#filterBox').innerHTML = FILTER ? `<span class="filter">${catIcon(FILTER)} ${esc(short(FILTER))}<button data-clear aria-label="Прибрати фільтр">${svg('x')}</button></span>` : '';

function guessFromNote(note) {
