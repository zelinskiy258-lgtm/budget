            <span><small>${T('Бюджет')}</small><b>${fmt(plan)}${extra > .005 ? ` <em class="xtra" data-tip="${esc(`<b>${T('Додано до бюджету')}</b>${X.rollAdd ? '<br>' + T('зекономлене за {0}: {1}', LANG === 'en' ? MONTHS[+X.roll.ym.slice(5) - 1] : MONTHS[+X.roll.ym.slice(5) - 1].toLowerCase(), fmt(X.rollAdd)) : ''}${X.bonus ? '<br>' + T('зі скарбнички: {0}', fmt(X.bonus)) : ''}`)}">+${fmt(extra, DISP, true)}</em>` : ''}</b></span>
            <span><small>${T('Витрачено')}</small><b>${fmt(spent)} <em>${pctSpent}%</em></b></span>
            <span data-tip="${esc(`<b>${T('Минуло {0} з {1} днів', elapsed, nDaysM)}</b><br>${T('витрачено {0}% бюджету за {1}% місяця', pctSpent, pctTime)}`)}"><small>${T('Минуло')}</small><b>${T('{0} з {1} дн.', elapsed, nDaysM)} <em>${pctTime}%</em></b></span>
            ${inc > .005 ? `<span data-tip="${esc(`<b>${T('Доходи за місяць')}</b><br>${fmt(inc)}<br>${T('баланс (доходи − витрати): {0}', fmt(inc - spent))}`)}"><small>${T('Доходи')}</small><b class="ok">+${fmt(inc)}</b></span>` : ''}
            ${X.mode === 'piggy' ? `<button class="hm-pig" data-open-plus><small>${T('Скарбничка')}</small><b>${fmt(X.piggy || 0)}</b></button>` : ''}
          </div>
        </div>
        <div class="hero-b">
          <span class="label">${T('Куди пішли гроші')}</span>
          <div class="stack" role="img" aria-label="${T('Розподіл витрат за категоріями')}">${stack}</div>
          <div class="legend">${legend}</div>
        </div>
        <div class="tiles">
          <div class="tile ${pace < -.005 ? 'over' : ''}" data-tip="${esc(`<b>${T('Темп місяця')}</b><br>${T('за рівномірним графіком на сьогодні можна було витратити {0}', fmt(allowed))}${fixedSum ? ' ' + T('(з них щомісячні платежі {0})', fmt(fixedSum)) : ''}<br>${T('витрачено {0}', fmt(spent))}`)}"><span class="label">${pace < -.005 ? T('Понад графік') : T('Запас')}</span><b class="num">${fmt(Math.abs(pace))}</b><small class="num">${T('≈ {0}/день до кінця', fmt(perDay))}</small></div>
          <div class="tile ${r7.l && r7.s > r7.l + .005 ? 'over' : ''}" data-tip="${esc(`<b>${T('Останні 7 днів')}</b><br>${T('{0} з {1}', fmt(r7.s), fmt(r7.l))}<br>${T('велика закупка не страшна, якщо далі тиждень витрачати менше')}`)}"><span class="label">${T('7 днів')}</span><b class="num">${fmt(r7.s)}</b><small class="num">${T('з {0}', fmt(r7.l))}</small></div>
          <div class="tile ${wSpent > wLimit + .005 ? 'over' : ''}"><span class="label">${T('Цей тиждень')}</span><b class="num">${fmt(wSpent)}</b><small class="num">${T('з {0}', fmt(wLimit))}</small></div>
          <div class="tile ${plan && proj > plan + .005 ? 'over' : ''}" data-tip="${esc(`<b>${T('Прогноз на кінець місяця')}</b><br>${T('щомісячні платежі {0} + змінні в теперішньому темпі', fmt(fixedSum))}`)}"><span class="label">${T('Прогноз')}</span><b class="num">${fmt(proj)}</b><small class="num">${plan ? (proj > plan ? T('на {0} понад', fmt(proj - plan)) : T('лишиться {0}', fmt(plan - proj))) : ''}</small></div>
        </div>
      </section>
      <section class="card" id="cal" style="--i:2">
        <h2>${T('Календар')} <small>${overWeeks ? `${svg('alert')} ${T('тижнів понад ліміт: {0}', overWeeks)}` : `${svg('check')} ${T('тижні в межах')}`}</small></h2>
        <div class="cal-body"><div class="dow" aria-hidden="true">${DOW_S.map(d => `<span>${d}</span>`).join('')}<span>Σ</span></div>
        <div class="days">${cells}</div></div>
        <div class="cal-key"><span><i class="k-ok"></i>${T('у межах')}</span><span><i class="k-bad"></i>${T('понад ліміт')}</span><span><i class="k-zero"></i>${T('без витрат')}</span><span><b>Σ</b> ${T('тиждень')}</span><span class="desk-only">${T('наведіть — суми')}</span></div>
      </section>
    </div>
    <div class="col">
      <section class="card" id="cats" style="--i:1">
        <h2>${T('Категорії')} <button class="btn btn-quiet btn-sm" data-open-budget>${svg('edit')} ${T('Бюджет')}</button></h2>
        <div class="cat-list">${catRows}</div>
      </section>
      <section class="card" id="hist" style="--i:3">
        <h2><span class="desk-only">${T('Останні витрати')}</span><span class="mob-only">${T('Історія')}</span> <small class="mob-only">${plural(D.recent.length, 'запис', 'записи', 'записів')}</small><button class="btn btn-quiet btn-sm desk-only" data-tab="hist">${T('Уся історія')} ${svg('back')}</button></h2>
        <div class="box search"><span class="pre">${svg('search')}</span><input id="q" type="search" placeholder="${T('Пошук: Lidl, кава, 4,50…')}" value="${esc(QUERY)}" autocomplete="off"></div>
        <div id="filterBox"></div>
        <div class="list" id="txList"></div>
      </section>
    </div>
  </div>`;
  renderHistory();
  renderTable();
  renderChips();
  if (S) renderStats();
  if (A) renderArchive();
  if (D.demo && window.parent !== window) {
    try { window.parent.postMessage({type: 'budget-demo', data: D, last: LAST}, '*'); } catch (e) {}
  }
}

function txHTML(t) {
  const cur = normCur(t.currency), eur = toEur(t.amount, cur, D.rates);
  if (t._inc) return `<button class="tx inc" data-inc="${t.row}">
    <span class="ic">${svg('wallet')}</span>
    <span style="min-width:0"><div class="t">${esc(t.note || T('Дохід'))}</div><div class="s">${T('дохід · натисніть, щоб видалити')}</div></span>
    <span class="a num">+${cur === DISP ? fmtRaw(t.amount, cur) : fmt(eur)}${cur !== DISP ? `<small>${fmtRaw(t.amount, cur)}</small>` : ''}</span>
  </button>`;
  const fresh = LAST && LAST.op === 'add' && LAST.row === t.row ? ' fresh' : '';
  const note = cleanNote(t.note);
  const amt = `<span class="a num">${cur === DISP ? fmtRaw(t.amount, cur) : fmt(eur)}${cur !== DISP ? `<small>${fmtRaw(t.amount, cur)}</small>` : ''}</span>`;
  // запис з архіву (знайдений пошуком) — лише перегляд
  if (t.archived) return `<div class="tx old" style="--c:${catColor(t.category)}">
    <span class="ic">${catIcon(t.category)}</span>
    <span style="min-width:0"><div class="t">${esc(note || short(t.category))}</div><div class="s"><span class="arc">${T('архів')}</span>${note ? ' · ' + esc(short(t.category)) : ''}</div></span>
    ${amt}
  </div>`;
  return `<button class="tx${fresh}" data-row="${t.row}" style="--c:${catColor(t.category)}">
    <span class="ic">${catIcon(t.category)}</span>
    <span style="min-width:0"><div class="t">${esc(note || short(t.category))}</div><div class="s">${t.pending ? `<span class="pend">${T('чекає інтернету')}</span>${note ? ' · ' : ''}` : ''}${esc(note ? short(t.category) : '')}</div></span>
    ${amt}
  </button>`;
}

/* ---------- пошук по всій історії ---------- */
// В «останніх» лише 80 записів; коли шукаєте — таблиця шукає ще й у старших записах і в архіві
let FOUND = {q: '', list: []}, FIND_WAIT = '', findT = null;
const normQ = s => String(s || '').trim().toLowerCase().replace(',', '.');
function findAll(raw) {
  const q = normQ(raw);
  clearTimeout(findT);
  if (q.length < 2 || FOUND.q === q) { FIND_WAIT = ''; return; }
  FIND_WAIT = q;
  findT = setTimeout(async () => {
    try {
      const list = await api('searchAll', q);
      FOUND = {q, list: list || []};
    } catch (e) { FOUND = {q, list: []}; }
    if (FIND_WAIT === q) FIND_WAIT = '';
    if (normQ(QUERY) === q && $('#txList')) renderHistory();
    if (normQ(TQ) === q) renderTableRows();
  }, 350);
}
/** Знайдене в старих записах, яких немає серед останніх */
function foundFor(q) {
  if (!q || FOUND.q !== q) return [];
  const have = new Set(D.recent.map(t => t.row));
  return FOUND.list.filter(t => !(t.row > 0 && have.has(t.row)));
}
/** Після зміни чи видалення рядки могли зсунутись — шукаємо наново */
function refind() { FOUND = {q: '', list: []}; findAll(QUERY || TQ); }
const txByRow = row => D.recent.find(x => x.row === row) || FOUND.list.find(x => x.row === row && !x.archived);

function renderHistory() {
  const q = QUERY.trim().toLowerCase().replace(',', '.');
  const hit = t => !q || ((t.note || '') + ' ' + (t.category || T('дохід')) + ' ' + t.date).toLowerCase().includes(q) || String(t.amount).includes(q);
  // Доходи — в історії поруч із витратами (зелені), але не під фільтром категорії
  const incs = FILTER ? [] : (D.incomes || []).map(t => ({...t, _inc: true})).filter(hit);
  const list = D.recent.filter(t => (!FILTER || t.category === FILTER) && hit(t))
    .concat(foundFor(q).filter(t => !FILTER || t.category === FILTER)).concat(incs)
    .sort((a, b) => b.date.localeCompare(a.date) || b.row - a.row);
  $('#filterBox').innerHTML = FILTER ? `<span class="filter">${catIcon(FILTER)} ${esc(short(FILTER))}<button data-clear aria-label="${T('Прибрати фільтр')}">${svg('x')}</button></span>` : '';
  const waiting = q && FIND_WAIT === q;
  if (!list.length) {
    $('#txList').innerHTML = `<div class="empty"><div class="e-ic">${svg(q ? 'search' : 'receipt')}</div><b>${waiting ? T('Шукаю в усій історії…') : q ? T('Нічого не знайдено') : FILTER ? T('Тут ще немає витрат') : T('Поки жодної витрати')}</b>${waiting ? '' : q ? T('Спробуйте інше слово або суму.') : T('Додайте першу, і тут зʼявиться історія по днях.')}${q ? '' : `<br><button class="btn btn-primary" data-open-add>${svg('plus')} ${T('Додати витрату')}</button>`}</div>`;
    fitCats();
    return;
  }
  const yest = addDays(D.today, -1), groups = {};
  // На огляді — лише останні кілька витрат; уся історія — окремою вкладкою
  const short5 = document.body.classList.contains('t-over') && !q && !FILTER && list.length > HIST_SHORT;
  (short5 ? list.slice(0, HIST_SHORT) : list).forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const more = short5 ? `<button class="btn btn-secondary more-hist" data-tab="hist">${svg('list')} ${T('Уся історія')} · ${plural(list.length, 'запис', 'записи', 'записів')}</button>` : '';
  $('#txList').innerHTML = Object.keys(groups).map(date => {
    const d = parseD(date);
    const label = date === D.today ? T('Сьогодні') : date === yest ? T('Вчора') : `${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${DOW[d.getDay()]}`;
    const sum = groups[date].filter(t => !t._inc).reduce((s, t) => s + toEur(t.amount, t.currency, D.rates), 0);
    return `<div class="group"><span>${label}</span><span class="num">${fmt(sum)}</span></div>` + groups[date].map(txHTML).join('');
  }).join('') + more + (waiting ? `<div class="hint" style="padding:var(--s2)">${T('Шукаю ще й у старих записах…')}</div>` : '');
  fitHistory(); fitCats();
}
const HIST_SHORT = 5;

/* ПК, огляд на один екран: нічого не прокручується всередині карток */
const ONE = matchMedia('(min-width:1000px)');
const oneScreen = () => ONE.matches && document.body.classList.contains('t-over');
// Історія: прибираємо найстаріші витрати, поки список не влізе в картку
function fitHistory() {
  const box = $('#txList');
  if (!box || !oneScreen() || !box.querySelector('.tx')) return;
  let added = false;
  if (!box.querySelector('.more-hist')) {
    box.insertAdjacentHTML('beforeend', `<button class="btn btn-secondary more-hist" data-tab="hist">${svg('list')} ${T('Уся історія')} · ${plural(D.recent.length, 'запис', 'записи', 'записів')}</button>`);
    added = true;
  }
  let cut = false;
  while (box.scrollHeight > box.clientHeight + 1) {
    const txs = box.querySelectorAll('.tx'); if (txs.length <= 1) break;
    const last = txs[txs.length - 1], prev = last.previousElementSibling;
    last.remove(); cut = true;
    if (prev && prev.classList.contains('group') && !(prev.nextElementSibling && prev.nextElementSibling.classList.contains('tx'))) prev.remove();
  }
  if (added && !cut) box.querySelector('.more-hist').remove();
}
// Категорії: якщо всі не влазять — компактний вигляд без рядка «€x з €y»
function fitCats() {
  const card = $('#cats'), box = card && card.querySelector('.cat-list'); if (!box) return;
  card.classList.remove('tight');
  if (oneScreen() && box.scrollHeight > box.clientHeight + 1) card.classList.add('tight');
}
let fitT = null;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { if (D && $('#txList')) renderHistory(); }, 120); });

/* ---------- ПК: історія таблицею ---------- */
function renderTable() {
  const box = $('#table'); if (!box || !D) return;
  const used = [...new Set(D.recent.map(t => t.category))];
  const cats = catNames().filter(n => used.includes(n)).concat(used.filter(n => !catNames().includes(n)));
  if (TF && !used.includes(TF)) TF = null;
  box.innerHTML = `<section class="card">
    <h2>${T('Історія витрат')} <small>${T('останні {0} · пошук шукає по всій історії й архіву', plural(D.recent.length, 'запис', 'записи', 'записів'))}</small></h2>
    <div class="tbar">
      <div class="box search"><span class="pre">${svg('search')}</span><input id="tq" type="search" placeholder="${T('Пошук: Lidl, кава, 4,50, 2026-11-08…')}" value="${esc(TQ)}" autocomplete="off"></div>
      <button class="btn btn-primary" data-open-add>${svg('plus')} ${T('Додати')}</button>
    </div>
    <div class="tchips" role="group" aria-label="${T('Категорія')}">${[''].concat(cats).map(n => `<button class="chip ${n === (TF || '') ? 'on' : ''}" data-tcat="${esc(n)}">${n ? catIcon(n) + ' ' + esc(short(n)) : T('Усі категорії')}</button>`).join('')}</div>
    <div id="tWrap"></div>
  </section>`;
  renderTableRows();
}

function renderTableRows() {
  const wrap = $('#tWrap'); if (!wrap) return;
  const q = TQ.trim().toLowerCase().replace(',', '.');
  const eurOf = t => toEur(t.amount, t.currency, D.rates);
  const list = D.recent.concat(TF ? [] : (D.incomes || []).map(t => ({...t, category: T('Дохід'), _inc: true}))).filter(t => (!TF || t.category === TF) &&
    (!q || ((t.note || '') + ' ' + t.category + ' ' + t.date).toLowerCase().includes(q) || String(t.amount).includes(q)))
    .concat(foundFor(q).filter(t => !TF || t.category === TF));
  const {k, dir} = TSORT;
  const val = {date: t => t.date + String(t.row).padStart(7, '0'), category: t => t.category.toLowerCase(), note: t => (t.note || '').toLowerCase(), amount: eurOf};
  list.sort((a, b) => { const x = val[k](a), y = val[k](b); return (x < y ? -1 : x > y ? 1 : 0) * dir || b.date.localeCompare(a.date); });
  if (!list.length) {
    const waiting = q && FIND_WAIT === q;
    wrap.innerHTML = `<div class="empty"><div class="e-ic">${svg(q ? 'search' : 'receipt')}</div><b>${waiting ? T('Шукаю в усій історії…') : q || TF ? T('Нічого не знайдено') : T('Поки жодної витрати')}</b>${waiting ? '' : q || TF ? T('Спробуйте інше слово, суму або категорію.') : T('Додайте першу витрату.')}</div>`;
    return;
  }
  const total = list.filter(t => !t._inc).reduce((s, t) => s + eurOf(t), 0);
  const th = (key, label, cls = '') => `<th class="${cls} ${k === key ? 'on' : ''}" aria-sort="${k === key ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${key}">${label}${k === key ? svg(dir > 0 ? 'up' : 'down') : ''}</button></th>`;
  const rows = list.map(t => {
    const cur = normCur(t.currency), d = parseD(t.date);
    const when = `<td class="num">${t.date === D.today ? T('Сьогодні') : `${d.getDate()} ${MONTHS_G[d.getMonth()]}`} <span class="orig">${DOW_S[(d.getDay() + 6) % 7]}</span></td>`;
    if (t._inc) return `<tr style="--c:var(--ok)">${when}
      <td><span class="cat-cell"><span class="dot" style="color:var(--ok)">${svg('wallet')}</span><span>${T('Дохід')}</span></span></td>
      <td>${t.note ? esc(t.note) : '<span class="orig">—</span>'}</td>
      <td class="r amt num" style="color:var(--ok)">+${fmt(eurOf(t))}</td>
      <td class="r orig num">${cur !== DISP ? fmtRaw(t.amount, cur) : ''}</td>
      <td class="r"><span class="acts"><button class="del" data-inc="${t.row}" title="${T('Видалити дохід')}" aria-label="${T('Видалити дохід')}">${svg('trash')}</button></span></td></tr>`;
    const fresh = LAST && LAST.op === 'add' && LAST.row === t.row ? ' fresh' : '';
    const noteCell = `<td>${cleanNote(t.note) ? esc(cleanNote(t.note)) : '<span class="orig">—</span>'}${t.archived ? ` <span class="orig">· ${T('архів')}</span>` : ''}${t.pending ? ` <span class="pend">· ${T('чекає інтернету')}</span>` : ''}</td>`;
    if (t.archived) return `<tr style="--c:${catColor(t.category)}">${when}
      <td><span class="cat-cell"><span class="dot">${catIcon(t.category)}</span><span>${esc(short(t.category))}</span></span></td>
      ${noteCell}<td class="r amt num">${fmt(eurOf(t))}</td><td class="r orig num">${cur !== DISP ? fmtRaw(t.amount, cur) : ''}</td><td></td></tr>`;
    return `<tr data-row="${t.row}" tabindex="0" class="${SEL_ROW === t.row ? 'sel' : ''}${fresh}" style="--c:${catColor(t.category)}">
      ${when}
      <td><span class="cat-cell"><span class="dot">${catIcon(t.category)}</span><span>${esc(short(t.category))}</span></span></td>
      ${noteCell}
      <td class="r amt num">${fmt(eurOf(t))}</td>
      <td class="r orig num">${cur !== DISP ? fmtRaw(t.amount, cur) : ''}</td>
      <td class="r"><span class="acts"><button data-row="${t.row}" title="${T('Змінити')}" aria-label="${T('Змінити витрату')}">${svg('edit')}</button><button class="del" data-delrow="${t.row}" title="${T('Видалити')}" aria-label="${T('Видалити')}">${svg('trash')}</button></span></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table class="tt">
    <colgroup><col style="width:17%"><col style="width:19%"><col><col style="width:13%"><col style="width:11%"><col style="width:76px"></colgroup>
    <thead><tr>${th('date', T('Дата'))}${th('category', T('Категорія'))}${th('note', T('Де / що'))}${th('amount', T('Сума'), 'r')}<th class="r"><span style="justify-content:flex-end">${T('Валюта')}</span></th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3">${plural(list.length, 'запис', 'записи', 'записів')}${TF || q ? ' · ' + T('відфільтровано') : ''}</td><td class="r amt num" title="${T('Сума витрат')}">${fmt(total)}</td><td colspan="2"></td></tr></tfoot>
  </table>`;
}

/* ---------- форма витрати ---------- */
function renderChips() {
  if (!ADD_CAT || !D.categories.some(c => c.name === ADD_CAT)) ADD_CAT = (D.categories.find(c => /харч|food|grocer/i.test(c.name)) || D.categories[0] || {}).name;
  $('#catChips').innerHTML = D.categories.map(c => `<button class="chip ${c.name === ADD_CAT ? 'on' : ''}" role="radio" aria-checked="${c.name === ADD_CAT}" data-chip="${esc(c.name)}">${catIcon(c.name)} ${esc(short(c.name))}</button>`).join('');
  // Підказки для поля «Де / що» — з ваших частих записів
  const freq = {};
  D.recent.forEach(t => { const n = cleanNote(t.note); if (n) freq[n] = (freq[n] || 0) + 1; });
  if (S) S.tx.forEach(t => { const n = cleanNote(t[3]); if (n) freq[n] = (freq[n] || 0) + 1; });
  $('#noteList').innerHTML = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 30).map(n => `<option value="${esc(n)}">`).join('');
}
// Якщо «Де / що» вже траплялось — підставляємо його звичну категорію
function guessFromNote(note) {
  const n = note.trim().toLowerCase(); if (!n) return;
  const counts = {};
  D.recent.concat(S ? S.tx.map(t => ({note: t[3], category: t[1]})) : []).forEach(t => { if (cleanNote(t.note).toLowerCase() === n) counts[t.category] = (counts[t.category] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (best && best !== ADD_CAT && D.categories.some(c => c.name === best)) { ADD_CAT = best; renderChips(); }
}
function updateEqv() {
  const v = parseFloat($('#amt').value.replace(',', '.')) || 0;
  $('#curSym').textContent = SYM[ADD_CUR];
  if (v > 0) setAmtError(false);

}
function setAmtError(on) { $('#amtBox').classList.toggle('err', on); $('#amtErr').classList.toggle('on', on); }
function syncCurSeg() { document.querySelectorAll('#curSeg button').forEach(b => b.classList.toggle('on', b.dataset.c === ADD_CUR)); }
/* Форма: витрата або дохід */
let ADD_KIND = 'exp';
const SOURCES = ['Стипендія', 'Підробіток', 'Зарплата', 'Від батьків', 'Подарунок', 'Повернули борг'];
function setKind(k) {

  const inc = k === 'inc';
  document.querySelectorAll('#kindSeg button').forEach(b => b.classList.toggle('on', b.dataset.k === k));

  $('#note').placeholder = inc ? T('напр. Стипендія') : T('напр. Lidl');
  $('#note').setAttribute('list', inc ? '' : 'noteList');

  if (inc) renderSources();
}
function renderSources() {

  const cur = $('#note').value.trim();
  $('#srcChips').innerHTML = [...new Set(used.concat(SOURCES.map(s => T(s))))].slice(0, 9).map(s => `<button class="chip ${s === cur ? 'on' : ''}" data-src="${esc(s)}">${esc(s)}</button>`).join('');
}
/* ---------- статистика ---------- */
const PERIODS = [['month', 'Цей місяць'], ['prev', 'Минулий'], ['3m', '3 місяці'], ['year', 'Рік'], ['all', 'Усе']];
const ymOf = s => s.slice(0, 7);
const monthStart = (s, shift = 0) => { const d = parseD(s); d.setDate(1); d.setMonth(d.getMonth() + shift); return isoD(d); };
const monthEnd = s => { const d = parseD(s); return isoD(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const dim = s => +monthEnd(s).slice(8);

/** Межі періоду й попереднього такого ж періоду для порівняння */
function periodRange(p, today, first) {
  switch (p) {
    case 'month': { const from = monthStart(today), n = daysBetween(from, today), pf = monthStart(today, -1);
      return {from, to: today, pFrom: pf, pTo: addDays(pf, Math.min(n, dim(pf)) - 1), label: T('з минулим місяцем на ту ж дату')}; }
    case 'prev': { const from = monthStart(today, -1), pf = monthStart(today, -2);
      return {from, to: monthEnd(from), pFrom: pf, pTo: monthEnd(pf), label: T('з позаминулим місяцем')}; }
    case '3m': { const from = monthStart(today, -2), pf = monthStart(today, -5);
      return {from, to: today, pFrom: pf, pTo: addDays(monthStart(today, -3), daysBetween(monthStart(today), today) - 1), label: T('з попередніми 3 місяцями')}; }
    case 'year': { const from = today.slice(0, 4) + '-01-01', y = +today.slice(0, 4) - 1;
      return {from, to: today, pFrom: y + '-01-01', pTo: y + today.slice(4), label: T('з тим самим періодом минулого року')}; }
    default: return {from: first || today, to: today, pFrom: null, pTo: null, label: ''};
  }
}

/** Витрати за період; t[4] — щомісячний платіж. Платежі цього місяця, які ще не записані, — як зарезервовані */
function periodTx(from, to) {
  const out = S.tx.filter(t => t[0] >= from && t[0] <= to).map(t => ({date: t[0], category: t[1], eur: t[2], note: t[3], fixed: !!t[4]}));
  const m = monthStart(S.today);
  if (m >= monthStart(from) && m <= to) Object.keys(S.pending || {}).forEach(cat => {
    if (S.pending[cat] > .005) out.push({date: m < from ? from : m, category: cat, eur: S.pending[cat], note: '', fixed: true});
  });
  return out;
}

const niceMax = v => { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(x => x >= v); };
const dayLabel = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`; };
const deltaHTML = (cur, prev) => {
  if (!prev) return '';
  const d = (cur - prev) / prev * 100;
  if (Math.abs(d) < 0.5) return `<span class="delta">${T('≈ так само')}</span>`;
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${svg(d > 0 ? 'trendUp' : 'trendDown')} ${d > 0 ? '+' : '−'}${Math.abs(Math.round(d))}%</span>`;
};

function renderStats() {
  const box = $('#stats'); if (!box) return;
  if (!S) { box.innerHTML = `<div class="sk-card"><div class="sk" style="height:40px"></div><div class="sk" style="height:180px"></div></div>`; return; }
  const first = S.tx.reduce((m, t) => t[0] < m ? t[0] : m, S.today);
  const R = periodRange(PERIOD, S.today, first);
  const allCur = periodTx(R.from, R.to), allPrev = R.pFrom ? periodTx(R.pFrom, R.pTo) : [];
  const cur = ST_CAT ? allCur.filter(t => t.category === ST_CAT) : allCur;
  const prev = ST_CAT ? allPrev.filter(t => t.category === ST_CAT) : allPrev;
  const real = cur.filter(t => !t.fixed), buys = real;
  const total = cur.reduce((s, t) => s + t.eur, 0), prevTotal = prev.reduce((s, t) => s + t.eur, 0);
  const nDays = daysBetween(R.from, R.to);
  const nMonths = new Set(Array.from({length: nDays}, (_, i) => ymOf(addDays(R.from, i)))).size;
  const planOf = name => { const c = S.categories.find(x => x.name === name); return c ? c.plan : 0; };
  const planMonth = ST_CAT ? planOf(ST_CAT) : S.categories.reduce((s, c) => s + c.plan, 0);
  const periodTitle = T((PERIODS.find(p => p[0] === PERIOD) || [])[1] || '');

  // ---- KPI ----
  const avgCheck = buys.length ? buys.reduce((s, t) => s + t.eur, 0) / buys.length : 0;
  const kpis = `<div class="kpis">
    <div class="kpi"><span class="label">${T('Витрачено')}</span><b class="num">${fmt(total)}</b><small>${R.pFrom ? deltaHTML(total, prevTotal) + ' ' + esc(R.label) : periodTitle}</small></div>
    <div class="kpi"><span class="label">${T('У середньому на день')}</span><b class="num">${fmt(total / nDays)}</b><small>${T('за {0}', plural(nDays, 'день', 'дні', 'днів'))}</small></div>
    <div class="kpi"><span class="label">${T('Покупок')}</span><b class="num">${buys.length}</b><small>${T('≈ {0} на день', dec((buys.length / nDays).toFixed(1)))}</small></div>
    <div class="kpi"><span class="label">${T('Середній чек')}</span><b class="num">${fmt(avgCheck)}</b><small>${T('без щомісячних платежів')}</small></div>
  </div>`;

  box.innerHTML = `
    <div class="st-bar">
      <div class="seg" role="group" aria-label="${T('Період')}">${PERIODS.map(([k, l]) => `<button data-period="${k}" class="${k === PERIOD ? 'on' : ''}">${T(l)}</button>`).join('')}</div>
      ${ST_CAT ? `<div><span class="filter" style="margin:0">${catIcon(ST_CAT)} ${esc(short(ST_CAT))}<button data-stcat="" aria-label="${T('Усі категорії')}">${svg('x')}</button></span></div>` : ''}
    </div>
    ${kpis}
    <div class="st-grid">
      <section class="card wide" id="stTrend"></section>
      <section class="card wide desk-only" id="stHeat"></section>
      <section class="card" id="stCats"></section>
      <section class="card" id="stWeek"></section>
      <section class="card" id="stPlaces"></section>
      <section class="card" id="stInsights"></section>
      <section class="card wide" id="months"></section>
    </div>`;

  renderTrend(R, cur, prev, planMonth, nDays);
  if (DESK.matches) renderHeat();
  renderCatsStat(allCur, total, nMonths, R.pFrom ? allPrev : null);
  renderWeek(real, R);
  renderPlaces(real, cur);
  renderInsights({R, cur, real, total, prevTotal, planMonth, allCur});
  renderMonths();
}

/* Динаміка: до 2 місяців — накопичувальна лінія по днях; довше — стовпці по місяцях */
function renderTrend(R, cur, prev, planMonth, nDays) {
  const el = $('#stTrend');
  if (nDays <= 62 && PERIOD !== '3m') {
    const len = PERIOD === 'month' ? dim(R.from) : nDays;
    const byDay = {}; cur.forEach(t => byDay[t.date] = (byDay[t.date] || 0) + t.eur);
    const pByDay = {}; prev.forEach(t => pByDay[t.date] = (pByDay[t.date] || 0) + t.eur);
    const pts = [], ppts = [];
    let acc = 0, pacc = 0;
    for (let i = 0; i < len; i++) {
      const d = addDays(R.from, i);
      if (d <= R.to) { acc += byDay[d] || 0; pts.push({d, day: byDay[d] || 0, acc}); }
      if (R.pFrom) { const pd = addDays(R.pFrom, i); if (ymOf(pd) === ymOf(R.pFrom)) { pacc += pByDay[pd] || 0; ppts.push(pacc); } }
    }
    const planLine = planMonth > 0;
    const max = niceMax(Math.max(acc, pacc, planLine ? planMonth : 0) * 1.05);
    el.innerHTML = `<h2>${T('Як ростуть витрати')} <small>${PERIOD === 'month' ? T('накопичено за місяць') : T('накопичено за період')}</small></h2>
      <div class="chart-wrap" id="lineWrap"></div>
      <div class="ckey"><span><i style="background:var(--accent)"></i>${PERIOD === 'month' ? T('цей місяць') : T('витрачено')}</span>${ppts.length ? `<span><i style="background:var(--mute)"></i>${T('попередній місяць')}</span>` : ''}${planLine ? `<span><i class="dash"></i>${T('темп бюджету ({0})', fmt(planMonth))}</span>` : ''}</div>`;
    drawLine($('#lineWrap'), {pts, ppts, len, max, planMonth: planLine ? planMonth : 0, from: R.from});
  } else {
    const months = [];
    for (let m = monthStart(R.from); m <= R.to; m = monthStart(m, 1)) months.push(ymOf(m));
    const shown = months.slice(-12);
    const sums = shown.map(ym => cur.filter(t => ymOf(t.date) === ym).reduce((s, t) => s + t.eur, 0));
    const max = niceMax(Math.max(...sums, planMonth) * 1.05);
    const nowYm = ymOf(S.today);
    el.innerHTML = `<h2>${T('Витрати по місяцях')} <small>${T('пунктир — бюджет {0}', fmt(planMonth, DISP, true))}</small></h2>
      <div class="vbars" style="--n:${shown.length}" role="img" aria-label="${T('Витрати по місяцях')}">${shown.map((ym, i) => {
        const v = sums[i], over = planMonth && v > planMonth + .005, now = ym === nowYm;
        const tip = `<b>${monthName(ym)}</b><br>${fmt(v)}${planMonth ? ' ' + T('з {0}', fmt(planMonth)) + ` · ${Math.round(v / planMonth * 100)}%` : ''}${now ? '<br>' + T('місяць ще триває') : ''}`;
        return `<div class="vb" data-tip="${esc(tip)}" data-ym="${ym}"><div class="plot">${planMonth ? `<span class="lim" style="bottom:${planMonth / max * 100}%"></span>` : ''}<i class="${now ? 'now' : over ? 'over' : ''}" style="height:${v / max * 100}%"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${MONTHS[+ym.slice(5) - 1].slice(0, 3)}</span></div>`;
      }).join('')}</div>
      <div class="ckey"><span><i style="background:var(--ok)"></i>${T('у межах бюджету')}</span><span><i style="background:var(--bad)"></i>${T('понад бюджет')}</span><span><i style="background:var(--accent)"></i>${T('поточний місяць')}</span></div>`;
  }
}

function drawLine(wrap, o) {
  const W = Math.max(280, wrap.clientWidth || 600), H = Math.max(160, wrap.clientHeight || 200);
  // Tp — відступ зверху (не T: T — переклад)
  const L = 46, Rp = 12, Tp = 12, B = 24, pw = W - L - Rp, ph = H - Tp - B;
  const x = i => L + (o.len > 1 ? i / (o.len - 1) : 0) * pw;
  const y = v => Tp + ph - v / o.max * ph;
  const ticks = [0, o.max / 2, o.max];
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const last = o.pts[o.pts.length - 1];
  const xl = [1, Math.ceil(o.len / 2), o.len].map(n => `<text class="ax" x="${x(n - 1)}" y="${H - 6}" text-anchor="${n === 1 ? 'start' : n === o.len ? 'end' : 'middle'}">${n}</text>`).join('');
  const hits = Array.from({length: o.len}, (_, i) => {
    const p = o.pts[i], d = addDays(o.from, i);
    const tip = `<b>${dayLabel(d)}</b>${p ? `<br>${T('за день: {0}', fmt(p.day))}<br>${T('усього: {0}', fmt(p.acc))}` : '<br>' + T('ще попереду')}${o.planMonth ? '<br>' + T('темп бюджету: {0}', fmt(o.planMonth * (i + 1) / o.len)) : ''}${o.ppts[i] != null ? '<br>' + T('мин. місяць: {0}', fmt(o.ppts[i])) : ''}`;
    const w = pw / Math.max(1, o.len - 1);
    return `<rect class="hit" x="${x(i) - w / 2}" y="${Tp}" width="${w}" height="${ph}" data-tip="${esc(tip)}" data-x="${x(i)}"/>`;
  }).join('');
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${T('Накопичені витрати по днях')}">
    ${ticks.map(v => `<line class="gridl" x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, DISP, true)}</text>`).join('')}
    ${xl}
    ${o.planMonth ? `<line x1="${x(0)}" y1="${y(o.planMonth / o.len)}" x2="${x(o.len - 1)}" y2="${y(o.planMonth)}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    ${o.ppts.length ? `<path d="${path(o.ppts)}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linejoin="round" opacity=".7"/>` : ''}
    <path d="${path(o.pts.map(p => p.acc))}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${x(o.pts.length - 1)}" cy="${y(last.acc)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
      <text x="${Math.min(x(o.pts.length - 1) + 8, W - Rp)}" y="${y(last.acc) - 10}" text-anchor="${x(o.pts.length - 1) > W - 90 ? 'end' : 'start'}" font-size="12" font-weight="700" fill="var(--ink)">${fmt(last.acc)}</text>` : ''}
    <line class="xh" x1="0" x2="0" y1="${Tp}" y2="${Tp + ph}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
    ${hits}
  </svg>`;
}

/* Карта року (ПК): кожна клітинка — день, колір — скільки витрачено. Без щомісячних платежів, з урахуванням фільтра категорії */
function renderHeat() {
  const el = $('#stHeat'); if (!el) return;
  const end = S.today, weeks = 53;
  const start = addDays(end, -((parseD(end).getDay() + 6) % 7) - (weeks - 1) * 7);
  const by = {};
  S.tx.forEach(t => {
    if (t[0] < start || t[0] > end) return;
    if (ST_CAT ? t[1] !== ST_CAT : t[4]) return;
    by[t[0]] = (by[t[0]] || 0) + t[2];
  });
  const vals = Object.values(by).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const th = [q(.25), q(.5), q(.75)];
  const lvl = v => !(v > 0) ? 0 : v <= th[0] ? 1 : v <= th[1] ? 2 : v <= th[2] ? 3 : 4;
  const FILL = ['var(--sunk)', ...[28, 50, 75].map(p => `color-mix(in srgb,var(--accent) ${p}%,var(--card))`), 'var(--accent)'];
  const C = 13, G = 3, L = 30, Tp = 18;
  let cells = '', labels = '', lastM = parseD(start).getMonth();
  for (let w = 0; w < weeks; w++) {
    const mon = parseD(addDays(start, w * 7));
    if (mon.getMonth() !== lastM && w < weeks - 2) { lastM = mon.getMonth(); labels += `<text class="ax" x="${L + w * (C + G)}" y="11">${MONTHS[lastM].slice(0, 3)}</text>`; }
    for (let d = 0; d < 7; d++) {
      const ds = addDays(start, w * 7 + d); if (ds > end) break;
      const v = by[ds] || 0;
      const tip = `<b>${dayLabel(ds)}, ${DOW[parseD(ds).getDay()]}</b><br>${v ? fmt(v) : T('без покупок')}`;
      cells += `<rect x="${L + w * (C + G)}" y="${Tp + d * (C + G)}" width="${C}" height="${C}" rx="3" fill="${FILL[lvl(v)]}"${ds === end ? ' stroke="var(--ink)" stroke-width="1.5"' : ''} data-tip="${esc(tip)}"/>`;
    }
  }
  [0, 2, 4, 6].forEach(d => labels += `<text class="ax" x="0" y="${Tp + d * (C + G) + 10}">${DOW_S[d]}</text>`);
  const W = L + weeks * (C + G), H = Tp + 7 * (C + G);
  const top = Object.keys(by).sort((a, b) => by[b] - by[a])[0];
  el.innerHTML = `<h2>${T('Рік по днях')} <small>${ST_CAT ? esc(short(ST_CAT)) : T('без щомісячних платежів')} · ${T('{0} з покупками', plural(Object.keys(by).length, 'день', 'дні', 'днів'))}</small></h2>
    <div class="heat"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Витрати по днях за рік')}">${labels}${cells}</svg></div>
    <div class="ckey heat-key"><span>${T('менше')} ${FILL.map(f => `<i style="background:${f}"></i>`).join('')} ${T('більше')}</span>${top ? `<span>${T('найдорожчий день:')} <b style="color:var(--ink)">${dayLabel(top)}</b> — ${fmt(by[top])}</span>` : ''}</div>`;
}

/* Категорії: горизонтальні стовпці, натискання — фільтр усієї статистики. Під назвою — різниця з минулим місяцем / періодом */
function renderCatsStat(allCur, total, nMonths, allPrev) {
  const by = {}, pby = {};
  allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  if (allPrev) allPrev.forEach(t => pby[t.category] = (pby[t.category] || 0) + t.eur);
  const vsWhat = PERIOD === 'month' ? T('до {0} на ту ж дату', monShort(+monthStart(S.today, -1).slice(5, 7) - 1))
    : PERIOD === 'prev' ? T('до позаминулого місяця') : T('до попереднього періоду');
  const cmp = n => {
    if (!allPrev) return '';
    const d = by[n] - (pby[n] || 0);
    if (!pby[n]) return `<small>${T('нова цього періоду')}</small>`;
    if (Math.abs(d) < .5) return `<small>${T('≈ так само')}</small>`;
    return `<small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d), DISP, true)} ${vsWhat}</small>`;
  };
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const names = Object.keys(by).sort((a, b) => by[b] - by[a]);
  const max = Math.max(...names.map(n => Math.max(by[n], (S.categories.find(c => c.name === n) || {}).plan * nMonths || 0)), 1);
  $('#stCats').innerHTML = `<h2>${T('Категорії')} <small>${T('натисніть, щоб відфільтрувати')}</small></h2>` + (names.length ? names.map(n => {
    const plan = ((S.categories.find(c => c.name === n) || {}).plan || 0) * nMonths, over = plan && by[n] > plan + .005;
    const tip = `<b>${esc(n)}</b><br>${fmt(by[n])} · ${T('{0}% усіх витрат', Math.round(by[n] / sum * 100))}${plan ? `<br>${T('бюджет: {0}', fmt(plan))}${over ? ' · ' + T('перевищено') : ''}` : ''}`;
    return `<button class="hbar ${ST_CAT === n ? 'sel' : ''}" data-stcat="${esc(n)}" style="--c:${over ? 'var(--bad)' : catColor(n)}" data-tip="${esc(tip)}">
      <span class="ic" style="color:${catColor(n)}">${catIcon(n)}</span><span class="nm">${esc(short(n))}${cmp(n)}</span>
      <span class="v num">${fmt(by[n])}<small>${Math.round(by[n] / sum * 100)}%</small></span>
      <span class="track"><i style="width:${by[n] / max * 100}%"></i>${plan ? `<span class="pl" style="left:calc(${Math.min(100, plan / max * 100)}% - 1px)"></span>` : ''}</span>
    </button>`;
  }).join('') + `<div class="ckey"><span><i style="background:var(--ink2);width:2px;height:10px;vertical-align:-1px"></i>${T('бюджет категорії за період')}</span></div>` : `<div class="empty">${T('За цей період витрат немає')}</div>`);
}

/* Дні тижня: середня сума покупок у кожен день тижня */
function renderWeek(real, R) {
  const sums = Array(7).fill(0), cnt = Array(7).fill(0);
  real.forEach(t => sums[(parseD(t.date).getDay() + 6) % 7] += t.eur);
  for (let i = 0; i < daysBetween(R.from, R.to); i++) cnt[(parseD(addDays(R.from, i)).getDay() + 6) % 7]++;
  const avg = sums.map((s, i) => cnt[i] ? s / cnt[i] : 0);
  const max = niceMax(Math.max(...avg) * 1.05), peak = avg.indexOf(Math.max(...avg));
  $('#stWeek').innerHTML = `<h2>${T('Дні тижня')} <small>${T('середні витрати за день')}</small></h2>
    <div class="vbars" style="--n:7;--c:var(--accent)" role="img" aria-label="${T('Середні витрати за днями тижня')}">${avg.map((v, i) => {
      const tip = `<b>${DOW[(i + 1) % 7]}</b><br>${T('у середньому {0}', fmt(v))}<br>${T('усього {0} за {1} дн.', fmt(sums[i]), cnt[i])}`;
      return `<div class="vb ${i === peak && v > 0 ? 'peak' : ''}" data-tip="${esc(tip)}"><div class="plot"><i style="height:${v / max * 100}%;background:${i >= 5 ? 'var(--accent)' : '#7D97E0'}"></i></div><b class="num">${fmt(v, DISP, true)}</b><span>${DOW_S[i]}</span></div>`;
    }).join('')}</div>
    <div class="ckey"><span><i style="background:#7D97E0"></i>${T('будні')}</span><span><i style="background:var(--accent)"></i>${T('вихідні')}</span><span>${T('обведено — найдорожчий день')}</span></div>`;
}

/* Найчастіші місця й найбільші покупки */
function renderPlaces(real) {
  const by = {};
  real.forEach(t => {
    const k = cleanNote(t.note); if (!k) return;
    const key = k.toLowerCase();
    (by[key] = by[key] || {name: k, sum: 0, n: 0, cat: t.category}); by[key].sum += t.eur; by[key].n++;
  });
  const top = Object.values(by).sort((a, b) => b.sum - a.sum).slice(0, 6);
  const big = real.slice().sort((a, b) => b.eur - a.eur).slice(0, 4);
  $('#stPlaces').innerHTML = `<h2>${T('Де ви витрачаєте')} <small>${T('за сумою')}</small></h2>
    ${top.length ? top.map((p, i) => `<div class="rank" data-tip="${esc(`<b>${esc(p.name)}</b><br>${T('{0} раз · у середньому {1}', p.n, fmt(p.sum / p.n))}`)}"><span class="n">${i + 1}</span><span class="nm">${esc(p.name)}<small>${plural(p.n, 'покупка', 'покупки', 'покупок')} · ${esc(short(p.cat))}</small></span><span class="v num">${fmt(p.sum)}</span></div>`).join('')
      : `<div class="hint" style="padding:8px 4px">${T('Заповнюйте поле «Де / що» — і тут зʼявиться рейтинг місць.')}</div>`}

    ${big.map(t => `<div class="rank"><span class="ic" style="color:${catColor(t.category)}">${catIcon(t.category)}</span><span class="nm">${esc(cleanNote(t.note) || short(t.category))}<small>${dayLabel(t.date)}</small></span><span class="v num">${fmt(t.eur)}</span></div>`).join('') || '<div class="hint">—</div>'}`;
}

/* Висновки простими словами */
function renderInsights(x) {
  const out = [];
  const by = {}; x.allCur.forEach(t => by[t.category] = (by[t.category] || 0) + t.eur);
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const vby = {}; x.allCur.forEach(t => { if (!t.fixed) vby[t.category] = (vby[t.category] || 0) + t.eur; });
  const topVar = Object.keys(vby).sort((a, b) => vby[b] - vby[a])[0];
  if (PERIOD === 'month' && x.planMonth) {
    const elapsed = daysBetween(x.R.from, x.R.to), days = dim(x.R.from);
    const variable = x.cur.filter(t => !t.fixed).reduce((s, t) => s + t.eur, 0), fixed = x.total - variable;
    const proj = fixed + variable / elapsed * days;
    out.push(['bulb', proj > x.planMonth
      ? T('Якщо витрачати в тому ж темпі, до кінця місяця вийде <b>{0}</b> — це на <b>{1}</b> більше за бюджет.', fmt(proj), fmt(proj - x.planMonth))
      : T('У такому темпі місяць закінчиться на <b>{0}</b> — і ще лишиться <b>{1}</b> з бюджету.', fmt(proj), fmt(x.planMonth - proj))]);
  }
  if (x.R.pFrom && x.prevTotal) {
    const d = x.total - x.prevTotal;
    out.push([d > 0 ? 'trendUp' : 'trendDown', T(d > 0 ? 'Порівняно {0} — на <b>{1} більше</b>.' : 'Порівняно {0} — на <b>{1} менше</b>.', esc(x.R.label), fmt(Math.abs(d)))]);
  }
  if (topVar && !ST_CAT) out.push(['star', T('Найбільше змінних витрат — <b>{0}</b>: {1}, це {2}% усіх витрат.', esc(short(topVar)), fmt(vby[topVar]), Math.round(vby[topVar] / sum * 100))]);
  const smallN = x.real.filter(t => t.eur < 5), smallSum = smallN.reduce((s, t) => s + t.eur, 0);
  if (smallN.length >= 5) out.push(['receipt', T('Дрібні покупки до {0} — <b>{1} шт.</b> на суму <b>{2}</b>. Непомітно, але складається.', fmt(5, DISP, true), smallN.length, fmt(smallSum))]);
  const noSpend = Array.from({length: daysBetween(x.R.from, x.R.to)}, (_, i) => addDays(x.R.from, i)).filter(d => !x.real.some(t => t.date === d)).length;
  if (noSpend) out.push(['calendar', T('Днів без жодної покупки: <b>{0}</b>.', noSpend)]);
  $('#stInsights').innerHTML = `<h2>${T('Висновки')} <small>${T('автоматично')}</small></h2><div class="insights">${out.length ? out.map(([ic, t]) => `<div class="ins"><span class="ic">${svg(ic)}</span><span>${t}</span></div>`).join('') : `<div class="hint">${T('Замало даних для висновків.')}</div>`}</div>`;
}

  const plan = vc.reduce((s, c) => s + c.plan, 0) + extraBudget(), spent = vc.reduce((s, c) => s + c.fact, 0);
  return {ym, current: true, plan, spent, left: plan - spent, pct: plan ? spent / plan * 100 : 0,
    count: D.recent.filter(t => ymOf(t.date) === ym).length, avg: spent / Math.max(1, D.days.length),
    overDays: D.days.filter(d => d.date <= D.today && d.limit && d.spent > d.limit).length,
    cats: vc.reduce((o, c) => (o[c.name] = c.fact, o), {}), biggest: ''};
}

/* ---------- архів ---------- */
function arcMonth(m) {
  const cats = {};
  m.rows.forEach(r => cats[r[1]] = (cats[r[1]] || 0) + r[2]);
  const total = Object.values(cats).reduce((a, b) => a + b, 0);
  const sum = (D.months || []).find(s => s.ym === m.ym);
  const plan = sum ? sum.plan : D.categories.reduce((s, c) => s + c.plan, 0);
  return {cats, total, plan, left: plan - total};
}

function renderArchive() {
  const box = $('#archive'); if (!box) return;
  if (!A) { box.innerHTML = `<div class="sk-card"><div class="sk" style="height:48px"></div><div class="sk" style="height:72px"></div><div class="sk" style="height:72px"></div></div>`; return; }
  const c = D.close || {};

  const match = r => !q || (r[3] + ' ' + r[1] + ' ' + r[0]).toLowerCase().includes(q) || String(r[2]).includes(q);
  const months = A.months.map(m => ({...m, rows: m.rows.filter(match)})).filter(m => m.rows.length || !q);

  const head = `<section class="card">
    <h2>${T('Архів')} <small>${A.months.length ? `${plural(A.months.length, 'місяць', 'місяці', 'місяців')} · ${fmt(total)}` : ''}</small></h2>
    ${closeStatusHTML()}
    ${c.pending ? `<div class="pending" style="margin:var(--s3) 0 0"><span class="ic" style="color:var(--accent)">${svg('archive')}</span><div><b>${T('{0} ще в «Транзакціях»', monthName(c.pending))}</b>${T('Можна підсумувати й перенести в архів зараз')}</div><button class="btn btn-primary btn-sm" data-close-month="${c.pending}">${T('Перенести')}</button></div>` : ''}
  </section>`;

  if (!A.found || !A.months.length) {
    box.innerHTML = head + `<section class="card"><div class="empty"><div class="e-ic">${svg('archive')}</div><b>${T('Архів поки порожній')}</b>${T('Тут зʼявляться витрати минулих місяців після закриття місяця.')}</div></section>`;
    return;
  }

    let body = '';
    if (open) {
      const max = Math.max(...order.map(k => s.cats[k]), 1);
      const days = {};
      m.rows.forEach(r => (days[r[0]] = days[r[0]] || []).push(r));
      body = `<div class="arc-body">
        ${q ? '' : order.map(k => `<div class="hbar" style="--c:${catColor(k)}"><span class="ic">${catIcon(k)}</span><span class="nm">${esc(short(k))}</span><span class="v num">${fmt(s.cats[k])}<small>${Math.round(s.cats[k] / s.total * 100)}%</small></span><span class="track"><i style="width:${s.cats[k] / max * 100}%"></i></span></div>`).join('')}
        ${Object.keys(days).map(d => `<div class="group"><span>${dayLabel(d)}, ${DOW[parseD(d).getDay()]}</span><span class="num">${fmt(days[d].reduce((x, r) => x + r[2], 0))}</span></div>` +
          days[d].map(r => `<div class="tx" style="--c:${catColor(r[1])};cursor:default"><span class="ic">${catIcon(r[1])}</span><span style="min-width:0"><div class="t">${esc(r[3] || short(r[1]))}</div><div class="s">${esc(r[3] ? short(r[1]) : '')}</div></span><span class="a num">${fmt(r[2])}</span></div>`).join('')).join('')}
      </div>`;

    (list || `<div class="card"><div class="empty"><div class="e-ic">${svg('search')}</div><b>${T('Нічого не знайдено')}</b>${T('Спробуйте інше слово або суму.')}</div></div>`);

/* ПК: ліворуч список місяців, праворуч вибраний місяць і порівняння з іншим */

  const full = A.months.find(x => x.ym === sel.ym), s = arcMonth(full);

  const cmpM = ARC_CMP && ARC_CMP !== sel.ym ? A.months.find(x => x.ym === ARC_CMP) : null;
  const c = cmpM ? arcMonth(cmpM) : null;
  const ok = s.left >= 0, n = full.rows.length, days = dim(sel.ym + '-01');

const friendly = err => {

const tip = $('#tip');
let tipEl = null;
function showTip(el, ev) {
  tipEl = el; tip.innerHTML = el.getAttribute('data-tip'); tip.classList.add('on');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const cx = ev && ev.clientX != null && el.tagName === 'rect' ? ev.clientX : r.left + r.width / 2;
  let left = Math.min(Math.max(8, cx - tw / 2), innerWidth - tw - 8), top = r.top - th - 8;
  if (top < 8) top = r.bottom + 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  const svgEl = el.closest('svg'), xh = svgEl && svgEl.querySelector('.xh');
  if (xh && el.dataset.x) { xh.setAttribute('x1', el.dataset.x); xh.setAttribute('x2', el.dataset.x); xh.setAttribute('visibility', 'visible'); }
}
function hideTip() {
  tip.classList.remove('on'); tipEl = null;
  document.querySelectorAll('.xh').forEach(x => x.setAttribute('visibility', 'hidden'));
}
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') showTip(el, e); });
document.addEventListener('pointermove', e => { if (tipEl && tipEl.tagName === 'rect' && e.pointerType !== 'touch') showTip(tipEl, e); });
document.addEventListener('pointerout', e => { if (tipEl && !tipEl.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-tip]');
  if (e.pointerType === 'touch' && el && !el.matches('button')) showTip(el, e); else if (!el) hideTip();
});
addEventListener('scroll', hideTip, {passive: true});

/* ---------- завантаження ---------- */
async function load() {
  if (PWA && !isDemo() && !tokenOk() && (store.get('mode') !== 'google' || navigator.onLine !== false)) {
    // вхід застарів (раз на годину) — оновлюємо без вікон; не вийшло — кнопка «Увійти». Офлайн — показуємо збережене
    if (store.get('mode') === 'google' && !AUTH_ERR && reauth()) return;
    showSignIn(AUTH_ERR); return;
  }
  const r = $('#refresh'); r.setAttribute('aria-busy', 'true'); r.disabled = true; syncMark('wait');
  try {
    D = await api('getData'); syncMark('ok'); render(); if (S || document.body.classList.contains('t-stats')) loadStats(true); if (A || document.body.classList.contains('t-arch')) loadArchive(true);
    if (PWA && D.hub && D.hub.email) store.set('gHint', D.hub.email);
    // мова листів на пошту — та сама, що в програмі (сервер старої версії цього не знає — не страшно)
    if (!D.demo && D.lang !== LANG) api('setLang', LANG).then(() => { if (D) D.lang = LANG; }).catch(() => {});
    if (WANT_ADD) { WANT_ADD = false; const b = document.querySelector('[data-open-add]'); if (b) b.click(); }
    flushQueue();
  }
  catch (e) { syncMark('err');
    if (/NO_SHEET/.test(String(e))) { showWelcome(String(e).replace(/^.*NO_SHEET:?\s*/, '')); r.removeAttribute('aria-busy'); r.disabled = false; return; }
    if (!$('#gIn')) {
      // перший раз Google може попросити ввімкнути доступ для програм — даємо пряме посилання
      const apiSet = /APISET/.test(String(e));
      $('#root').innerHTML = `<div class="card"><div class="empty"><div class="e-ic">${svg(apiSet ? 'gear' : 'offline')}</div><b>${apiSet ? T('Ще один крок, лише один раз') : T('Ой, не вдалося відкрити таблицю')}</b>${esc(friendly(e))}<br>${apiSet ? `<a class="btn btn-secondary" href="https://script.google.com/home/usersettings" target="_blank" rel="noopener">${svg('ext')} ${T('Відкрити налаштування Google')}</a><br>` : ''}<button class="btn btn-primary" id="retry">${T('Спробувати ще раз')}</button></div></div>`;
    } }
  r.removeAttribute('aria-busy'); r.disabled = false;
}

  if (undoable) toast(res.queued ? T('Збережено на пристрої: {0} — надішлю в таблицю, щойно буде інтернет', fmtRaw(tx.amount, tx.currency)) : T('Збережено: {0} · {1}', fmtRaw(tx.amount, tx.currency), short(tx.category)), T('Скасувати'), async () => {

  if (D.hub) $('#budBody').insertAdjacentHTML('beforeend', `<div class="bud-tools" style="margin-top:var(--s3)"><button class="btn btn-quiet btn-sm" data-open-sheets>${svg('table')} ${T('Інша таблиця або нова порожня')}</button></div>`);
  openSheet('#budgetSheet');
}

function budChanges() {
  const out = [];
  D.categories.forEach(c => {
    if (!c.locked && !isNaN(BUD[c.name]) && Math.abs(BUD[c.name] - c.plan) > .005) out.push({name: c.name, plan: BUD[c.name], was: c.plan});
  });
  return out;
}

function budUpdate() {
  const total = D.categories.reduce((s, c) => s + (isNaN(BUD[c.name]) ? c.plan : BUD[c.name]), 0);
  const was = D.categories.reduce((s, c) => s + c.plan, 0), d = total - was;
  const bad = D.categories.some(c => !c.locked && (isNaN(BUD[c.name]) || BUD[c.name] < 0));
  $('#budSum').textContent = fmt(total, 'EUR');
  $('#budDiff').innerHTML = (Math.abs(d) > .005 ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d), 'EUR')}</span> ${T('до поточного')}<br>` : T('без змін') + '<br>') +
    (DISP !== 'EUR' ? `≈ ${fmt(total)}` : `≈ ${fmt(total, 'UAH')}`);
  document.querySelectorAll('[data-bud-row]').forEach(r => {
    const c = D.categories.find(x => x.name === r.dataset.budRow), v = BUD[c.name];
    r.classList.toggle('chg', !c.locked && !isNaN(v) && Math.abs(v - c.plan) > .005);
    r.classList.toggle('bad', !c.locked && (isNaN(v) || v < 0));
  });
  const n = budChanges().length, b = $('#budSave');
  b.disabled = bad || !n;
  b.textContent = bad ? T('Перевірте суми') : n ? T('Зберегти в таблицю') + ' · ' + plural(n, 'зміна', 'зміни', 'змін') : T('Зберегти в таблицю');
}

async function saveBudgets(changes, undoable) {
  const res = await api('setBudgets', changes);
  D = res.data; render(); refreshStats(); syncMark('ok');
  if (res.conflicts.length) {
    toast(T('Не збережено: {0} — їх щойно змінили в таблиці. Перевірте ще раз', res.conflicts.map(short).join(', ')), '', null, 'error');
  } else if (res.skipped.length) {
    toast(T('Пропущено: {0} (формула або немає в таблиці)', res.skipped.map(short).join(', ')), '', null, 'error');
  } else if (undoable) {
    toast(T('Бюджет оновлено в таблиці · {0}', plural(res.saved, 'категорія', 'категорії', 'категорій')), T('Повернути'), async () => {
      $('#toast').classList.remove('on');
      try { await saveBudgets(changes.map(c => ({name: c.name, plan: c.was, was: c.plan})), false); toast(T('Попередній бюджет повернуто')); }
      catch (err) { toast(friendly(err), '', null, 'error'); }
    });
  }
  return res;
}

/* ---------- категорії: додати, перейменувати, видалити ---------- */
// CED = чернетка: [{orig, name, del, moveTo, plan(для нових)}]
let CED = null;
function openCats() {
  if (!D) return;
  CED = D.categories.map(c => ({orig: c.name, name: c.name, del: false, moveTo: ''}));
  renderCats(); openSheet('#catSheet');
}
function catSpent(name) {
  const ym = D.today.slice(0, 7);
  return D.recent.filter(t => t.category === name && t.date.slice(0, 7) === ym).length;
}
function renderCats() {
  const live = CED.filter(c => !c.del);
  const fallback = n => (live.find(c => c.orig && /інше|other/i.test(c.orig) && c.orig !== n) || live.find(c => c.orig && c.orig !== n) || {}).orig || '';
  $('#catBody').innerHTML = `
    <div class="note">${T('Зміни записуються на дашборд таблиці. Під час перейменування назва зміниться й у всіх минулих витратах.')}</div>
    <div class="bud-list">${CED.map((c, i) => {
      const n = c.orig ? catSpent(c.orig) : 0;
      if (c.del) {
        if (!c.moveTo || !live.some(x => x.orig === c.moveTo)) c.moveTo = fallback(c.orig);
        return `<div class="bud cat-del" style="--c:${catColor(c.orig)}"><span class="ic">${catIcon(c.orig)}</span>
          <span class="nm"><s>${esc(short(c.orig))}</s><small>${n ? T('{0} цього місяця перенести в:', plural(n, 'витрату', 'витрати', 'витрат')) : T('буде видалено')}</small>
          ${n ? `<select class="selx" data-cmove="${i}">${live.filter(x => x.orig).map(x => `<option value="${esc(x.orig)}" ${x.orig === c.moveTo ? 'selected' : ''}>${esc(short(x.name))}</option>`).join('')}</select>` : ''}</span>
          <button class="btn btn-quiet btn-sm" data-cundo="${i}">${T('Повернути')}</button></div>`;
      }
      return `<div class="bud ${c.orig && c.name.trim() !== c.orig ? 'chg' : ''} ${!c.orig ? 'chg' : ''}" style="--c:${catColor(c.orig || c.name)}">
        <span class="ic">${catIcon(c.orig || c.name)}</span>
        <span class="nm"><input class="cname" data-cname="${i}" value="${esc(c.name)}" maxlength="40" placeholder="${T('Назва категорії')}" aria-label="${T('Назва категорії')}" autocomplete="off">
          <small>${c.orig ? (c.name.trim() !== c.orig ? T('було: {0}', esc(c.orig)) : n ? T('{0} цього місяця', plural(n, 'витрата', 'витрати', 'витрат')) : T('без витрат цього місяця')) : T('нова категорія')}</small></span>
        ${c.orig ? '' : `<span class="step"><label>€<input data-cplan="${i}" inputmode="decimal" value="${c.plan || ''}" placeholder="0" aria-label="${T('Бюджет нової категорії')}" autocomplete="off"></label></span>`}
        <button class="ib" data-cdel="${i}" title="${T('Видалити')}" aria-label="${T('Видалити категорію')}">${svg('trash')}</button>
      </div>`;
    }).join('')}</div>
    <button class="btn btn-secondary" data-cadd style="margin-top:var(--s3)">${svg('plus')} ${T('Нова категорія')}</button>
    <div class="errmsg" id="catErr" role="alert"></div>`;
  catUpdate();
}
function catOps() {
  const ops = [];
  CED.forEach(c => { if (c.orig && c.del) ops.push({op: 'delete', name: c.orig, moveTo: c.moveTo || ''}); });
  CED.forEach(c => { const n = c.name.trim().replace(/\s+/g, ' '); if (c.orig && !c.del && n !== c.orig) ops.push({op: 'rename', from: c.orig, to: n}); });
  CED.forEach(c => { if (!c.orig && !c.del && c.name.trim()) ops.push({op: 'add', name: c.name.trim().replace(/\s+/g, ' '), plan: budNum(c.plan || 0) || 0}); });
  return ops;
}
function catProblem() {
  const live = CED.filter(c => !c.del && (c.orig || c.name.trim()));
  if (!live.length) return T('Має лишитися хоча б одна категорія');
  const seen = {};
  for (const c of live) {
    const n = c.name.trim().replace(/\s+/g, ' ').toLowerCase();
    if (!n) return T('Вкажіть назву категорії');
    if (/всього|разом/.test(n)) return T('Назва не може містити «всього» чи «разом»');
    if (seen[n]) return T('Дві категорії з однаковою назвою: «{0}»', c.name.trim());
    seen[n] = 1;
  }
  // перейменування в назву, яку щойно видаляєте, плутає перенесення витрат
  const dels = CED.filter(c => c.del && c.orig).map(c => c.orig.toLowerCase());
  if (live.some(c => dels.includes(c.name.trim().toLowerCase()) && c.orig.toLowerCase() !== c.name.trim().toLowerCase())) return T('Спершу збережіть видалення, потім перейменовуйте в цю назву');
  return '';
}
function catUpdate() {
  const p = catProblem(), n = catOps().length, b = $('#catSave'), e = $('#catErr');
  if (e) { e.innerHTML = p ? svg('alert') + ' ' + esc(p) : ''; e.classList.toggle('on', !!p); }
  b.disabled = !!p || !n;
  b.textContent = n ? T('Зберегти в таблицю') + ' · ' + plural(n, 'зміна', 'зміни', 'змін') : T('Зберегти в таблицю');
}

/* ---------- оновлення: стара вкладка сама пропонує перезавантажитись ---------- */
// Google показує у вже відкритій вкладці (і в іконці на головному екрані) ту версію, з якою її відкрили.
// Щойно в таблиці нова версія коду — показуємо смужку «Оновити», яка відкриває те саме посилання наново.
function checkBuild() {
  if (!D || !D.build || D.build === BUILD) { const b = $('#upd'); if (b) b.remove(); return; }
  if ($('#upd')) return;
  const href = IS_GAS ? (D.appUrl || '') : location.href.replace(/#.*$/, '');
  const el = document.createElement('div');
  el.id = 'upd'; el.className = 'upd'; el.setAttribute('role', 'status');
  el.innerHTML = `${svg('refresh')}<span><b>${T('Є нова версія програми')}</b>${T('Натисніть «Оновити» — посилання й іконка лишаються ті самі.')}</span>` +
    (href ? `<a class="btn btn-primary btn-sm" href="${esc(href)}" target="_top">${T('Оновити')}</a>` : `<button class="btn btn-primary btn-sm" onclick="location.reload()">${T('Оновити')}</button>`);

/* ---------- синхронізація з таблицею ---------- */
// Додаток пише в таблицю одразу, а зміни, зроблені в самій таблиці чи AppSheet,
// підтягує сам: кожні 30 с, поки вкладка відкрита, і щоразу, коли до неї повертаєтесь.
let SYNC_AT = 0, SYNC_ST = 'wait', syncBusy = false;
function syncMark(st) { SYNC_ST = st; if (st === 'ok') SYNC_AT = Date.now(); syncLabel(); }
function syncLabel() {
  const el = $('#sync'); if (!el) return;
  if (PWA && !isDemo() && store.get('mode') !== 'google') { el.className = 'sync err'; el.textContent = T('вхід не виконано'); return; }
  if (PWA && NET === 'off') {
    el.className = 'sync err';
    el.textContent = T('офлайн') + ' · ' + (!Q.length ? T('показую збережені дані') : LANG === 'en' ? plural(Q.length, 'витрата') + ' waiting for internet'
      : plural(Q.length, 'витрата чекає', 'витрати чекають', 'витрат чекають') + ' інтернету');
    return;
  }
  if (PWA && Q.length) { el.className = 'sync wait'; el.textContent = T('надсилаю в таблицю: {0}', Q.length); return; }
  el.className = 'sync' + (SYNC_ST === 'ok' ? '' : SYNC_ST === 'err' ? ' err' : ' wait');
  if (SYNC_ST === 'err') { el.textContent = T('немає звʼязку з таблицею — спробую ще'); return; }
  if (SYNC_ST === 'wait') { el.textContent = T('синхронізую…'); return; }
  const s = Math.round((Date.now() - SYNC_AT) / 1000);
  el.textContent = D && D.demo ? T('демо: зміни не потрапляють у таблицю') : T('синхронізовано з таблицею {0}', s < 45 ? T('щойно') : s < 3600 ? T('{0} хв тому', Math.round(s / 60)) : T('давно'));
}
async function syncQuiet() {
  // не оновлюємо, коли відкрита форма — щоб не збити введення
  if (!D || syncBusy || document.hidden || $('#scrim').classList.contains('on')) return;
  syncBusy = true; const was = SYNC_ST; if (was !== 'ok') syncMark('wait');
  try {
    const d = await api('getData');
    if (JSON.stringify(d) !== JSON.stringify(D) && !$('#scrim').classList.contains('on')) {
      const ae = document.activeElement, id = ae && ae.id, pos = ae && ae.selectionStart;
      D = d; render(); refreshStats();
      const n = id && document.getElementById(id); if (n && n.focus) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }
    syncMark('ok');
    flushQueue();
  } catch (e) { syncMark('err'); }
  syncBusy = false;
}
addEventListener('online', () => { NET = 'on'; syncQuiet(); flushQueue(); });
addEventListener('offline', () => { NET = 'off'; syncLabel(); });
setInterval(syncQuiet, 30000);
setInterval(syncLabel, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncQuiet(); });
addEventListener('focus', syncQuiet);

      const res = await busy(t, T('Підсумовую…'), () => api('app_closeMonth', ds.ym));
      D = res.data; render(); showMonth(res.summary.ym); refreshStats(); if (A) loadArchive(true);
      toast(`${monthName(res.summary.ym)}: ${T('{0} з {1}', fmt(res.summary.spent), fmt(res.summary.plan))}${res.summary.moved ? ' · ' + T('{0} записів в архіві', res.summary.moved) : ''}`);
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (ds.month) showMonth(ds.month);

  /* витрати */
  else if (ds.row) { const tx = txByRow(+ds.row); if (tx) openTx(tx); }
  else if (t.parentElement && t.parentElement.id === 'eCurSeg') {
    EDIT.currency = ds.c; t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); editUpdate();
  }
  else if (ds.ecat) {
    EDIT.category = ds.ecat;
    document.querySelectorAll('[data-ecat]').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    editUpdate();
  }
  else if (t.id === 'eSave') {
    const o = OPEN_TX, p = editChanges(); if (!o || !p) return;
    const before = {amount: o.amount, currency: normCur(o.currency), date: o.date, note: o.note, category: o.category};
    try {
      D = await busy(t, T('Записую…'), () => api('updateTransaction', o.row, o.amount, p));
      LAST = null; render(); refreshStats(); closeSheets(); refind();
      toast(T('Зміни збережено в таблиці'), T('Повернути'), async () => {
        $('#toast').classList.remove('on');
        try { D = await api('updateTransaction', o.row, p.amount, before); render(); refreshStats(); refind(); toast(T('Попередні дані повернуто')); }
        catch (err) { toast(friendly(err), '', null, 'error'); }
      });
    } catch (err) { toast(friendly(err), '', null, 'error'); }
  }
  else if (t.id === 'del') {
    if (!OPEN_TX) return; t.disabled = true;
    try { await removeTx(OPEN_TX); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false;
  }
  else if (t.id === 'save') {
    const amount = parseFloat($('#amt').value.replace(',', '.'));
    if (!(amount > 0)) { setAmtError(true); $('#amt').focus(); return; }
    if (ADD_KIND === 'inc') {
      const it = {date: $('#date').value || D.today, amount: Math.round(amount * 100) / 100, currency: ADD_CUR, note: $('#note').value.trim()};
      t.disabled = true; t.textContent = T('Зберігаю…');
      try {
        const res = await api('addIncome', it);
        D = res.data; render(); pulse(); closeSheets();
        toast(T('Дохід: +{0}', fmtRaw(it.amount, it.currency)) + (it.note ? ' · ' + it.note : ''), T('Скасувати'), async () => {
          $('#toast').classList.remove('on');
          try { D = await api('deleteIncome', res.row, it.amount); render(); toast(T('Дохід скасовано')); } catch (err) { toast(friendly(err), '', null, 'error'); }
        });
      } catch (err) { toast(friendly(err), '', null, 'error'); }
      t.disabled = false; t.textContent = T('Додати дохід');
      return;
    }
    const tx = {date: $('#date').value || D.today, amount: Math.round(amount * 100) / 100, currency: ADD_CUR, category: ADD_CAT, note: cleanNote($('#note').value)};
    t.disabled = true; t.textContent = T('Зберігаю…');
    try { await addTx(tx, true); closeSheets(); } catch (err) { toast(friendly(err), '', null, 'error'); }
    t.disabled = false; t.textContent = T('Додати витрату');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'amt') { e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1'); updateEqv(); }
  else if (e.target.id === 'eAmt') {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1');
    const v = budNum(e.target.value); EDIT.amount = isNaN(v) ? 0 : v; editUpdate();
  }
  else if (e.target.id === 'eDate') { EDIT.date = e.target.value; editUpdate(); }
  else if (e.target.id === 'eNote') { EDIT.note = e.target.value.trim(); editUpdate(); }
  else if (e.target.id === 'q') { QUERY = e.target.value; findAll(QUERY); renderHistory(); }
  else if (e.target.id === 'tq') { TQ = e.target.value; findAll(TQ); renderTableRows(); }
  else if (e.target.dataset && e.target.dataset.cname != null) {
    CED[+e.target.dataset.cname].name = e.target.value;
    const row = e.target.closest('.bud'), c = CED[+e.target.dataset.cname];
    if (row && c.orig) row.classList.toggle('chg', c.name.trim() !== c.orig);
    catUpdate();
  }
  else if (e.target.dataset && e.target.dataset.cplan != null) {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '');
    CED[+e.target.dataset.cplan].plan = e.target.value; catUpdate();
  }
  else if (e.target.dataset && e.target.dataset.bud != null) {
    e.target.value = e.target.value.replace(/[^\d.,]/g, '').replace(/([.,]\d{2}).+$/, '$1');
    BUD[e.target.dataset.bud] = e.target.value === '' ? NaN : budNum(e.target.value); budUpdate();
  }
  else if (e.target.id === 'arcQ') {
    ARC_Q = e.target.value; const pos = e.target.selectionStart; renderArchive();
    const n = $('#arcQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'note') guessFromNote(e.target.value);
  else if (e.target.id === 'arcCmp') { ARC_CMP = e.target.value; renderArchive(); }
  else if (e.target.dataset && e.target.dataset.cmove != null) CED[+e.target.dataset.cmove].moveTo = e.target.value;
});
['amt', 'note'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') { if (id === 'note') guessFromNote(e.target.value); $('#save').click(); } }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheets(); hideTip(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-row]')) e.target.click();
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bud != null) { e.preventDefault(); $('#budSave').click(); }
});

// Перехід між телефонним і ПК-виглядом (зміна ширини вікна)
const onDesk = () => { hideTip(); if (D) render(); if (A) renderArchive(); };
if (DESK.addEventListener) DESK.addEventListener('change', onDesk); else DESK.addListener(onDesk);

// Лінійний графік перемальовується, коли змінюється ширина
let rsT, lastW = 0;
new ResizeObserver(() => {
  const w = $('#stats').clientWidth; if (Math.abs(w - lastW) < 8) return; lastW = w;
  clearTimeout(rsT); rsT = setTimeout(() => { if (S && document.body.classList.contains('t-stats')) renderStats(); }, 120);
}).observe($('#stats'));

document.querySelectorAll('#dispSeg button').forEach(b => b.classList.toggle('on', b.dataset.c === DISP));
if (PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
